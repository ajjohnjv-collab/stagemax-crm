<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STAGEMAX CRM</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#12100E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StageMax">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
--ink:#12100E; --panel:#1B1815; --panel-2:#241F1B; --line:#332C26;
--paper:#EDE7DF; --muted:#9A8E82;
--amber:#E8A33D; --rose:#C2506B; --cyan:#4AA3B8; --green:#6E9E5C; --violet:#8A6BA8;
--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font:400 15px/1.5 Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 96px}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(18,16,14,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hbar{max-width:760px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:10px}
.mark{font:700 18px Archivo Narrow;letter-spacing:.14em;text-transform:uppercase}
.mark span{color:var(--amber)}
.who{margin-left:auto;font-size:12px;color:var(--muted)}
.who button{color:var(--muted);text-decoration:underline;font-size:12px;margin-left:8px}

/* tabs */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:11px 4px 13px;font:600 11px Archivo;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;border-top:2px solid transparent}
nav button.on{color:var(--paper);border-top-color:var(--amber)}

/* side nav on wider screens (desktop / computer use) */
@media (min-width:860px){
.hbar{max-width:none;padding-left:224px}
nav{top:53px;left:0;right:auto;bottom:0;width:200px;flex-direction:column;border-top:none;border-right:1px solid var(--line);padding-bottom:16px}
nav button{flex:none;text-align:left;padding:13px 20px;border-top:none;border-left:3px solid transparent}
nav button.on{border-top-color:transparent;border-left-color:var(--amber)}
.wrap{max-width:900px;margin:0 auto 0 224px;padding:20px 24px 40px}
.fab{left:216px;right:auto}
}

/* generic */
h2{font:700 13px Archivo;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:9px}
.row{display:flex;gap:10px;align-items:baseline}
.grow{flex:1;min-width:0}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.amt{font:700 16px Archivo Narrow;white-space:nowrap}
.tag{display:inline-block;font:600 10.5px Archivo;letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:var(--panel-2);color:var(--muted)}
.tag.due{background:rgba(194,80,107,.16);color:#E8899E}
.tag.paid{background:rgba(110,158,92,.16);color:#9BC489}
.empty{padding:44px 18px;text-align:center;color:var(--muted);font-size:14px}
.err{background:rgba(194,80,107,.14);border:1px solid rgba(194,80,107,.4);color:#EFA3B3;padding:11px 13px;border-radius:var(--r);margin:12px 0;font-size:13.5px}

/* stage chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;color:var(--muted)}
.chip.on{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:600}
.chip b{font-weight:700;margin-left:5px;opacity:.65}

/* forms */
label{display:block;font:600 11px Archivo;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:13px 0 5px}
input,select{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
input:focus,select:focus{outline:2px solid var(--amber);outline-offset:-1px}
.btn{width:100%;background:var(--amber);color:#1A1206;font-weight:700;padding:13px;border-radius:8px;margin-top:18px}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper);font-weight:600;margin-top:9px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 76px 1fr;gap:8px;align-items:end;margin-bottom:8px}

/* dashboard */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat .v{font:700 20px Archivo Narrow;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.legend{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}

/* bars */
.bar{height:7px;border-radius:4px;background:var(--panel-2);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--amber)}

/* dashboard v2 */
.dash-hero{display:flex;align-items:center;gap:12px;margin:14px 0 2px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--amber);color:#1A1206;font:700 15px Archivo Narrow;display:flex;align-items:center;justify-content:center;flex:none}
.greet{flex:1;min-width:0}
.greet h1{font:700 19px Archivo Narrow;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.greet p{font-size:12px;color:var(--muted);margin-top:1px}
.iconbtn{position:relative;width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
.iconbtn .dot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--rose);border:2px solid var(--ink)}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:10px 0 2px;color:var(--muted)}
.search input{background:none;border:none;padding:0;flex:1;font-size:14px;color:var(--paper)}
.search input:focus{outline:none}
.search-results{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-top:6px;overflow:hidden}
.search-results .item{padding:10px 13px;cursor:pointer}
.search-results .item:hover{background:var(--panel-2)}

.stats4{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
@media (min-width:640px){.stats4{grid-template-columns:repeat(4,1fr)}}
.stat2{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:9px}
.stat2 .isq{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.stat2 .v{font:700 21px Archivo Narrow;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat2 .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}

.qa-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:9px}
@media (min-width:640px){.qa-grid{grid-template-columns:repeat(4,1fr)}}
.qa{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;font:600 11.5px Archivo;text-align:center;color:var(--paper)}
.qa .isq{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center}

.cols3{display:grid;gap:12px;grid-template-columns:1fr;margin-bottom:6px}
@media (min-width:860px){.cols3{grid-template-columns:1fr 1fr 1fr;align-items:start}}
.plrow{display:flex;align-items:center;gap:8px;padding:7px 0}
.plrow:not(:last-child){border-bottom:1px solid var(--line)}
.thead{display:none;padding:0 13px;font:600 10.5px Archivo;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
@media (min-width:700px){.thead{display:flex;gap:12px}}
.thead span{flex:none}
.trow{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;margin-bottom:7px}
.actrow{display:flex;gap:5px;flex:none}
.iact{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;text-decoration:none}
.iact.call{background:rgba(110,158,92,.16);color:#9BC489}
.iact.wa{background:rgba(74,163,184,.16);color:#8FD0E2}
.iact.done{background:rgba(232,163,61,.16);color:var(--amber)}
.pav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:640px){.pav{grid-template-columns:repeat(4,1fr)}}
.pav .card{margin-bottom:0}
.pav .n{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* login */
.login{max-width:340px;margin:16vh auto;padding:0 18px}
.login .mark{font-size:26px;margin-bottom:6px}
.login p{color:var(--muted);font-size:13.5px;margin-bottom:20px}

.fab{position:fixed;right:16px;bottom:74px;z-index:29;background:var(--amber);color:#1A1206;width:52px;height:52px;border-radius:50%;font-size:26px;line-height:1;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.back{color:var(--muted);font-size:13px;padding:14px 0 2px}
.item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.item:last-child{border-bottom:none}
.qty{color:var(--muted);font-size:13px;white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ─────────────────────────────────────────────
PASTE YOUR TWO VALUES HERE
Supabase → Project Settings → API
───────────────────────────────────────────── */
const SUPABASE_URL = 'https://yuntnxsfwszzhcticwfr.supabase.co';
const SUPABASE_ANON = 'sb_publishable_WV9HzwnxjOjy9AzyGyvT2w_qGv825o_';
/* ───────────────────────────────────────────── */

const sb = createClient(SUPABASE_URL, SUPABASE_ANON, {
auth: { persistSession: false, autoRefreshToken: true }
});

const app = document.getElementById('app');
const rs = n => '₹' + Number(n||0).toLocaleString('en-IN');
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day = d => d ? new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : '';
const waLink = p => p ? `https://wa.me/91${esc(String(p).replace(/\D/g,'').slice(-10))}` : '';
const telLink = p => p ? `tel:${esc(String(p).replace(/\D/g,''))}` : '';
const monthStart = () => new Date().toISOString().slice(0,7)+'-01';

const ICONS = {
call:'<path d="M4 3h3l1.4 3.8L7 8.3a9 9 0 0 0 4.6 4.6l1.5-1.4L17 13v3a1 1 0 0 1-1.1 1A13 13 0 0 1 3 4.1 1 1 0 0 1 4 3Z"/>',
wa:'<path d="M3 17l1.2-3.5A6.5 6.5 0 1 1 7.5 16L3 17Z"/><path d="M7 8.5c.3 2 2 3.7 4 4"/>',
pin:'<path d="M10 18s6-5.6 6-10.2A6 6 0 1 0 4 7.8C4 12.4 10 18 10 18Z"/><circle cx="10" cy="7.6" r="2"/>',
plus:'<path d="M10 4v12M4 10h12"/>',
list:'<path d="M4 5.5h12M4 10h12M4 14.5h12"/>',
cart:'<path d="M4 4h2l1.4 9h8L17 7H7"/><circle cx="9" cy="16.3" r="1.2"/><circle cx="15" cy="16.3" r="1.2"/>',
truck:'<path d="M3 6.5h8v6.5H3zM11 9.5h3l3 3v.5h-6z"/><circle cx="6.3" cy="16" r="1.3"/><circle cx="14.3" cy="16" r="1.3"/>',
wallet:'<path d="M4 6h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/><circle cx="14" cy="11" r="1"/>',
bell:'<path d="M10 3a4 4 0 0 0-4 4v3l-1.4 2.7h10.8L14 10V7a4 4 0 0 0-4-4z"/><path d="M8.3 15.7a1.7 1.7 0 0 0 3.4 0"/>',
search:'<circle cx="8.5" cy="8.5" r="5"/><path d="M16 16l-3.6-3.6"/>',
flame:'<path d="M10 2.3s3.7 3.8 3.7 7.7a3.7 3.7 0 1 1-7.4 0c0-.9.4-1.8.9-2.6.3.9 1 1.3 1.4.9.5-.6 0-1.8-.5-2.7C7.3 3.4 8.6 2.8 10 2.3z"/>',
check:'<path d="M4 10.3l3.6 3.6L16 5.5"/>',
doc:'<path d="M6 3h6l3 3v11H6z"/><path d="M12 3v3h3"/>',
users:'<circle cx="7" cy="7" r="2.4"/><path d="M2.5 16.5c0-2.6 2-4.2 4.5-4.2s4.5 1.6 4.5 4.2"/><circle cx="14.5" cy="7.5" r="2"/><path d="M13 12.6c1.8.2 3.5 1.5 3.5 3.9"/>'
};
const ic = (name,cls='') => `<svg${cls?` class="${cls}"`:''} width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;

let S = { me:null, tab:'pipeline', pipeline:1, stage:null, deal:null, teamRange:30, chaseTab:'all', search:'', searchResults:null,
pipelines:[], stages:[], products:[], profiles:[], sources:[], deals:[], pending:[], movement:[], team:[],
dues:[], duesOpen:null, duesDeals:[], dispatchReady:[], dispatchSent:[],
dashTrend:[], dashSources:[], dashProducts:[], dashDuesTotal:0, dashPipelineValue:0,
myPerf:[], myRevivals:[], myPromises:[],
openDeals:[], followUps:[], activity:[], monthPerf:[], monthWonIds:[], dealFollowUps:[], err:'' };

function isOwner(){ return S.me?.role==='owner'; }

/* ── auth ── */
async function boot(){
const { data:{ session } } = await sb.auth.getSession();
if(!session) return renderLogin();
const { data:prof } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
S.me = prof || { full_name: session.user.email, role:'cre', id: session.user.id };
S.tab = isOwner() ? 'dashboard' : 'mydash';
await loadRefs();
await loadTab();
}

function renderLogin(msg){
app.innerHTML = `<div class="login">
<div class="mark">StageMax<span> CRM</span></div>
<p>StageMax CRM — sign in to work your leads.</p>
${msg?`<div class="err">${esc(msg)}</div>`:''}
<label for="em">Email</label><input id="em" type="email" autocomplete="username">
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
<button class="btn" id="go">Sign in</button>
</div>`;
const go = async () => {
const b=document.getElementById('go'); b.disabled=true; b.textContent='Signing in…';
const { error } = await sb.auth.signInWithPassword({
email: document.getElementById('em').value.trim(),
password: document.getElementById('pw').value
});
if(error) return renderLogin(error.message);
boot();
};
document.getElementById('go').onclick = go;
document.getElementById('pw').onkeydown = e => { if(e.key==='Enter') go(); };
}

/* ── data ── */
async function loadRefs(){
const [p,st,pr,pf,sr] = await Promise.all([
sb.from('pipelines').select('*').eq('is_active',true).order('sort_order'),
sb.from('stages').select('*').order('sort_order'),
sb.from('products').select('*').eq('is_active',true).order('name'),
sb.from('profiles').select('*').eq('is_active',true),
sb.from('sources').select('*').eq('is_active',true)
]);
S.pipelines=p.data||[]; S.stages=st.data||[]; S.products=pr.data||[]; S.profiles=pf.data||[]; S.sources=sr.data||[];
}

async function loadChaseSources(){
const today = new Date().toISOString().slice(0,10);
const [revR,promR] = await Promise.all([
sb.from('deals').select('*, customers(name,phone,district), stages(name,is_lost)')
.not('revival_date','is',null).lte('revival_date', today).order('revival_date',{ascending:true}),
sb.from('deals').select('*, customers(name,phone,district), stages(name,is_delivered)')
.not('balance_promised_date','is',null).lte('balance_promised_date', today).order('balance_promised_date',{ascending:true})
]);
if(revR.error) throw revR.error; S.myRevivals = (revR.data||[]).filter(d=>d.stages?.is_lost);
if(promR.error) throw promR.error;
S.myPromises = (promR.data||[]).filter(d=>(Number(d.value||0)-Number(d.amount_collected||0))>0);
}

async function loadDashboardShared(){
const today = new Date().toISOString().slice(0,10);
const mStart = monthStart();
const [openR,fuR,actR,mpR,weR] = await Promise.all([
sb.from('deals').select('*, customers(name,phone,district), stages(name,is_won,is_lost,is_delivered,pipeline_id,sort_order), pipelines(name,sort_order)')
.order('created_at',{ascending:false}).limit(300),
sb.from('follow_ups').select('*, deals(title, customers(name,phone))').eq('done',false).lte('due_date', today).order('due_date',{ascending:true}),
sb.from('activity_log').select('*, deals(title, customers(name))').order('created_at',{ascending:false}).limit(10),
sb.from('cre_performance_daily').select('*').gte('day', mStart),
sb.from('stage_events').select('deal_id,to_stage_id,changed_at').gte('changed_at', mStart)
]);
if(openR.error) throw openR.error; S.openDeals = openR.data||[];
if(fuR.error) throw fuR.error; S.followUps = fuR.data||[];
if(actR.error) throw actR.error; S.activity = actR.data||[];
if(mpR.error) throw mpR.error; S.monthPerf = mpR.data||[];
if(weR.error) throw weR.error;
const wonStageIds = new Set(S.stages.filter(s=>s.is_won).map(s=>s.id));
S.monthWonIds = [...new Set((weR.data||[]).filter(r=>wonStageIds.has(r.to_stage_id)).map(r=>r.deal_id))];
}

async function loadTab(){
S.err='';
try{
if(S.tab==='pipeline'){
const { data, error } = await sb.from('deals')
.select('*, customers(name,phone,district), stages(name,is_delivered,is_lost)')
.eq('pipeline_id', S.pipeline).order('created_at',{ascending:false}).limit(200);
if(error) throw error; S.deals = data||[];
}
if(S.tab==='money'){
const { data, error } = await sb.from('payments_pending').select('*');
if(error) throw error; S.pending = data||[];
}
if(S.tab==='moving'){
const { data, error } = await sb.from('product_movement').select('*');
if(error) throw error; S.movement = data||[];
}
if(S.tab==='dashboard'){
const since = new Date(Date.now() - S.teamRange*86400000).toISOString().slice(0,10);
const trendSince = new Date(Date.now() - 13*86400000).toISOString().slice(0,10);
const openIds = S.stages.filter(s=>!s.is_lost && !s.is_delivered).map(s=>s.id);
const [teamR,trendR,srcR,prodR,duesR,pipeR] = await Promise.all([
sb.from('cre_performance_daily').select('*').gte('day', since),
sb.from('cre_performance_daily').select('day,value_delivered,money_collected').gte('day', trendSince),
sb.from('deals').select('source_id').gte('created_at', since),
sb.from('product_movement').select('*').limit(5),
sb.from('customer_balance_summary').select('total_balance'),
sb.from('deals').select('value').in('stage_id', openIds.length?openIds:[-1])
]);
if(teamR.error) throw teamR.error; S.team = teamR.data||[];
if(trendR.error) throw trendR.error;
const byDay={};
(trendR.data||[]).forEach(r=>{
const k=r.day; if(!byDay[k]) byDay[k]={day:k,value:0,money:0};
byDay[k].value += Number(r.value_delivered||0); byDay[k].money += Number(r.money_collected||0);
});
S.dashTrend = Object.values(byDay).sort((a,b)=>a.day.localeCompare(b.day));
if(srcR.error) throw srcR.error;
const bySrc={};
(srcR.data||[]).forEach(r=>{ const k=r.source_id??'none'; bySrc[k]=(bySrc[k]||0)+1; });
S.dashSources = Object.entries(bySrc).map(([sid,count])=>({
name: sid==='none' ? 'Unknown' : (S.sources.find(s=>s.id===Number(sid))?.name || 'Unknown'), count
})).sort((a,b)=>b.count-a.count);
if(prodR.error) throw prodR.error; S.dashProducts = prodR.data||[];
if(duesR.error) throw duesR.error;
S.dashDuesTotal = (duesR.data||[]).reduce((a,b)=>a+Number(b.total_balance||0),0);
if(pipeR.error) throw pipeR.error;
S.dashPipelineValue = (pipeR.data||[]).reduce((a,b)=>a+Number(b.value||0),0);
await loadChaseSources();
await loadDashboardShared();
}
if(S.tab==='mydash'){
const since = new Date(Date.now() - S.teamRange*86400000).toISOString().slice(0,10);
const { data:perfData, error:perfErr } = await sb.from('cre_performance_daily').select('*').gte('day', since);
if(perfErr) throw perfErr; S.myPerf = perfData||[];
await loadChaseSources();
await loadDashboardShared();
}
if(S.tab==='dues'){
const { data, error } = await sb.from('customer_balance_summary').select('*');
if(error) throw error; S.dues = data||[]; S.duesOpen=null; S.duesDeals=[];
}
if(S.tab==='dispatch'){
const readyIds = S.stages.filter(s=>s.is_won && !s.is_delivered).map(s=>s.id);
const [r1,r2] = await Promise.all([
sb.from('deals').select('*, customers(name,phone,district,address), stages(name)')
.in('stage_id', readyIds.length?readyIds:[-1]).order('created_at',{ascending:true}),
sb.from('deals').select('*, customers(name,phone,district)')
.not('courier_name','is',null).order('dispatch_date',{ascending:false}).limit(25)
]);
if(r1.error) throw r1.error; if(r2.error) throw r2.error;
S.dispatchReady = r1.data||[]; S.dispatchSent = r2.data||[];
}
}catch(e){ S.err = e.message || String(e); }
render();
}

/* ── dashboard (owner only) ── */
function trendChart(data){
if(!data.length) return '<div class="empty">No activity yet.</div>';
const w=320, h=104, pad=2, top=6;
const max = Math.max(1, ...data.map(d=>Math.max(d.value,d.money)));
const bw = (w-pad*2)/data.length;
const barW = Math.max(1.5,(bw-3)/2);
const bars = data.map((d,i)=>{
const x = pad + i*bw;
const vh = Math.round((d.value/max)*(h-top));
const mh = Math.round((d.money/max)*(h-top));
return `<rect x="${x.toFixed(1)}" y="${h-vh}" width="${barW.toFixed(1)}" height="${vh}" fill="var(--amber)"/>`+
`<rect x="${(x+barW+1.5).toFixed(1)}" y="${h-mh}" width="${barW.toFixed(1)}" height="${mh}" fill="var(--cyan)"/>`;
}).join('');
return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:104px;display:block" preserveAspectRatio="none">${bars}</svg>`;
}

function donutChart(data){
const total = data.reduce((a,b)=>a+b.count,0);
if(!total) return '<div class="empty">No leads in this period.</div>';
const colors=['var(--amber)','var(--rose)','var(--cyan)','var(--green)','var(--violet)','var(--muted)'];
const r=40, c=2*Math.PI*r, cx=52, cy=52;
let offset=0;
const circles = data.map((d,i)=>{
const len = (d.count/total)*c;
const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="15" stroke-dasharray="${len.toFixed(1)} ${(c-len).toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>`;
offset += len; return seg;
}).join('');
const legend = data.map((d,i)=>`<div class="row" style="gap:7px;margin-top:6px">
<span class="dot" style="background:${colors[i%colors.length]}"></span>
<span class="sub grow">${esc(d.name)}</span><span class="sub">${d.count}</span>
</div>`).join('');
return `<div class="row" style="align-items:center;gap:16px">
<svg width="104" height="104" viewBox="0 0 104 104" style="flex:none">${circles}</svg>
<div class="grow">${legend}</div>
</div>`;
}

S.followUps.forEach(f=>items.push({

name:f.deals?.customers?.name||'No customer', phone:f.deals?.customers?.phone,
detail:f.note || f.deals?.title || 'Scheduled follow-up', isFu:true, fuId:f.id
}));
S.myRevivals.forEach(d=>items.push({
type:'call', date:d.revival_date, dealId:d.id,
name:d.customers?.name||'No customer', phone:d.customers?.phone,
detail:d.lost_reason||'Follow up on lost lead'
}));
S.myPromises.forEach(d=>{
const bal=Number(d.value||0)-Number(d.amount_collected||0);
items.push({type:'whatsapp', date:d.balance_promised_date, dealId:d.id,
name:d.customers?.name||'No customer', phone:d.customers?.phone,
detail:`Payment promised · ${rs(bal)}`});
});
items.sort((a,b)=>(a.date||'').localeCompare(b.date||''));

function pipelineBreakdown(rows){
const by={};
rows.forEach(d=>{
const st=d.stages; if(!st) return;
const k=d.pipeline_id+'-'+d.stage_id;
if(!by[k]) by[k]={pName:d.pipelines?.name||'', stage:st.name, sort:(d.pipelines?.sort_order||0)*100+(st.sort_order||0), isLost:st.is_lost, isWon:st.is_won, isDelivered:st.is_delivered, count:0};
by[k].count++;
});
return Object.values(by).sort((a,b)=>a.sort-b.sort);
}
function stageColor(row){
if(row.isLost) return 'var(--rose)';
if(row.isDelivered) return 'var(--green)';
if(row.isWon) return 'var(--amber)';
return 'var(--cyan)';
}

const VERB_LABEL = {
lead_created:'New lead added', lead_assigned:'Lead reassigned', stage_moved:'Stage updated',
quotation_sent:'Quotation sent', payment_received:'Payment received', dispatched:'Order dispatched',
followup_completed:'Follow-up completed', hot_marked:'Marked as hot lead'

function timeAgo(ts){
const s = Math.max(1, Math.round((Date.now()-new Date(ts).getTime())/1000));
if(s<60) return s+'s ago';
const m=Math.round(s/60); if(m<60) return m+'m ago';
const h=Math.round(m/60); if(h<24) return h+'h ago';
const d=Math.round(h/24); return d+'d ago';
}
function recentUpdates(){
if(!S.activity.length) return `<div class="card"><h2 style="margin-top:0">Recent updates</h2><div class="empty">Nothing logged yet.</div></div>`;
const rows = S.activity.map(a=>{
const who = S.profiles.find(p=>p.id===a.actor_id)?.full_name || '';
const label = VERB_LABEL[a.verb] || a.verb;
const name = a.deals?.customers?.name || a.detail || '';
const whoTxt = isOwner() && who ? who+' · ' : '';
return `<div class="item" ${a.deal_id?`data-deal="${a.deal_id}" style="cursor:pointer"`:''}>
<div class="grow">${esc(label)}${name?' — '+esc(name):''}<span class="sub" style="display:block">${esc(whoTxt)}${timeAgo(a.created_at)}</span></div>

return `<div class="card"><h2 style="margin-top:0">Recent updates</h2>${rows}</div>`;
}

function productAvailability(){
const cats = {};
S.products.forEach(p=>{

const body = list.map(c=>`<div class="card">

async function toggleDue(cid){
if(S.duesOpen===cid){ S.duesOpen=null; S.duesDeals=[]; render(); return; }
S.duesOpen=cid; S.duesDeals=[]; render();
const { data, error } = await sb.from('deals')
.select('*, stages(is_delivered)')
.eq('customer_id', cid);
if(error){ S.err=error.message; render(); return; }

.filter(d=>d.stages?.is_delivered && (Number(d.value||0)-Number(d.amount_collected||0))>0)
.sort((a,b)=> new Date(a.delivered_at||0) - new Date(b.delivered_at||0));
render();
}

async function markDispatched(id,btn){

const deal=S.dispatchReady.find(x=>x.id===id);
const courier=document.getElementById('cr-'+id).value.trim();
const awb=document.getElementById('awb-'+id).value.trim();
const target=S.stages.find(s=>s.pipeline_id===deal.pipeline_id && s.is_delivered);
const upd={ courier_name:courier||null, awb_number:awb||null, dispatch_date:new Date().toISOString().slice(0,10) };

await sb.from('deals').update(upd).eq('id',id);
if(target) await sb.from('stage_events').insert({deal_id:id,from_stage_id:deal.stage_id,to_stage_id:target.id,changed_by:S.me.id});
await logActivity('dispatched', id, [courier,awb].filter(Boolean).join(' · ') || (deal.customers?.name||''));
loadTab();
}catch(err){ S.err=err.message||String(err); render(); }
}

district:document.getElementById('cdist').value.trim()||null, state:'Kerala' })
.select('id').single();

pipeline_id:Number(document.getElementById('npipe').value),
stage_id:Number(document.getElementById('nstage').value),
customer_id:cid,
title:document.getElementById('ntitle').value.trim()||name,
value:Number(document.getElementById('nval').value||0),
amount_collected:0,
source_id:document.getElementById('nsource').value ? Number(document.getElementById('nsource').value) : null,
assigned_to:(isOwner() && document.getElementById('nassign')) ? document.getElementById('nassign').value : S.me.id
}).select('id').single();
if(de) throw de;

const rows=[...document.querySelectorAll('#items .three')].map((r,i)=>({
deal_id:deal.id,
product_id:r.querySelector('.p').value?Number(r.querySelector('.p').value):null,
qty:Number(r.querySelector('.q').value||1),
rate:Number(r.querySelector('.r').value||0),
sort_order:i+1
})).filter(r=>r.product_id);
if(rows.length) await sb.from('deal_items').insert(rows);
await logActivity('lead_created', deal.id, name);

S.tab='pipeline'; S.pipeline=Number(document.getElementById('npipe').value); loadTab();
}catch(err){
S.err=err.message||String(err); btn.disabled=false; btn.textContent='Save deal'; render();
}
}

boot();

if ('serviceWorker' in navigator) {
window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
