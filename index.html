/* ── Phase 2: My Leads (CRE) ── */
function leadStageColor(st){
if(!st) return 'var(--cd-muted)';
if(st.is_lost) return 'var(--rose)';
if(st.is_delivered) return 'var(--green)';
if(st.is_won) return 'var(--amber)';
return 'var(--cyan)';
}

function findQuotedStage(pipelineId){
return S.stages.find(s=>s.pipeline_id===pipelineId && /quoted/i.test(s.name||''));
}

// Forward-only guard for the "Create Estimate" quick action. It must never be
// possible to use this button to move a deal BACKWARD (or sideways) in the
// pipeline -- e.g. a deal already at Confirmed/Won or Delivered must never be
// silently downgraded to Quoted just because someone opened/created an
// Estimate. Only a deal that hasn't reached Quoted yet (lower sort_order) may
// be advanced into it this way. This is the single source of truth used both
// to decide whether the button renders and, defensively, inside the click
// handler itself in case of a stale render.
function canAdvanceToQuoted(d, stages){
const target = stages.find(s=>s.pipeline_id===d.pipeline_id && /quoted/i.test(s.name||''));
const cur = stages.find(s=>s.id===d.stage_id);
if(!target || !cur) return false;
return cur.sort_order < target.sort_order;
}

function isRetailPipeline(pipelineId){
return S.pipelines.find(p=>p.id===pipelineId)?.name==='Retail Sales';
}

// Single source of truth for "which Global Estimates bucket is this deal
// in, if any" -- shared verbatim by the CRE Today dashboard's Estimate KPI
// tiles (cdKpis) and the Global Estimates screen (viewEstimatesGlobal) so
// the two can never disagree. Retail Sales only; Dealer/Repairs never
// match. A deal that has reached a Won stage (100% payment, or the
// existing auto-confirm-at-₹0 behavior) has graduated to Orders and
// returns null -- Global Estimates is ACTIVE estimates only.
//
// Approval is authoritative over Sent/Draft classification (confirmed):
// an Estimate can be approved without ever having estimate_sent_at
// recorded (Send is a separate, skippable action -- see sendEstimate()),
// so Approved is checked first and neither Sent nor Draft re-checks it.
// This makes the three buckets strictly mutually exclusive. This phase
// does not add a requirement that Send must happen before Approval --
// that would be a separate business-rule change.
function estimateGroup(d){
if(!isRetailPipeline(d.pipeline_id)) return null;
if(d.stages?.is_won) return null;
if(d.stages?.is_lost && isOwner()) return null;
if(d.estimate_approved_at) return 'approved';
if(d.estimate_sent_at) return 'sent';
if(d.estimate_started_at) return 'draft';
return null;
}

// Display-only derived status for the lead header. stage_id itself is never
// touched by this -- the deal is still, in the database, sitting in whatever
// stage it was already in (in practice "Quoted"). Customer Approved != Won,
// so once an Estimate is approved but before 100% payment is recorded, the
// CRE should see something more informative than the raw "Quoted" stage
// name here. This is the agreed placeholder until a real "Payment Pending"
// stage exists (see the note in 01_migration_estimates.sql).
function dealStatusLabel(d){
if(d.estimate_approved_at && isRetailPipeline(d.pipeline_id) && !d.stages?.is_won) return 'Estimate Approved · Payment Pending';
return d.stages?.name||'';
}

function estimateItemRow(item){
const opts = S.products.map(p=>`<option value="${p.id}" ${item&&item.product_id===p.id?'selected':''}>${esc(p.model_code?p.model_code+' — ':'')}${esc(p.name)}</option>`).join('');
// Manual-item extension (Estimate manual-item enhancement, approved): a
// saved row is a manual item only when it has no product_id AND has a
// product_other value -- matches how product_id/product_other are written
// by saveEstimate() below, so a reopened manual row always re-selects
// "Other / Enter manually" rather than falling back to "Select item".
const isOther = !!(item && !item.product_id && item.product_other);
const row=document.createElement('div'); row.className='cd-est-row';
row.innerHTML=`<select class="p"><option value="">Select item</option>${opts}<option value="__other__" ${isOther?'selected':''}>Other / Enter manually</option></select>
<input class="q" type="number" inputmode="decimal" value="${item?Number(item.qty):1}" placeholder="Qty">
<input class="r" type="number" inputmode="decimal" value="${item?Number(item.rate):''}" placeholder="Rate">
<button type="button" class="cd-est-rm">&times;</button>
<input class="po" type="text" placeholder="Item / repair description" value="${isOther?esc(item.product_other):''}" style="grid-column:1/-1;${isOther?'':'display:none'}">`;
row.querySelector('.cd-est-rm').onclick=()=>{ row.remove(); updateEstimateTotals(); };
// Products V1 auto-price rule (approved): a deliberate change of the
// selected product always overwrites Rate with that product's current
// default_price; the CRE can still edit Rate by hand afterwards, and that
// manual value is what saves. Setting the `selected` attribute above at
// initial render (new row, or redrawing an already-saved item while
// reopening an existing Estimate) never fires `change`, so this can only
// ever fire from an actual user selection -- never from a reopen/redraw.
// Calls updateEstimateTotals() itself (rather than relying on the
// container's delegated 'input' listener) so the total reflects the new
// rate immediately, with no dependency on select/change event ordering.
//
// Manual-item extension (Estimate manual-item enhancement, approved): the
// same select also carries a sentinel "__other__" option. Choosing it
// reveals the free-text description field (`.po`) and deliberately skips
// the default_price autofill below -- no product in S.products has id
// "__other__", so `p` stays undefined and Rate is left exactly as the CRE
// typed it. Switching away from "__other__" back to a real product (or to
// "Select item") hides AND clears `.po`, so a stale manual description can
// never ride along into a product-backed save.
row.querySelector('.p').onchange=()=>{
const val = row.querySelector('.p').value;
const poEl = row.querySelector('.po');
if(val==='__other__'){
poEl.style.display='';
} else {
poEl.style.display='none';
poEl.value='';
const p = S.products.find(x=>String(x.id)===val);
if(p) row.querySelector('.r').value = Number(p.default_price||0);
}
updateEstimateTotals();
};
return row;
}

// GST is optional per Estimate, fixed at 18%, applied AFTER the Final
// Discount. No separate GST amount is stored anywhere -- it's derived here
// (and, authoritatively, inside approve_estimate()) from the subtotal, the
// discount and the on/off toggle alone. Shared by the editable live-preview
// and the approved/locked display so both use exactly the same formula.
function estimateBreakdown(subtotal, discount, gstEnabled){
const taxable = Math.max(0, subtotal - discount);
const gst = gstEnabled ? Math.round(taxable*0.18*100)/100 : 0;
const final = taxable + gst;
return { taxable, gst, final };
}

function updateEstimateTotals(){
const wrap=document.getElementById('estItems'); if(!wrap) return;
let subtotal=0;
wrap.querySelectorAll('.cd-est-row').forEach(r=>{
const q=Number(r.querySelector('.q').value||0), rt=Number(r.querySelector('.r').value||0);
if(r.querySelector('.p').value) subtotal += q*rt;
});
const discInput=document.getElementById('estDiscount');
const disc=Math.max(0,Number(discInput?.value||0));
const gstCheckbox=document.getElementById('estGst');
const gstEnabled=!!(gstCheckbox&&gstCheckbox.checked);
const { taxable, gst, final } = estimateBreakdown(subtotal, disc, gstEnabled);
const st=document.getElementById('estSubtotal'); if(st) st.textContent=rs(subtotal);
const gstRows=document.getElementById('estGstRows');
if(gstRows) gstRows.style.display = gstEnabled ? '' : 'none';
const tx=document.getElementById('estTaxable'); if(tx) tx.textContent=rs(taxable);
const ga=document.getElementById('estGstAmt'); if(ga) ga.textContent=rs(gst);
const ft=document.getElementById('estFinal'); if(ft) ft.textContent=rs(final);
const gs=document.getElementById('estGstState'); if(gs) gs.textContent = gstEnabled?'ON':'OFF';
// Repairs only (element exists only on an approved Repair Estimate): compare the live total with the approved total.
const as=document.getElementById('estApprovedState');
if(as){
const st=repairApprovalState(Number(as.dataset.approved), final, as.dataset.at);
as.classList.toggle('stale', st.stale);
const at=document.getElementById('estApprovedText'); if(at) at.textContent=st.text;
const ab=document.getElementById('estApprove');
if(ab){ ab.textContent = st.stale ? 'Re-approve to update total' : 'Re-approve'; ab.className = st.stale ? 'cd-btn approve' : 'cd-btn ghost'; }
}
}

// ---------------------------------------------------------------------
// PAYMENT / RECEIPT UI (payment-architecture migration 001) — replaces the
// old raw cumulative deals.amount_collected editor everywhere it appeared.
// CRE-recorded scope is deliberately minimal: an amount and an optional
// human note. No payment method, channel, or reference/transaction number
// is captured anywhere in this UI -- per the original business
// simplification decision ("drops payment method / reference number per
// your business simplification", 003_migration_review.md §1.1), which the
// approved receipts schema itself reflects (no payment_method or
// reference_no columns). A brief reintroduction of those fields in an
// earlier round of this integration was a spec-drift mistake, corrected
// here; do not reintroduce them without a fresh, explicit decision.
// ---------------------------------------------------------------------
function paymentFormFields(balance){
return `<label for="payAmount">Amount Received Now</label>
<input id="payAmount" type="number" inputmode="decimal" placeholder="0" min="0" max="${balance}">
<label for="payNote">Note (optional)</label>
<input id="payNote" placeholder="Anything worth recording">`;
}

// recorded_by is a profiles.id (uuid). S.profiles is fetched active-only
// at boot (see the app-init profiles query), so a CRE who has since gone
// inactive won't resolve there even though their row and name still exist
// -- resolveReceiptRecorders() below does one small, targeted fetch (by id,
// no is_active filter) for exactly the ids a deal's receipt history needs
// that aren't already in S.profiles, and caches the result. Both this and
// recordedByName() are deliberately failure-safe: a missing/unresolvable
// profile (deleted row, fetch error, RLS edge case) must never break
// receipt history -- it just falls back to a neutral "staff" label.
async function resolveReceiptRecorders(receipts){
const ids = [...new Set((receipts||[]).filter(r=>r.source!=='legacy_migration' && r.recorded_by).map(r=>r.recorded_by))];
const unresolved = ids.filter(id => !S.profiles.some(p=>p.id===id) && !(id in S.receiptRecorderNames));
if(!unresolved.length) return;
try{
const { data, error } = await sb.from('profiles').select('id,full_name').in('id', unresolved);
if(error) return;
(data||[]).forEach(p=>{ S.receiptRecorderNames[p.id] = p.full_name || null; });
}catch(e){ /* best-effort only -- recordedByName()'s fallback covers this */ }
}

function recordedByName(id){
if(!id) return null;
const active = S.profiles.find(p=>p.id===id);
if(active && active.full_name) return active.full_name;
const cached = S.receiptRecorderNames[id];
if(cached) return cached;
return null;
}

function receiptRowMeta(r){
const isReversal = !!r.reverses_receipt_id;
const isLegacy = r.source==='legacy_migration';
return { isReversal, isLegacy };
}

// Legacy rows never got (and never will get) a real operator or date --
// stated once here so both receipt-history renderers below share the exact
// same wording rather than risking drift between the CD and Plain copies.
function receiptSubline(r, isLegacy){
if(isLegacy) return 'Migrated opening balance — no method or date recorded';
const who = recordedByName(r.recorded_by) || 'staff';
return day(r.occurred_at||r.created_at) + ' · Recorded by ' + esc(who);
}

function receiptNoteLine(r, isLegacy){
if(isLegacy) return '';
const note = (r.note||'').trim();
return note ? esc(note) : '';
}

// CRE-facing (.cd-* dark theme) — used inside the Estimates tab.
function receiptHistoryListCD(){
const list = S.dealReceipts||[];
if(!list.length) return `<div class="cd-empty"><b>No payments recorded yet</b></div>`;
const reversedIds = new Set(list.filter(r=>r.reverses_receipt_id).map(r=>r.reverses_receipt_id));
return list.map(r=>{
const { isReversal, isLegacy } = receiptRowMeta(r);
const alreadyReversed = reversedIds.has(r.id);
const canReverse = isOwner() && !isReversal && !isLegacy && !alreadyReversed;
return `<div class="cd-frow">
<div class="isq" style="background:${isReversal?'rgba(194,80,107,.16)':'rgba(110,158,92,.16)'};color:${isReversal?'var(--rose)':'var(--green)'}">${ic(isReversal?'wallet':'check')}</div>
<div class="grow">
<div class="name">${isReversal?'Reversed — ':''}${rs(Math.abs(r.amount))}${isLegacy?' <span class="cd-pill" style="background:rgba(154,142,130,.18);color:var(--cd-muted)">Legacy</span>':''}${alreadyReversed?' <span class="cd-pill" style="background:rgba(194,80,107,.16);color:var(--rose)">Reversed</span>':''}</div>
<div class="sub">${receiptSubline(r, isLegacy)}</div>
${receiptNoteLine(r, isLegacy)?`<div class="sub" style="margin-top:2px">${receiptNoteLine(r, isLegacy)}</div>`:''}
</div>
${canReverse?`<button class="cd-btn ghost" data-reverse-receipt="${r.id}" style="width:auto;padding:6px 12px;font-size:11px;margin-top:0">Reverse</button>`:''}
</div>`;
}).join('');
}

// Owner-facing (legacy/light, .card/.item/.tag) — used inside renderDeal().
function receiptHistoryListPlain(){
const list = S.dealReceipts||[];
if(!list.length) return `<div class="sub" style="margin-top:10px">No payments recorded yet.</div>`;
const reversedIds = new Set(list.filter(r=>r.reverses_receipt_id).map(r=>r.reverses_receipt_id));
return `<div style="margin-top:10px">`+list.map(r=>{
const { isReversal, isLegacy } = receiptRowMeta(r);
const alreadyReversed = reversedIds.has(r.id);
const canReverse = isOwner() && !isReversal && !isLegacy && !alreadyReversed;
return `<div class="item">
<div class="grow">
<div>${isReversal?'Reversed — ':''}${rs(Math.abs(r.amount))}${isLegacy?' <span class="tag">Legacy</span>':''}${alreadyReversed?' <span class="tag">Reversed</span>':''}</div>
<div class="sub">${receiptSubline(r, isLegacy)}</div>
${receiptNoteLine(r, isLegacy)?`<div class="sub" style="margin-top:2px">${receiptNoteLine(r, isLegacy)}</div>`:''}
</div>
${canReverse?`<button class="btn ghost" data-reverse-receipt="${r.id}" style="width:auto;padding:7px 12px;margin-top:0;font-size:12px">Reverse</button>`:''}
</div>`;
}).join('')+`</div>`;
}

async function recordPayment(d){
if(!d) return;
const btn=document.getElementById('payRecord'); if(btn){ btn.disabled=true; btn.textContent='Recording…'; }
const errBox=document.getElementById('payErr'); if(errBox) errBox.innerHTML='';
try{
const amt=Number(document.getElementById('payAmount').value||0);
if(!(amt>0)) throw new Error('Enter an amount greater than 0.');
const note=document.getElementById('payNote').value.trim();
const { error } = await sb.rpc('record_amount_received',{p_deal_id:d.id, p_amount:amt, p_note: note || null});
if(error) throw error;
openDeal(d.id);
}catch(err){
if(errBox) errBox.innerHTML=`<div class="err" style="margin-top:12px">${esc(err.message||String(err))}</div>`;
if(btn){ btn.disabled=false; btn.textContent='Record Amount Received'; }
}
}

async function reverseReceiptAction(receiptId){
const reason=prompt('Reason for reversing this receipt (required):');
if(!reason || !reason.trim()) return;
try{
const { error } = await sb.rpc('owner_reverse_receipt',{p_receipt_id:receiptId, p_reason:reason.trim()});
if(error) throw error;
openDeal(S.deal.id);
}catch(err){
alert(err.message||String(err));
}
}

function leadEstimateTab(d){
// Repairs reuse the SAME editor (renderEditableEstimate) and are never shown the locked/payment view.
if(isRepairsPipeline(d.pipeline_id)) return renderEditableEstimate(d);
if(!isRetailPipeline(d.pipeline_id)) return `<div class="cd-soon"><b>Estimates — coming soon</b><p>This module isn't built yet for this pipeline.</p></div>`;
if(d.estimate_approved_at) return renderApprovedEstimate(d);
return renderEditableEstimate(d);
}

function renderApprovedEstimate(d){
const subtotal=(d.items||[]).reduce((a,i)=>a+Number(i.amount||0),0);
const discount=Number(d.estimate_discount||0);
const gstEnabled=!!d.estimate_gst_enabled;
const { taxable, gst } = estimateBreakdown(subtotal, discount, gstEnabled);
const received=Number(d.amount_collected||0);
const balance=Math.max(0, Number(d.value||0)-received);
const fullyPaid=balance<=0;
const items=(d.items&&d.items.length)?d.items.map(i=>`<div class="cd-frow">
<div class="isq" style="background:rgba(255,122,41,.14);color:var(--cd-accent)">${ic('box')}</div>
<div class="grow"><div class="name">${esc(i.products?.name||i.product_other||'Item')}</div><div class="sub">${Number(i.qty)} × ${rs(i.rate)}</div></div>
<div style="font-weight:700;font-size:13px">${rs(i.amount)}</div>
</div>`).join(''):`<div class="cd-empty"><b>No items</b></div>`;
return `<div class="cd-est-locked">${ic('check')}Estimate approved ${day(d.estimate_approved_at)} — locked</div>
<div class="cd-panel"><h3>Items</h3>${items}</div>
<div class="cd-panel"><h3>Total</h3>
<div class="cd-est-totals">

// Repairs only: a Repair Estimate stays editable after approval, so the approved total (deals.value, written by
// approve_estimate) can fall behind the current estimate. This is the single place that decides that wording/state.
function repairApprovalState(approvedTotal, currentTotal, approvedAt){
const stale = Math.abs(Number(currentTotal) - Number(approvedTotal)) > 0.005;
return { stale, text: stale
? `Approved total ${rs(approvedTotal)} is out of date \u2014 current estimate total ${rs(currentTotal)}. Re-approve to update the total.`
: `Estimate approved ${day(approvedAt)} \u2014 approved total ${rs(approvedTotal)}` };
}

// Estimate event wiring shared by Retail (renderLeadDetail) and Repairs (renderRepairDetail) -- one copy only.
function wireEstimate(d){
const estItemsEl=document.getElementById('estItems');
if(estItemsEl){
if(d.items && d.items.length){ d.items.forEach(it=>estItemsEl.appendChild(estimateItemRow(it))); }
else { estItemsEl.appendChild(estimateItemRow(null)); }
estItemsEl.addEventListener('input', updateEstimateTotals);
}
const estAddRow=document.getElementById('estAddRow');
if(estAddRow) estAddRow.onclick=()=>{ estItemsEl.appendChild(estimateItemRow(null)); updateEstimateTotals(); };
const estDiscount=document.getElementById('estDiscount');
if(estDiscount) estDiscount.oninput=updateEstimateTotals;
const estGst=document.getElementById('estGst');
if(estGst) estGst.onchange=updateEstimateTotals;

async function fetchLeadsPage(){
let dealIdFilter=null;
if(S.leadFollow!=='all'){
const today=new Date().toISOString().slice(0,10);
let fq=sb.from('follow_ups').select('deal_id').eq('done',false);
fq = S.leadFollow==='today' ? fq.eq('due_date',today) : fq.lt('due_date',today);
const {data:fus}=await fq;
dealIdFilter=[...new Set((fus||[]).map(f=>f.deal_id))];
if(!dealIdFilter.length){ if(S.leadPage===0) S.deals=[]; S.leadHasMore=false; return; }
}
let custIdFilter=null;
if(S.leadQ.trim()){
const like=`%${S.leadQ.trim()}%`;
const {data:cs}=await sb.from('customers').select('id').or(`name.ilike.${like},phone.ilike.${like}`).limit(200);
custIdFilter=(cs||[]).map(c=>c.id);
if(!custIdFilter.length){ if(S.leadPage===0) S.deals=[]; S.leadHasMore=false; return; }
}
let q=sb.from('deals').select('*, customers(name,phone,district,customer_type,alt_phone), stages(name,is_won,is_lost,is_delivered), sources(name)')
.order('created_at',{ascending:false})
.range(S.leadPage*S.leadPageSize, S.leadPage*S.leadPageSize+S.leadPageSize-1);
// Repairs deals live only in the shared Repairs queue, never in My Leads.
const repLeadId = repairsPipelineId();
if(repLeadId!=null) q=q.neq('pipeline_id',repLeadId);
if(S.leadStage) q=q.eq('stage_id',S.leadStage);
if(S.leadSource) q=q.eq('source_id',S.leadSource);
if(dealIdFilter) q=q.in('id',dealIdFilter);
if(custIdFilter) q=q.in('customer_id',custIdFilter);
const {data,error}=await q;
if(error) throw error;
S.deals = S.leadPage===0 ? (data||[]) : S.deals.concat(data||[]);
S.leadHasMore = (data||[]).length===S.leadPageSize;
const pageIds=(data||[]).map(x=>x.id);
if(pageIds.length){
const {data:fus2}=await sb.from('follow_ups').select('deal_id,due_date,contact_type').eq('done',false).in('deal_id',pageIds).order('due_date',{ascending:true});
const map={};
(fus2||[]).forEach(f=>{ if(!map[f.deal_id]) map[f.deal_id]=f; });
S.leadFollowMap = {...S.leadFollowMap, ...map};
}
}

async function saveLead(e){
const btn=e.target; btn.disabled=true; btn.textContent='Saving…';
try{
const name=document.getElementById('alname').value.trim();
if(!name) throw new Error('Customer name is needed.');
const phone=document.getElementById('alphone').value.trim();
const alt=document.getElementById('alalt').value.trim();
const dist=document.getElementById('aldist').value.trim();
const ctype=document.getElementById('altype').value;

let cid=null;
if(S.newDealCustomerId){
// Customer-known path (New Deal launched from an existing Customer Profile):
// skip the normal phone lookup/insert entirely -- use the already-known
// customer_id directly. Zero customer rows are created on this path.
cid=S.newDealCustomerId;
} else {
if(phone){
const { data:found } = await sb.from('customers').select('id').eq('phone',phone).limit(1);
if(found?.length) cid=found[0].id;
}
if(!cid){
const { data:c, error } = await sb.from('customers')
.insert({ name, phone:phone||null, alt_phone:alt||null, customer_type:ctype||'retail', district:dist||null, state:'Kerala' })
.select('id').single();
if(error) throw error; cid=c.id;
} else {
const patch={};
if(alt) patch.alt_phone=alt;
if(dist) patch.district=dist;
if(Object.keys(patch).length) await sb.from('customers').update(patch).eq('id',cid);
}
}

const retailPipe = S.pipelines.find(p=>/retail/i.test(p.name)) || S.pipelines[0];
const firstStage = S.stages.filter(s=>s.pipeline_id===retailPipe.id).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))[0];

const { data:deal, error:de } = await sb.from('deals').insert({
pipeline_id:retailPipe.id,
stage_id:firstStage.id,
customer_id:cid,
title:document.getElementById('alreq').value.trim()||name,
value:Number(document.getElementById('alval').value||0),
amount_collected:0,
source_id:document.getElementById('alsource').value?Number(document.getElementById('alsource').value):null,
assigned_to:S.me.id
}).select('id').single();
if(de) throw de;

const rows=[...document.querySelectorAll('#alitems .three')].map((r,i)=>({
deal_id:deal.id,
product_id:r.querySelector('.p').value?Number(r.querySelector('.p').value):null,
qty:Number(r.querySelector('.q').value||1),
rate:Number(r.querySelector('.r').value||0),
sort_order:i+1
})).filter(r=>r.product_id);
if(rows.length) await sb.from('deal_items').insert(rows);
await logActivity('lead_created', deal.id, name);

S.newDealCustomerId=null; S.newDealCustomerInfo=null; // clear on successful customer-known save
S.tab='pipeline';
await openDeal(deal.id);
}catch(err){
S.err=err.message||String(err); btn.disabled=false; btn.textContent='Save Lead'; render();
}
}

async function saveEstimate(d){
const btn=document.getElementById('estSave'); if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
const errBox=document.getElementById('estErr'); if(errBox) errBox.innerHTML='';
try{
const rowEls=[...document.querySelectorAll('#estItems .cd-est-row')];
// Manual-item validation (Estimate manual-item enhancement, approved):
// checked and thrown BEFORE the deal_items delete below runs. A row left
// on "Other / Enter manually" with a blank description must never reach
// the delete+insert pair -- that would wipe this deal's existing saved
// items first and then insert nothing for the blank row, losing data.
const blankOther = rowEls.some(r=>r.querySelector('.p').value==='__other__' && !r.querySelector('.po').value.trim());
if(blankOther){ throw new Error('Enter a description for every manual item, or remove the row.'); }
const rows=rowEls.map((r,i)=>{
const pVal=r.querySelector('.p').value, isOther=pVal==='__other__';
return {
deal_id:d.id,
product_id:(pVal && !isOther)?Number(pVal):null,
product_other:isOther?r.querySelector('.po').value.trim():null,
qty:Number(r.querySelector('.q').value||1),
rate:Number(r.querySelector('.r').value||0),
sort_order:i+1
};
}).filter(r=>r.product_id||r.product_other);
const discount=Math.max(0,Number(document.getElementById('estDiscount').value||0));
const gstEnabled=!!document.getElementById('estGst')?.checked;
let r1=await sb.from('deal_items').delete().eq('deal_id',d.id); if(r1.error) throw r1.error;
if(rows.length){ let r2=await sb.from('deal_items').insert(rows); if(r2.error) throw r2.error; }
// estimate_started_at: set on the first successful save only (a
// deals_preserve_estimate_started_at DB trigger is the authoritative
// guard -- this client-side fallback just avoids clobbering it with a
// fresh timestamp on every subsequent save). Never set anywhere else --
// not by opening this tab, not by Create Estimate, not by intake
// deal_items -- only by an Estimate actually being saved.
let r3=await sb.from('deals').update({estimate_discount:discount, estimate_gst_enabled:gstEnabled, estimate_started_at: d.estimate_started_at || new Date().toISOString()}).eq('id',d.id); if(r3.error) throw r3.error;
openDeal(d.id);
}catch(err){
if(errBox) errBox.innerHTML=`<div class="cd-est-err">${esc(err.message||String(err))}</div>`;
if(btn){ btn.disabled=false; btn.textContent='Save Estimate'; }
}
}

async function sendEstimate(d){
const btn=document.getElementById('estSend'); if(btn) btn.disabled=true;
const errBox=document.getElementById('estErr'); if(errBox) errBox.innerHTML='';
try{
// A sent Estimate necessarily exists, so Send must guarantee
// estimate_started_at is set too -- Send is reachable without a prior
// Save (see saveEstimate's comment), so this can't rely on Save alone.
let r1=await sb.from('deals').update({estimate_sent_at:new Date().toISOString(), estimate_started_at: d.estimate_started_at || new Date().toISOString()}).eq('id',d.id); if(r1.error) throw r1.error;
await logActivity('estimate_sent', d.id, d.customers?.name||'');
openDeal(d.id);
}catch(err){
if(errBox) errBox.innerHTML=`<div class="cd-est-err">${esc(err.message||String(err))}</div>`;
if(btn) btn.disabled=false;
}
}

// True when the on-screen Estimate differs from what is saved. approve_estimate() prices the SAVED items, so a Repair
// approval must never run over unsaved edits.
function estimateIsDirty(d){
const form=[...document.querySelectorAll('#estItems .cd-est-row')].map(r=>{
const pVal=r.querySelector('.p').value, isOther=pVal==='__other__';
return [(pVal&&!isOther)?Number(pVal):null, isOther?r.querySelector('.po').value.trim():null, Number(r.querySelector('.q').value||1), Number(r.querySelector('.r').value||0)];
}).filter(r=>r[0]||r[1]);
const saved=(d.items||[]).map(i=>[i.product_id!=null?Number(i.product_id):null, i.product_other||null, Number(i.qty), Number(i.rate)]);
const disc=Math.max(0,Number(document.getElementById('estDiscount')?.value||0));
const gst=!!document.getElementById('estGst')?.checked;
return JSON.stringify(form)!==JSON.stringify(saved) || disc!==Number(d.estimate_discount||0) || gst!==!!d.estimate_gst_enabled;
}

async function approveEstimateAction(d){
const btn=document.getElementById('estApprove');
const label=btn?btn.textContent:'Customer Approved';
const errBox=document.getElementById('estErr'); if(errBox) errBox.innerHTML='';
// Repairs -> approve_estimate (re-approvable; logs its own activity row atomically in the database, so NO logActivity
// here). Retail -> approve_retail_estimate, exactly as before.
const repair=isRepairsPipeline(d.pipeline_id);
if(repair && estimateIsDirty(d)){
if(errBox) errBox.innerHTML=`<div class="cd-est-err">You have unsaved changes. Save the Estimate first, then approve or re-approve.</div>`;
return;
}
if(btn){ btn.disabled=true; btn.textContent='Approving…'; }
try{
const { error } = await sb.rpc(repair?'approve_estimate':'approve_retail_estimate',{p_deal_id:d.id});
if(error) throw error;
openDeal(d.id);
}catch(err){
if(errBox) errBox.innerHTML=`<div class="cd-est-err">${esc(err.message||String(err))}</div>`;
if(btn){ btn.disabled=false; btn.textContent=label; }
}
}

/* ── dashboard (owner only) ── */
function trendChart(data){
if(!data.length) return '<div class="empty">No activity yet.</div>';
const w=320, h=104, pad=2, top=6;
const max = Math.max(1, ...data.map(d=>Math.max(d.value,d.money)));
const bw = (w-pad*2)/data.length;
const barW = Math.max(1.5,(bw-3)/2);
const bars = data.map((d,i)=>{
const x = pad + i*bw;
const vh = Math.round((d.value/max)*(h-top));
const mh = Math.round((d.money/max)*(h-top));
return `<rect x="${x.toFixed(1)}" y="${h-vh}" width="${barW.toFixed(1)}" height="${vh}" fill="var(--amber)"/>`+
`<rect x="${(x+barW+1.5).toFixed(1)}" y="${h-mh}" width="${barW.toFixed(1)}" height="${mh}" fill="var(--cyan)"/>`;
}).join('');
return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:104px;display:block" preserveAspectRatio="none">${bars}</svg>`;
}

function donutChart(data){
const total = data.reduce((a,b)=>a+b.count,0);
if(!total) return '<div class="empty">No leads in this period.</div>';
const colors=['var(--amber)','var(--rose)','var(--cyan)','var(--green)','var(--violet)','var(--muted)'];
const r=40, c=2*Math.PI*r, cx=52, cy=52;
let offset=0;
const circles = data.map((d,i)=>{
const len = (d.count/total)*c;
const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="15" stroke-dasharray="${len.toFixed(1)} ${(c-len).toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>`;
offset += len; return seg;
}).join('');
const legend = data.map((d,i)=>`<div class="row" style="gap:7px;margin-top:6px">
<span class="dot" style="background:${colors[i%colors.length]}"></span>
<span class="sub grow">${esc(d.name)}</span><span class="sub">${d.count}</span>
</div>`).join('');
return `<div class="row" style="align-items:center;gap:16px">
<svg width="104" height="104" viewBox="0 0 104 104" style="flex:none">${circles}</svg>
<div class="grow">${legend}</div>
</div>`;
}

function pipelineBreakdown(rows){
const by={};
rows.forEach(d=>{
const st=d.stages; if(!st) return;
const k=d.pipeline_id+'-'+d.stage_id;
if(!by[k]) by[k]={pName:d.pipelines?.name||'', stage:st.name, sort:(d.pipelines?.sort_order||0)*100+(st.sort_order||0), isLost:st.is_lost, isWon:st.is_won, isDelivered:st.is_delivered, count:0};
by[k].count++;
});
return Object.values(by).sort((a,b)=>a.sort-b.sort);
}

function timeAgo(ts){
const s = Math.max(1, Math.round((Date.now()-new Date(ts).getTime())/1000));
if(s<60) return s+'s ago';
const m=Math.round(s/60); if(m<60) return m+'m ago';
const h=Math.round(m/60); if(h<24) return h+'h ago';
const d=Math.round(h/24); return d+'d ago';
}

async function saveProduct(){

name,

default_price: Number(document.getElementById('pfprice').value || 0),

};
const isNew = S.productEditing==='new';
const { error } = isNew
? await sb.from('products').insert(patch)
: await sb.from('products').update(patch).eq('id', S.productEditing.id);
if(error){ S.err = error.message; render(); return; }
// Refresh both the directory list and the Estimate-picker cache (S.products,
// active-only) so a save is reflected immediately everywhere, without a

const [dirR, pickR] = await Promise.all([
sb.from('products').select('*, brands(name)').order('name'),
sb.from('products').select('*').eq('is_active',true).order('name')
]);
S.productsList = dirR.data||[]; S.products = pickR.data||[];
S.productEditing = null;
render();
}

function waHref(phone){
// Additive to Customers V1 only -- existing inline WhatsApp links elsewhere
// (renderDeal(), viewDues()) are intentionally left untouched.
const digits = String(phone||'').replace(/\D/g,'');
let ten = null;
if(digits.length===10) ten = digits;
else if(digits.length===12 && digits.startsWith('91')) ten = digits.slice(2);
else if(digits.length===11 && digits.startsWith('0')) ten = digits.slice(1);
else if(digits.length>10) ten = digits.slice(-10);
if(!ten || ten.length!==10) return null; // never fabricate a link from an unusable value
return `https://wa.me/91${ten}`;
}

async function openCustomer(id){
// Corrected query order: customer row, customer deals and
// customer_balance_summary are genuinely independent and run together.
// Repairs depends on the deal IDs from the customer-deals query, so it is
// issued only after that result is in hand, and only when there is at
// least one deal ID -- no pointless empty .in() query.
const [{data:cust},{data:deals},{data:balRows}] = await Promise.all([
sb.from('customers').select('*').eq('id',id).single(),
sb.from('deals').select('*, stages(name,is_won,is_lost,is_delivered,pipeline_id), pipelines(name)').eq('customer_id',id).order('created_at',{ascending:false}),
sb.from('customer_balance_summary').select('*').eq('customer_id',id)
]);
S.customer = cust; S.customerDeals = deals||[]; S.customerBalance = (balRows&&balRows[0])||null;
const dealIds = S.customerDeals.map(d=>d.id);
if(dealIds.length>0){
const { data:reps } = await sb.from('repairs').select('*').in('deal_id', dealIds);
S.customerRepairs = reps||[];
} else {
S.customerRepairs = [];
}
S.custProfileTab='overview'; S.custEditing=false;
render();
}

/* ── dispatch & courier ── */
// Retail Sales gets the three-state Order -> Dispatched/In Transit -> Delivered
// flow (dispatch_date is the authoritative operational signal, courier_name/
// awb_number are informational only). Dealer Orders and Repairs are explicitly
// out of scope for this phase and keep the original single-click
// dispatch=delivered behavior via markDispatched(), unchanged.
function viewDispatch(){
const ready = S.dispatchReady, sent = S.dispatchSent;
const retailReady = ready.filter(d=>isRetailPipeline(d.pipeline_id));
const otherReady = ready.filter(d=>!isRetailPipeline(d.pipeline_id));
const awaiting = retailReady.filter(d=>!d.dispatch_date);
const inTransit = retailReady.filter(d=>d.dispatch_date);

const otherCards = otherReady.length ? otherReady.map(d=>{
const addr=[d.customers?.address,d.customers?.district].filter(Boolean).join(', ');
return `<div class="card">
<div class="row"><div class="grow">
<div class="name">${esc(d.customers?.name||'No customer')}</div>
<div class="sub">${esc(d.title||'')}${d.invoice_no?' · '+esc(d.invoice_no):''} · ${esc(d.stages?.name||'')}</div>
</div><div class="amt">${rs(d.value)}</div></div>
${addr?`<div class="sub" style="margin-top:6px">${esc(addr)}</div>`:''}
${d.customers?.phone?`<div class="sub">${esc(d.customers.phone)}</div>`:''}
<label for="cr-${d.id}">Courier</label><input id="cr-${d.id}" placeholder="e.g. DTDC, Professional" value="${esc(d.courier_name||'')}">
<label for="awb-${d.id}">Tracking / AWB number</label><input id="awb-${d.id}" placeholder="AWB / consignment no." value="${esc(d.awb_number||'')}">
<button class="btn" data-dispatch="${d.id}">Mark dispatched</button>
</div>`;
}).join('') : '';

const awaitingCards = awaiting.length ? awaiting.map(d=>{
const addr=[d.customers?.address,d.customers?.district].filter(Boolean).join(', ');
return `<div class="card">
<div class="row"><div class="grow">
<div class="name">${esc(d.customers?.name||'No customer')}</div>
<div class="sub">${esc(d.title||'')}${d.invoice_no?' · '+esc(d.invoice_no):''} · ${esc(d.stages?.name||'')}</div>
</div><div class="amt">${rs(d.value)}</div></div>
${addr?`<div class="sub" style="margin-top:6px">${esc(addr)}</div>`:''}
${d.customers?.phone?`<div class="sub">${esc(d.customers.phone)}</div>`:''}
<label for="rcr-${d.id}">Courier</label><input id="rcr-${d.id}" placeholder="e.g. DTDC, Professional" value="${esc(d.courier_name||'')}">
<label for="rawb-${d.id}">Tracking / AWB number</label><input id="rawb-${d.id}" placeholder="AWB / consignment no." value="${esc(d.awb_number||'')}">
<button class="btn" data-retaildispatch="${d.id}">Mark Dispatched</button>
</div>`;
}).join('') : `<div class="empty">Nothing waiting to ship.</div>`;

const transitCards = inTransit.length ? inTransit.map(d=>`<div class="card">
<div class="row"><div class="grow">
<div class="name">${esc(d.customers?.name||'No customer')}</div>
<div class="sub">${esc(d.title||'')}${d.invoice_no?' · '+esc(d.invoice_no):''} · ${esc(d.courier_name||'—')}${d.awb_number?' · '+esc(d.awb_number):''}</div>
</div><div class="amt">${rs(d.value)}</div></div>
<div class="sub" style="margin-top:6px">Dispatched ${day(d.dispatch_date)}</div>
<button class="btn" data-retaildeliver="${d.id}">Mark Delivered</button>
</div>`).join('') : '';

const sentCards = sent.length ? sent.map(d=>`<div class="card">
<div class="row"><div class="grow">
<div class="name">${esc(d.customers?.name||'No customer')}</div>
<div class="sub">${esc(d.courier_name||'—')}${d.awb_number?' · '+esc(d.awb_number):''}</div>
</div><div class="sub">${day(d.dispatch_date)}</div></div>
</div>`).join('') : '';

return `<h2>Awaiting Dispatch · ${awaiting.length}</h2>${awaitingCards}` +
(inTransit.length ? `<h2>In Transit</h2>${transitCards}` : '') +
(otherReady.length ? `<h2>Ready to dispatch (Dealer / Repairs) · ${otherReady.length}</h2>${otherCards}` : '') +
(sent.length ? `<h2>Recently dispatched</h2>${sentCards}` : '');
}

async function toggleDue(cid){
if(S.duesOpen===cid){ S.duesOpen=null; S.duesDeals=[]; render(); return; }
S.duesOpen=cid; S.duesDeals=[]; render();
const { data, error } = await sb.from('deals')
.select('*, stages(is_delivered)')
.eq('customer_id', cid);
if(error){ S.err=error.message; render(); return; }
S.duesDeals = (data||[])
.filter(d=>isNonRepairsPipeline(d.pipeline_id) && d.stages?.is_delivered && (Number(d.value||0)-Number(d.amount_collected||0))>0)
.sort((a,b)=> new Date(a.delivered_at||0) - new Date(b.delivered_at||0));
render();
}

async function markDispatched(id,btn){
btn.disabled=true; btn.textContent='Saving…';
try{
const deal=S.dispatchReady.find(x=>x.id===id);
const courier=document.getElementById('cr-'+id).value.trim();
const awb=document.getElementById('awb-'+id).value.trim();
const target=S.stages.find(s=>s.pipeline_id===deal.pipeline_id && s.is_delivered);
const upd={ courier_name:courier||null, awb_number:awb||null, dispatch_date:new Date().toISOString().slice(0,10) };
if(target){ upd.stage_id=target.id; upd.delivered_at=new Date().toISOString(); }
await sb.from('deals').update(upd).eq('id',id);
if(target) await sb.from('stage_events').insert({deal_id:id,from_stage_id:deal.stage_id,to_stage_id:target.id,changed_by:S.me.id});
await logActivity('dispatched', id, [courier,awb].filter(Boolean).join(' · ') || (deal.customers?.name||''));
loadTab();
}catch(err){ S.err=err.message||String(err); render(); }
}

// Retail Sales only. Records courier/AWB/dispatch_date exactly like
// markDispatched() used to, but deliberately does NOT touch stage_id,
// delivered_at, or stage_events -- dispatch_date alone is what moves a
// Retail order from Awaiting Dispatch to In Transit (see viewDispatch()/
// viewOrders()). Courier/AWB stay optional, matching the existing UI
// contract (markDispatched() never required them either).
async function markRetailDispatched(id,btn){
btn.disabled=true; btn.textContent='Saving…';
try{
const deal=S.dispatchReady.find(x=>x.id===id);
if(!deal) throw new Error('Deal not found');
const courier=document.getElementById('rcr-'+id).value.trim();
const awb=document.getElementById('rawb-'+id).value.trim();
const upd={ courier_name:courier||null, awb_number:awb||null, dispatch_date:new Date().toISOString().slice(0,10) };
await sb.from('deals').update(upd).eq('id',id);
await logActivity('retail_dispatched', id, [courier,awb].filter(Boolean).join(' · ') || (deal.customers?.name||''));
loadTab();
}catch(err){ S.err=err.message||String(err); render(); }
}

// Retail Sales only. The separate, explicit "customer actually received it"
// action -- only this moves Confirmed/Won -> Delivered, sets delivered_at,
// and writes the stage_event. Never rewrites courier_name/awb_number/
// dispatch_date, which markRetailDispatched() already recorded.
async function markRetailDelivered(id,btn){
btn.disabled=true; btn.textContent='Saving…';
try{
const deal=S.dispatchReady.find(x=>x.id===id);
if(!deal) throw new Error('Deal not found');
if(!deal.dispatch_date) throw new Error('Cannot mark delivered before dispatch is recorded');
const target=S.stages.find(s=>s.pipeline_id===deal.pipeline_id && s.is_delivered);
if(!target) throw new Error('No Delivered stage configured for this pipeline');
const upd={ stage_id:target.id, delivered_at:new Date().toISOString() };
await sb.from('deals').update(upd).eq('id',id);
await sb.from('stage_events').insert({deal_id:id,from_stage_id:deal.stage_id,to_stage_id:target.id,changed_by:S.me.id});
await logActivity('retail_delivered', id, deal.customers?.name||'');
loadTab();
}catch(err){ S.err=err.message||String(err); render(); }
}

function itemRow(){

<input class="r" type="number" inputmode="decimal" placeholder="Rate">`;
// Same Products V1 auto-price rule as estimateItemRow(): a deliberate
// change of the selected product overwrites Rate with its current
// default_price; CRE can still hand-edit Rate afterwards. This row is
// always freshly created with no product pre-selected (New Deal / Add
// Lead has no "reopen an existing row" case), so there is no redraw

};
return d;
}

async function runSearch(q){
q=q.trim();
if(!q){ S.search=''; S.searchResults=null; render(); return; }
S.search=q;
const like=`%${q}%`;
const [dR,cR,pR] = await Promise.all([
sb.from('deals').select('id,title,value,customers(name,phone)').ilike('title', like).limit(5),
sb.from('customers').select('id,name,phone,district').or(`name.ilike.${like},phone.ilike.${like},alt_phone.ilike.${like}`).limit(5),
sb.from('products').select('id,name,model_code,category').ilike('name', like).limit(5)
]);
S.searchResults = { deals:dR.data||[], customers:cR.data||[], products:pR.data||[] };
render();
}

/* ── wiring ── */
function wire(){
const out=document.getElementById('out'); if(out) out.onclick=async()=>{ await sb.auth.signOut(); S={...S,me:null,deal:null}; renderLogin(); };
// Any normal navigation away (including the owner's "Add" nav button, which
// is itself a [data-tab="new"] element) must not carry a stale customer-known

function repairsPipelineId(){ return S.pipelines.find(p=>p.name==='Repairs')?.id ?? null; }
function isRepairsPipeline(pipelineId){ return pipelineId!=null && S.pipelines.find(p=>p.id===pipelineId)?.name==='Repairs'; }
// Positive, fail-CLOSED test used for money aggregates: true only for a KNOWN pipeline that is not Repairs. If the
// Repairs pipeline cannot be resolved at all this is false for everything, so a Repair value can never slip in.
function isNonRepairsPipeline(pipelineId){
const rid=repairsPipelineId();
return rid!=null && pipelineId!=null && pipelineId!==rid && S.pipelines.some(p=>p.id===pipelineId);
}
// PostgREST returns an object for a one-to-one embed and an array otherwise; tolerate both and "missing".
const repairRow = r => Array.isArray(r) ? (r[0]||null) : (r||null);
const dayFull = d => d ? new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '';
function localDateStr(d){
const x = d ? new Date(d) : new Date(); if(isNaN(x.getTime())) return '';
return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
}
const dateInputToTs = v => v ? new Date(v+'T00:00:00').toISOString() : null;
function repairBrandName(rp){
if(!rp) return '';
return rp.brands?.name || S.brands.find(b=>b.id===rp.brand_id)?.name || rp.brand_other || '';
}
function repairReceivedSort(d){ const rp=repairRow(d.repairs); return new Date(rp?.received_at || d.created_at).getTime() || 0; }

// Single place that defines the add_repair() RPC payload.
function repairRpcArgs(f){
const other = f.brandSel==='other';
const args = {
p_customer_id: f.cid || null,
p_customer_name: f.cid ? null : f.name,
p_customer_phone: f.cid ? null : (f.phone || null),
p_customer_district: f.cid ? null : (f.district || null),
p_title: f.title,
p_brand_id: (f.brandSel && !other) ? Number(f.brandSel) : null,
p_brand_other: other ? (f.brandOther || null) : null,
p_model: f.model || null,
p_fault_reported: f.complaint || null
};
// p_received_at defaults to now() in the database; only send it when a date was chosen (an explicit null would override the default).
if(f.received) args.p_received_at = dateInputToTs(f.received);
return args;
}
// add_repair() hands back the new deal's id; tolerate a bare uuid, {deal_id|id}, or a one-row array of either.
function repairRpcDealId(data){
const x = Array.isArray(data) ? data[0] : data;
if(!x) return null;
if(typeof x==='string') return x;
return x.deal_id || x.id || null;
}

async function saveRepair(e){
const btn=e.target, errEl=document.getElementById('repairAddErr');
errEl.textContent=''; btn.disabled=true; btn.textContent='Saving…';
try{
const g=id=>document.getElementById(id).value.trim();
const name=g('rcname'), phone=g('rcphone'), title=g('rtitle');
if(!name) throw new Error('Customer name is needed.');
if(!title) throw new Error('Equipment / product name is needed.');
// Same lookup rule as saveDeal(): an existing customer with this phone is reused; otherwise add_repair() creates one.
let cid=null;
if(phone){
const { data:found, error:fe } = await sb.from('customers').select('id').eq('phone',phone).limit(1);
if(fe) throw fe;
if(found?.length) cid=found[0].id;
}
const args = repairRpcArgs({ cid, name, phone, district:g('rcdist'), title,
brandSel:document.getElementById('rbrand').value, brandOther:g('rbrandother'),
model:g('rmodel'), complaint:g('rcomplaint'), received:document.getElementById('rreceived').value });
const { data, error } = await sb.rpc('add_repair', args);
if(error) throw error;
const dealId = repairRpcDealId(data);
if(!dealId) throw new Error('The repair was saved, but it could not be opened. Check the Repairs list.');
S.err=''; S.tab='repairs'; S.dealTab='overview';
await openDeal(dealId);
}catch(err){
errEl.textContent = err.message || String(err);
btn.disabled=false; btn.textContent='Save repair';
}
}

async function saveRepairEdit(e){
const d=S.deal, btn=e.target, errEl=document.getElementById('repairEditErr');
errEl.textContent=''; btn.disabled=true;
try{
const g=id=>document.getElementById(id).value.trim();
const title=g('retitle'), received=document.getElementById('rereceived').value;
if(!title) throw new Error('Equipment / product name is needed.');
if(!received) throw new Error('Received date is needed.');
const brandSel=document.getElementById('rebrand').value, other=brandSel==='other';
const upd = {
model: g('remodel') || null,
fault_reported: g('recomplaint') || null,
brand_id: (brandSel && !other) ? Number(brandSel) : null,
brand_other: other ? (g('rebrandother') || null) : null,
received_at: dateInputToTs(received)
};
// Intake row first: if it fails nothing has changed. Never inserts -- a deal without an intake row stays untouched.
const r1 = await sb.from('repairs').update(upd).eq('deal_id',d.id).select('deal_id');
if(r1.error) throw r1.error;
if(!r1.data?.length) throw new Error('This repair has no intake record to update.');
if(title!==d.title){
const r2 = await sb.from('deals').update({title}).eq('id',d.id);
if(r2.error) throw new Error('Intake saved, but the equipment name could not be updated: '+r2.error.message);
}
S.err=''; S.repairEditing=false;
await openDeal(d.id);
}catch(err){
errEl.textContent = err.message || String(err);
btn.disabled=false;
}
}

// Repairs stage change. Deliberately writes ONLY stage_id: delivered_at is a Retail concept, and
// repairs.returned_at is stamped/cleared by the database trigger trg_repairs_stamp_returned.
async function saveRepairStage(e){
const d=S.deal, btn=e.target;
const to=Number(document.getElementById('rstg').value);
if(!to || to===d.stage_id) return;
btn.disabled=true;
const target=S.stages.find(s=>s.id===to);
try{
const { error } = await sb.from('deals').update({stage_id:to}).eq('id',d.id);
if(error) throw error;
S.err='';
const ev = await sb.from('stage_events').insert({deal_id:d.id,from_stage_id:d.stage_id,to_stage_id:to,changed_by:S.me.id});
if(ev.error) S.err='Stage updated, but the change could not be logged: '+ev.error.message;
await logActivity('stage_moved', d.id, (d.customers?.name?d.customers.name+' → ':'')+(target?.name||''));
}catch(err){
S.err = err.message || String(err);
btn.disabled=false; render(); return;
}
await openDeal(d.id);
}

async function saveDeal(e){
const btn=e.target; btn.disabled=true; btn.textContent='Saving…';
try{
const name=document.getElementById('cname').value.trim();
if(!name) throw new Error('Customer name is needed.');
const phone=document.getElementById('cphone').value.trim();

let cid=null;
if(S.newDealCustomerId){
// Customer-known path (New Deal launched from an existing Customer Profile):
// skip the normal phone lookup/insert entirely -- use the already-known
// customer_id directly. Zero customer rows are created on this path.
cid=S.newDealCustomerId;
} else {
if(phone){
const { data:found } = await sb.from('customers').select('id').eq('phone',phone).limit(1);
if(found?.length) cid=found[0].id;
}
if(!cid){
const { data:c, error } = await sb.from('customers')
.insert({ name, phone:phone||null, customer_type:'retail',
district:document.getElementById('cdist').value.trim()||null, state:'Kerala' })
.select('id').single();
if(error) throw error; cid=c.id;
}
}

const { data:deal, error:de } = await sb.from('deals').insert({
pipeline_id:Number(document.getElementById('npipe').value),
stage_id:Number(document.getElementById('nstage').value),
customer_id:cid,
title:document.getElementById('ntitle').value.trim()||name,
value:Number(document.getElementById('nval').value||0),
amount_collected:0,
source_id:document.getElementById('nsource').value ? Number(document.getElementById('nsource').value) : null,
assigned_to:(isOwner() && document.getElementById('nassign')) ? document.getElementById('nassign').value : S.me.id
}).select('id').single();
if(de) throw de;

const rows=[...document.querySelectorAll('#items .three')].map((r,i)=>({
deal_id:deal.id,
product_id:r.querySelector('.p').value?Number(r.querySelector('.p').value):null,
qty:Number(r.querySelector('.q').value||1),
rate:Number(r.querySelector('.r').value||0),
sort_order:i+1
})).filter(r=>r.product_id);
if(rows.length) await sb.from('deal_items').insert(rows);
await logActivity('lead_created', deal.id, name);

S.newDealCustomerId=null; S.newDealCustomerInfo=null; // clear on successful customer-known save
S.tab='pipeline'; S.pipeline=Number(document.getElementById('npipe').value); loadTab();
}catch(err){
S.err=err.message||String(err); btn.disabled=false; btn.textContent='Save deal'; render();
}
}

boot();

if ('serviceWorker' in navigator) {
window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
