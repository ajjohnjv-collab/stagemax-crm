<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STAGEMAX CRM</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#12100E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StageMax">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
--ink:#12100E; --panel:#1B1815; --panel-2:#241F1B; --line:#332C26;
--paper:#EDE7DF; --muted:#9A8E82;
--amber:#E8A33D; --rose:#C2506B; --cyan:#4AA3B8; --green:#6E9E5C; --violet:#8A6BA8;
--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font:400 15px/1.5 Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 96px}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(18,16,14,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hbar{max-width:760px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:10px}
.mark{font:700 18px Archivo Narrow;letter-spacing:.14em;text-transform:uppercase}
.mark span{color:var(--amber)}
.who{margin-left:auto;font-size:12px;color:var(--muted)}
.who button{color:var(--muted);text-decoration:underline;font-size:12px;margin-left:8px}

/* tabs */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:11px 4px 13px;font:600 11px Archivo;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;border-top:2px solid transparent}
nav button.on{color:var(--paper);border-top-color:var(--amber)}

/* side nav on wider screens (desktop / computer use) */
@media (min-width:860px){
.hbar{max-width:none;padding-left:224px}
nav{top:53px;left:0;right:auto;bottom:0;width:200px;flex-direction:column;border-top:none;border-right:1px solid var(--line);padding-bottom:16px}
nav button{flex:none;text-align:left;padding:13px 20px;border-top:none;border-left:3px solid transparent}
nav button.on{border-top-color:transparent;border-left-color:var(--amber)}
.wrap{max-width:900px;margin:0 auto 0 224px;padding:20px 24px 40px}
.fab{left:216px;right:auto}
}

/* generic */
h2{font:700 13px Archivo;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:9px}
.row{display:flex;gap:10px;align-items:baseline}
.grow{flex:1;min-width:0}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.amt{font:700 16px Archivo Narrow;white-space:nowrap}
.tag{display:inline-block;font:600 10.5px Archivo;letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:var(--panel-2);color:var(--muted)}
.tag.due{background:rgba(194,80,107,.16);color:#E8899E}
.tag.paid{background:rgba(110,158,92,.16);color:#9BC489}
.empty{padding:44px 18px;text-align:center;color:var(--muted);font-size:14px}
.err{background:rgba(194,80,107,.14);border:1px solid rgba(194,80,107,.4);color:#EFA3B3;padding:11px 13px;border-radius:var(--r);margin:12px 0;font-size:13.5px}

/* stage chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;color:var(--muted)}
.chip.on{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:600}
.chip b{font-weight:700;margin-left:5px;opacity:.65}

/* forms */
label{display:block;font:600 11px Archivo;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:13px 0 5px}
input,select{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
input:focus,select:focus{outline:2px solid var(--amber);outline-offset:-1px}
.btn{width:100%;background:var(--amber);color:#1A1206;font-weight:700;padding:13px;border-radius:8px;margin-top:18px}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper);font-weight:600;margin-top:9px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 76px 1fr;gap:8px;align-items:end;margin-bottom:8px}

/* dashboard */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat .v{font:700 20px Archivo Narrow;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.legend{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}

/* bars */
.bar{height:7px;border-radius:4px;background:var(--panel-2);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--amber)}

/* dashboard v2 */
.dash-hero{display:flex;align-items:center;gap:12px;margin:14px 0 2px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--amber);color:#1A1206;font:700 15px Archivo Narrow;display:flex;align-items:center;justify-content:center;flex:none}
.greet{flex:1;min-width:0}
.greet h1{font:700 19px Archivo Narrow;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.greet p{font-size:12px;color:var(--muted);margin-top:1px}
.iconbtn{position:relative;width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
.iconbtn .dot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--rose);border:2px solid var(--ink)}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:10px 0 2px;color:var(--muted)}
.search input{background:none;border:none;padding:0;flex:1;font-size:14px;color:var(--paper)}
.search input:focus{outline:none}
.search-results{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-top:6px;overflow:hidden}
.search-results .item{padding:10px 13px;cursor:pointer}
.search-results .item:hover{background:var(--panel-2)}

.stats4{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
@media (min-width:640px){.stats4{grid-template-columns:repeat(4,1fr)}}
.stat2{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:9px}
.stat2 .isq{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.stat2 .v{font:700 21px Archivo Narrow;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat2 .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}

.qa-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:9px}
@media (min-width:640px){.qa-grid{grid-template-columns:repeat(4,1fr)}}
.qa{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;font:600 11.5px Archivo;text-align:center;color:var(--paper)}
.qa .isq{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center}

.cols3{display:grid;gap:12px;grid-template-columns:1fr;margin-bottom:6px}
@media (min-width:860px){.cols3{grid-template-columns:1fr 1fr 1fr;align-items:start}}
.plrow{display:flex;align-items:center;gap:8px;padding:7px 0}
.plrow:not(:last-child){border-bottom:1px solid var(--line)}
.thead{display:none;padding:0 13px;font:600 10.5px Archivo;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
@media (min-width:700px){.thead{display:flex;gap:12px}}
.thead span{flex:none}
.trow{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;margin-bottom:7px}
.actrow{display:flex;gap:5px;flex:none}
.iact{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;text-decoration:none}
.iact.call{background:rgba(110,158,92,.16);color:#9BC489}
.iact.wa{background:rgba(74,163,184,.16);color:#8FD0E2}
.iact.done{background:rgba(232,163,61,.16);color:var(--amber)}
.pav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:640px){.pav{grid-template-columns:repeat(4,1fr)}}
.pav .card{margin-bottom:0}
.pav .n{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* login */
.login{max-width:340px;margin:16vh auto;padding:0 18px}
.login .mark{font-size:26px;margin-bottom:6px}
.login p{color:var(--muted);font-size:13.5px;margin-bottom:20px}

.fab{position:fixed;right:16px;bottom:74px;z-index:29;background:var(--amber);color:#1A1206;width:52px;height:52px;border-radius:50%;font-size:26px;line-height:1;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.back{color:var(--muted);font-size:13px;padding:14px 0 2px}
.item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.item:last-child{border-bottom:none}
.qty{color:var(--muted);font-size:13px;white-space:nowrap}

/* ── CRE dashboard v4 (STAGEMAX approved reference — prominent icons, premium KPIs) ── */
:root{
--cd-bg:#0B0D10; --cd-side:#12141A; --cd-surface:#171A21; --cd-surface2:#1E222B;
--cd-line:#262B36; --cd-text:#F2F1EE; --cd-muted:#8A93A6; --cd-accent:#FF7A29; --cd-accent-ink:#2A1200;
--cd-accent2:#FFB35C;
}
.cd-app{display:flex;min-height:100vh;background:var(--cd-bg);color:var(--cd-text);font-family:Archivo,system-ui,sans-serif}
.cd-side{position:fixed;top:0;left:0;bottom:0;width:232px;background:var(--cd-side);border-right:1px solid var(--cd-line);display:flex;flex-direction:column;padding:14px 0 0;z-index:40;transition:transform .2s}
.cd-side .cd-logo{display:flex;flex-direction:column;padding:0 20px 12px;border-bottom:1px solid var(--cd-line);margin-bottom:8px}
.cd-side .cd-logo b{font:800 22px Archivo Narrow;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.cd-side .cd-logo b span{color:var(--cd-accent)}
.cd-side .cd-logo small{display:block;font-size:9.5px;letter-spacing:.12em;color:var(--cd-muted);text-transform:uppercase;margin-top:6px}
.cd-nav{flex:1;overflow-y:auto;padding:4px 12px}
.cd-nav button{width:100%;display:flex;align-items:center;gap:13px;padding:7px 13px;border-radius:10px;font:600 13.5px Archivo;color:#B7BFCF;text-align:left;margin-bottom:1px;transition:background .15s,color .15s}
.cd-nav button svg{flex:none;width:21px;height:21px;stroke-width:1.85;opacity:.95}.cd-nav button>span:not(.cd-soon-tag){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-nav button.on{background:linear-gradient(135deg,var(--cd-accent),#FF6A17);color:var(--cd-accent-ink);box-shadow:0 4px 14px -4px rgba(255,122,41,.55)}
.cd-nav button.on svg{opacity:1;stroke-width:2}
.cd-nav button:not(.on):hover{background:var(--cd-surface2);color:var(--cd-text)}
.cd-nav button.soon{opacity:.55}
.cd-nav .cd-soon-tag{margin-left:auto;font:600 8.5px Archivo;letter-spacing:.06em;text-transform:uppercase;background:var(--cd-surface2);color:var(--cd-muted);padding:2px 5px;border-radius:4px;flex:none}
.cd-side-foot{margin:auto 12px 14px;padding-top:10px;border-top:1px solid var(--cd-line)}.cd-side-foot button{width:100%;display:flex;align-items:center;gap:13px;padding:7px 13px;border-radius:10px;font:600 13.5px Archivo;color:#B7BFCF;text-align:left;transition:background .15s,color .15s}.cd-side-foot button svg{flex:none;width:21px;height:21px;stroke-width:1.85;opacity:.95}.cd-side-foot button:hover{background:var(--cd-surface2);color:var(--cd-text)}




.cd-main{flex:1;margin-left:232px;min-width:0}
.cd-top{position:sticky;top:0;z-index:35;display:flex;align-items:center;gap:14px;padding:13px 24px;background:rgba(11,13,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--cd-line)}
.cd-burger{display:none;flex:none;width:34px;height:34px;border-radius:8px;background:var(--cd-surface);align-items:center;justify-content:center;color:var(--cd-muted)}
.cd-burger svg{width:19px;height:19px;stroke-width:1.9}
.cd-search{flex:1;max-width:520px;display:flex;align-items:center;gap:9px;background:var(--cd-surface);border:1px solid var(--cd-line);border-radius:10px;padding:9px 14px;color:var(--cd-muted);transition:border-color .15s}
.cd-search:focus-within{border-color:var(--cd-accent)}
.cd-search svg{width:16px;height:16px;stroke-width:1.8;flex:none}
.cd-search input{background:none;border:none;flex:1;color:var(--cd-text);font-size:13.5px}
.cd-search input:focus{outline:none}
.cd-top-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.cd-bell{position:relative;width:38px;height:38px;border-radius:50%;background:var(--cd-surface);border:1px solid var(--cd-line);display:flex;align-items:center;justify-content:center;color:var(--cd-muted);flex:none;cursor:pointer;transition:border-color .15s}
.cd-bell:hover{border-color:var(--cd-accent);color:var(--cd-text)}
.cd-bell svg{width:18px;height:18px;stroke-width:1.85}
.cd-bell .dot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 3px;border-radius:8px;background:var(--rose);color:#fff;font:700 9.5px Archivo;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--cd-bg)}
.cd-who{display:flex;align-items:center;gap:10px}
.cd-who .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--cd-accent),#FF6A17);color:var(--cd-accent-ink);font:800 13.5px Archivo Narrow;display:flex;align-items:center;justify-content:center;flex:none}
.cd-who .meta{line-height:1.25}
.cd-who .meta b{display:block;font-size:13px}
.cd-who .meta span{display:block;font-size:10.5px;color:var(--cd-muted);text-transform:uppercase;letter-spacing:.05em}

.cd-body{padding:24px;max-width:1220px}

/* hero: greeting + sales target, one unified card with subtle brand flourish */
.cd-hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#181B22 0%,#14161C 62%,#1B140F 100%);border:1px solid var(--cd-line);border-radius:16px;padding:20px 26px;display:flex;align-items:center;gap:26px;flex-wrap:wrap;margin-bottom:20px}
.cd-hero::before{content:'';position:absolute;top:-60px;right:-40px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,41,.24),transparent 70%);pointer-events:none}

.cd-greet{position:relative;z-index:1;flex:none}
.cd-greet h1{font:800 25px Archivo Narrow;letter-spacing:.01em}
.cd-greet h1 b{color:var(--cd-accent);font-weight:800}
.cd-greet p{color:var(--cd-muted);font-size:13px;margin-top:4px}
.cd-target-divider{position:relative;z-index:1;width:1px;align-self:stretch;background:var(--cd-line);flex:none}.cd-target{position:relative;z-index:1;flex:1;min-width:300px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.cd-target .tgt-top{display:flex;align-items:center;gap:9px}
.cd-target .tgt-top .isq{width:26px;height:26px;border-radius:8px;background:rgba(255,122,41,.16);color:var(--cd-accent);display:flex;align-items:center;justify-content:center;flex:none}
.cd-target .tgt-top .isq svg{width:14px;height:14px;stroke-width:2}.cd-target .tgt-top .ttl{font:700 10.5px Archivo;letter-spacing:.06em;text-transform:uppercase;color:var(--cd-muted);white-space:nowrap}
.cd-target .tgt-bot{display:flex;align-items:center;gap:16px}
.cd-target .tgt-bot .lbl{font-size:13px;color:var(--cd-text);flex:none;white-space:nowrap}
.cd-target .bar2{flex:1;height:8px;border-radius:5px;background:var(--cd-surface2);overflow:hidden}
.cd-target .bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--cd-accent),var(--cd-accent2));border-radius:5px}.cd-target .tgt-bot .pct{font:800 17px Archivo Narrow;color:var(--cd-accent);flex:none}.cd-target .tgt-div{width:1px;align-self:stretch;background:var(--cd-line);flex:none}.cd-target .tgt-stat{flex:none;text-align:left;line-height:1.3;background:none;border:none;padding:0}.cd-target .tgt-stat b{display:block;font:800 15px Archivo Narrow;color:var(--cd-text)}.cd-target .tgt-stat span{display:block;font-size:9.5px;color:var(--cd-muted);text-transform:uppercase;letter-spacing:.04em;margin-top:1px}

.cd-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:13px;margin-bottom:20px}
.cd-kpi{position:relative;background:var(--cd-surface);border:1px solid var(--cd-line);border-radius:13px;padding:15px;transition:border-color .15s,transform .15s}
.cd-kpi.clickable{cursor:pointer}
.cd-kpi.clickable:hover{border-color:var(--cd-accent);transform:translateY(-2px)}
.cd-kpi .isq{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.cd-kpi .isq svg{width:20px;height:20px;stroke-width:1.9}
.cd-kpi .chev{position:absolute;top:14px;right:13px;color:var(--cd-muted);opacity:.55}
.cd-kpi .chev svg{width:14px;height:14px;stroke-width:2}
.cd-kpi .v{font:800 23px Archivo Narrow}
.cd-kpi .v.dim{color:var(--cd-muted);font-weight:600}
.cd-kpi .l{font-size:10.8px;color:var(--cd-muted);margin-top:4px;line-height:1.4}
.cd-grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}
.cd-panel{background:var(--cd-surface);border:1px solid var(--cd-line);border-radius:13px;padding:18px;margin-bottom:18px}
.cd-panel h3{font:700 14.5px Archivo;display:flex;align-items:center;gap:9px;margin-bottom:14px}
.cd-panel h3 .isq{width:26px;height:26px;border-radius:8px;background:rgba(255,122,41,.14);color:var(--cd-accent);display:flex;align-items:center;justify-content:center;flex:none}
.cd-panel h3 .isq svg{width:14px;height:14px;stroke-width:2}
.cd-panel h3 a,.cd-panel h3 button{margin-left:auto;font-size:11.5px;color:var(--cd-accent);font-weight:600;display:flex;align-items:center;gap:3px}
.cd-frow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--cd-line)}
.cd-frow:last-child{border-bottom:none}
.cd-frow .isq{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 14px -6px currentColor}
.cd-frow .isq svg{width:16px;height:16px;stroke-width:1.9}
.cd-frow .grow{min-width:0;flex:1}
.cd-frow .name{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd-frow .sub{font-size:11.5px;color:var(--cd-muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd-pill{display:inline-block;font:700 10px Archivo;letter-spacing:.02em;padding:3px 8px;border-radius:6px;white-space:nowrap;flex:none}
.cd-frow .acts{display:flex;gap:6px;flex:none}
.cd-frow .acts a,.cd-frow .acts button{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.cd-frow .acts a:hover,.cd-frow .acts button:hover{transform:scale(1.08)}
.cd-frow .acts svg{width:14px;height:14px;stroke-width:1.9}

.cd-empty{padding:38px 20px 26px;text-align:center;color:var(--cd-muted)}
.cd-empty .isq{width:58px;height:58px;border-radius:16px;background:var(--cd-surface2);color:var(--cd-muted);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.cd-empty .isq svg{width:28px;height:28px;stroke-width:1.6}

/* ── auth ── */
async function boot(){
const { data:{ session } } = await sb.auth.getSession();
if(!session) return renderLogin();
const { data:prof } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
S.me = prof || { full_name: session.user.email, role:'cre', id: session.user.id };
S.tab = isOwner() ? 'dashboard' : 'mydash';
await loadRefs();
await loadTab();
}

function renderLogin(msg){
app.innerHTML = `<div class="login">
<div class="mark">StageMax<span> CRM</span></div>
<p>StageMax CRM — sign in to work your leads.</p>
${msg?`<div class="err">${esc(msg)}</div>`:''}
<label for="em">Email</label><input id="em" type="email" autocomplete="username">
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
<button class="btn" id="go">Sign in</button>
</div>`;
const go = async () => {
const b=document.getElementById('go'); b.disabled=true; b.textContent='Signing in…';
const { error } = await sb.auth.signInWithPassword({
email: document.getElementById('em').value.trim(),
password: document.getElementById('pw').value
});
if(error) return renderLogin(error.message);
boot();
};
document.getElementById('go').onclick = go;
document.getElementById('pw').onkeydown = e => { if(e.key==='Enter') go(); };
}

/* ── data ── */
async function loadRefs(){
const [p,st,pr,pf,sr] = await Promise.all([
sb.from('pipelines').select('*').eq('is_active',true).order('sort_order'),
sb.from('stages').select('*').order('sort_order'),
sb.from('products').select('*').eq('is_active',true).order('name'),
sb.from('profiles').select('*').eq('is_active',true),
sb.from('sources').select('*').eq('is_active',true)
]);
S.pipelines=p.data||[]; S.stages=st.data||[]; S.products=pr.data||[]; S.profiles=pf.data||[]; S.sources=sr.data||[];
}

async function loadChaseSources(){
const today = new Date().toISOString().slice(0,10);
const [revR,promR] = await Promise.all([
sb.from('deals').select('*, customers(name,phone,district), stages(name,is_lost)')
.not('revival_date','is',null).lte('revival_date', today).order('revival_date',{ascending:true}),
sb.from('deals').select('*, customers(name,phone,district), stages(name,is_delivered)')
.not('balance_promised_date','is',null).lte('balance_promised_date', today).order('balance_promised_date',{ascending:true})
]);
if(revR.error) throw revR.error; S.myRevivals = (revR.data||[]).filter(d=>d.stages?.is_lost);
if(promR.error) throw promR.error;
S.myPromises = (promR.data||[]).filter(d=>(Number(d.value||0)-Number(d.amount_collected||0))>0);
}

async function loadDashboardShared(){
const today = new Date().toISOString().slice(0,10);
const mStart = monthStart();
const [openR,fuR,actR,mpR,weR] = await Promise.all([
sb.from('deals').select('*, customers(name,phone,district), stages(name,is_won,is_lost,is_delivered,pipeline_id,sort_order), pipelines(name,sort_order)')
.order('created_at',{ascending:false}).limit(300),
sb.from('follow_ups').select('*, deals(title, customers(name,phone), stages(name,is_won,is_lost,is_delivered))').eq('done',false).lte('due_date', today).order('due_date',{ascending:true}),
sb.from('activity_log').select('*, deals(title, customers(name))').order('created_at',{ascending:false}).limit(10),
sb.from('cre_performance_daily').select('*').gte('day', mStart),
sb.from('stage_events').select('deal_id,to_stage_id,changed_at').gte('changed_at', mStart)
]);
if(openR.error) throw openR.error; S.openDeals = openR.data||[];
if(fuR.error) throw fuR.error; S.followUps = fuR.data||[];
if(actR.error) throw actR.error; S.activity = actR.data||[];
if(mpR.error) throw mpR.error; S.monthPerf = mpR.data||[];
if(weR.error) throw weR.error;
const wonStageIds = new Set(S.stages.filter(s=>s.is_won).map(s=>s.id));
S.monthWonIds = [...new Set((weR.data||[]).filter(r=>wonStageIds.has(r.to_stage_id)).map(r=>r.deal_id))];
}

async function loadTab(){
S.err='';
try{
if(S.tab==='pipeline'){
if(isOwner()){
const { data, error } = await sb.from('deals')
.select('*, customers(name,phone,district), stages(name,is_delivered,is_lost)')
.eq('pipeline_id', S.pipeline).order('created_at',{ascending:false}).limit(200);
if(error) throw error; S.deals = data||[];
} else {
S.leadPage = 0; S.leadFollowMap = {};
await fetchLeadsPage();
}
}
if(S.tab==='money'){
const { data, error } = await sb.from('payments_pending').select('*');
if(error) throw error; S.pending = data||[];
}
if(S.tab==='moving'){
const { data, error } = await sb.from('product_movement').select('*');
if(error) throw error; S.movement = data||[];
}
if(S.tab==='dashboard'){
const since = new Date(Date.now() - S.teamRange*86400000).toISOString().slice(0,10);
const trendSince = new Date(Date.now() - 13*86400000).toISOString().slice(0,10);
const openIds = S.stages.filter(s=>!s.is_lost && !s.is_delivered).map(s=>s.id);
const [teamR,trendR,srcR,prodR,duesR,pipeR] = await Promise.all([
sb.from('cre_performance_daily').select('*').gte('day', since),
sb.from('cre_performance_daily').select('day,value_delivered,money_collected').gte('day', trendSince),
sb.from('deals').select('source_id').gte('created_at', since),
sb.from('product_movement').select('*').limit(5),
sb.from('customer_balance_summary').select('total_balance'),
sb.from('deals').select('value').in('stage_id', openIds.length?openIds:[-1])
]);
if(teamR.error) throw teamR.error; S.team = teamR.data||[];
if(trendR.error) throw trendR.error;
const byDay={};
(trendR.data||[]).forEach(r=>{
const k=r.day; if(!byDay[k]) byDay[k]={day:k,value:0,money:0};
byDay[k].value += Number(r.value_delivered||0); byDay[k].money += Number(r.money_collected||0);
});
S.dashTrend = Object.values(byDay).sort((a,b)=>a.day.localeCompare(b.day));
if(srcR.error) throw srcR.error;
const bySrc={};
(srcR.data||[]).forEach(r=>{ const k=r.source_id??'none'; bySrc[k]=(bySrc[k]||0)+1; });
S.dashSources = Object.entries(bySrc).map(([sid,count])=>({
name: sid==='none' ? 'Unknown' : (S.sources.find(s=>s.id===Number(sid))?.name || 'Unknown'), count
})).sort((a,b)=>b.count-a.count);
if(prodR.error) throw prodR.error; S.dashProducts = prodR.data||[];
if(duesR.error) throw duesR.error;
S.dashDuesTotal = (duesR.data||[]).reduce((a,b)=>a+Number(b.total_balance||0),0);
if(pipeR.error) throw pipeR.error;
S.dashPipelineValue = (pipeR.data||[]).reduce((a,b)=>a+Number(b.value||0),0);
await loadChaseSources();
await loadDashboardShared();
}
if(S.tab==='mydash' || S.tab==='followups' || S.tab==='myperf'){
const since = new Date(Date.now() - S.teamRange*86400000).toISOString().slice(0,10);
const { data:perfData, error:perfErr } = await sb.from('cre_performance_daily').select('*').gte('day', since);
if(perfErr) throw perfErr; S.myPerf = perfData||[];
await loadChaseSources();
await loadDashboardShared();
}
if(S.tab==='dues'){
const { data, error } = await sb.from('customer_balance_summary').select('*');
if(error) throw error; S.dues = data||[]; S.duesOpen=null; S.duesDeals=[];
}
if(S.tab==='dispatch'){
const readyIds = S.stages.filter(s=>s.is_won && !s.is_delivered).map(s=>s.id);
const [r1,r2] = await Promise.all([
sb.from('deals').select('*, customers(name,phone,district,address), stages(name)')
.in('stage_id', readyIds.length?readyIds:[-1]).order('created_at',{ascending:true}),
sb.from('deals').select('*, customers(name,phone,district)')
.not('courier_name','is',null).order('dispatch_date',{ascending:false}).limit(25)
]);
if(r1.error) throw r1.error; if(r2.error) throw r2.error;
S.dispatchReady = r1.data||[]; S.dispatchSent = r2.data||[];
}
}catch(e){ S.err = e.message || String(e); }
render();
}

function render(){

app.innerHTML = shell(
S.tab==='pipeline' ? (isOwner() ? viewPipeline() : viewMyLeads()) :
S.tab==='addlead' ? viewAddLead() :
S.tab==='money' ? viewMoney() :
S.tab==='dues' ? viewDues() :
S.tab==='dispatch' ? viewDispatch() :

S.tab==='dashboard' ? viewDashboard() :

S.tab==='myperf' ? viewMyPerformance() :
SOON_TABS.includes(S.tab) ? viewComingSoon(S.tab) : viewNew()
);
wire();
}

${S.tab==='pipeline'?'<button class="fab" id="fab">+</button>':''}
<nav>${t('dashboard','Dashboard')}${t('pipeline','Deals')}${t('money','Money in')}${t('dispatch','Dispatch')}${t('dues','Dues')}${t('moving','Moving')}${t('new','Add')}</nav>`;

/* ── deals ── */
function viewPipeline(){
const stages = S.stages.filter(s=>s.pipeline_id===S.pipeline);
const shown = S.stage ? S.deals.filter(d=>d.stage_id===S.stage) : S.deals;
const pipes = S.pipelines.map(p=>
`<button class="chip ${S.pipeline===p.id?'on':''}" data-pipe="${p.id}">${esc(p.name)}</button>`).join('');
const chips = [`<button class="chip ${!S.stage?'on':''}" data-stage="">All<b>${S.deals.length}</b></button>`]
.concat(stages.map(s=>{
const n=S.deals.filter(d=>d.stage_id===s.id).length;
return `<button class="chip ${S.stage===s.id?'on':''}" data-stage="${s.id}">${esc(s.name)}<b>${n}</b></button>`;
})).join('');

const cards = shown.length ? shown.map(d=>{
const bal = Number(d.value||0)-Number(d.amount_collected||0);
const paid = bal<=0 && Number(d.value)>0;
return `<div class="card" data-deal="${d.id}">
<div class="row">
<div class="grow">
<div class="name">${esc(d.customers?.name||'No customer')}</div>
<div class="sub">${esc(d.title||'')}</div>
</div>
<div style="text-align:right">
<div class="amt">${rs(d.value)}</div>
<div class="sub">${esc(d.stages?.name||'')}</div>
</div>
</div>
<div class="row" style="margin-top:9px;gap:7px">
${paid?'<span class="tag paid">Paid</span>':(Number(d.value)>0?`<span class="tag due">${rs(bal)} due</span>`:'')}
${d.customers?.district?`<span class="tag">${esc(d.customers.district)}</span>`:''}
${d.invoice_no?`<span class="tag">${esc(d.invoice_no)}</span>`:''}
<span class="sub" style="margin-left:auto">${day(d.delivered_at||d.created_at)}</span>
</div>
</div>`;
}).join('') : `<div class="empty">No deals here yet.<br>Tap + to add the first one.</div>`;

return `<div class="chips">${pipes}</div><div class="chips">${chips}</div>${cards}`;
}

// GST is optional per Estimate, fixed at 18%, applied AFTER the Final
// Discount. No separate GST amount is stored anywhere -- it's derived here
// (and, authoritatively, inside approve_estimate()) from the subtotal, the
// discount and the on/off toggle alone. Shared by the editable live-preview
// and the approved/locked display so both use exactly the same formula.
function estimateBreakdown(subtotal, discount, gstEnabled){
const taxable = Math.max(0, subtotal - discount);
const gst = gstEnabled ? Math.round(taxable*0.18*100)/100 : 0;
const final = taxable + gst;
return { taxable, gst, final };
}

function updateEstimateTotals(){
const wrap=document.getElementById('estItems'); if(!wrap) return;
let subtotal=0;
wrap.querySelectorAll('.cd-est-row').forEach(r=>{
const q=Number(r.querySelector('.q').value||0), rt=Number(r.querySelector('.r').value||0);
if(r.querySelector('.p').value) subtotal += q*rt;
});
const discInput=document.getElementById('estDiscount');
const disc=Math.max(0,Number(discInput?.value||0));
const gstCheckbox=document.getElementById('estGst');
const gstEnabled=!!(gstCheckbox&&gstCheckbox.checked);
const { taxable, gst, final } = estimateBreakdown(subtotal, disc, gstEnabled);
const st=document.getElementById('estSubtotal'); if(st) st.textContent=rs(subtotal);
const gstRows=document.getElementById('estGstRows');
if(gstRows) gstRows.style.display = gstEnabled ? '' : 'none';
const tx=document.getElementById('estTaxable'); if(tx) tx.textContent=rs(taxable);
const ga=document.getElementById('estGstAmt'); if(ga) ga.textContent=rs(gst);
const ft=document.getElementById('estFinal'); if(ft) ft.textContent=rs(final);
const gs=document.getElementById('estGstState'); if(gs) gs.textContent = gstEnabled?'ON':'OFF';
}

async function fetchLeadsPage(){
let dealIdFilter=null;
if(S.leadFollow!=='all'){
const today=new Date().toISOString().slice(0,10);
let fq=sb.from('follow_ups').select('deal_id').eq('done',false);
fq = S.leadFollow==='today' ? fq.eq('due_date',today) : fq.lt('due_date',today);
const {data:fus}=await fq;
dealIdFilter=[...new Set((fus||[]).map(f=>f.deal_id))];
if(!dealIdFilter.length){ if(S.leadPage===0) S.deals=[]; S.leadHasMore=false; return; }
}
let custIdFilter=null;
if(S.leadQ.trim()){
const like=`%${S.leadQ.trim()}%`;
const {data:cs}=await sb.from('customers').select('id').or(`name.ilike.${like},phone.ilike.${like}`).limit(200);
custIdFilter=(cs||[]).map(c=>c.id);
if(!custIdFilter.length){ if(S.leadPage===0) S.deals=[]; S.leadHasMore=false; return; }
}
let q=sb.from('deals').select('*, customers(name,phone,district,customer_type,alt_phone), stages(name,is_won,is_lost,is_delivered), sources(name)')
.order('created_at',{ascending:false})
.range(S.leadPage*S.leadPageSize, S.leadPage*S.leadPageSize+S.leadPageSize-1);
if(S.leadStage) q=q.eq('stage_id',S.leadStage);
if(S.leadSource) q=q.eq('source_id',S.leadSource);
if(dealIdFilter) q=q.in('id',dealIdFilter);
if(custIdFilter) q=q.in('customer_id',custIdFilter);
const {data,error}=await q;
if(error) throw error;
S.deals = S.leadPage===0 ? (data||[]) : S.deals.concat(data||[]);
S.leadHasMore = (data||[]).length===S.leadPageSize;
const pageIds=(data||[]).map(x=>x.id);
if(pageIds.length){
const {data:fus2}=await sb.from('follow_ups').select('deal_id,due_date,contact_type').eq('done',false).in('deal_id',pageIds).order('due_date',{ascending:true});
const map={};
(fus2||[]).forEach(f=>{ if(!map[f.deal_id]) map[f.deal_id]=f; });
S.leadFollowMap = {...S.leadFollowMap, ...map};
}
}

}

.insert({ name, phone:phone||null, alt_phone:alt||null, customer_type:ctype||'retail', district:dist||null, state:'Kerala' })
.select('id').single();
if(error) throw error; cid=c.id;
} else {
const patch={};
if(alt) patch.alt_phone=alt;
if(dist) patch.district=dist;
if(Object.keys(patch).length) await sb.from('customers').update(patch).eq('id',cid);
}

const retailPipe = S.pipelines.find(p=>/retail/i.test(p.name)) || S.pipelines[0];
const firstStage = S.stages.filter(s=>s.pipeline_id===retailPipe.id).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))[0];

const { data:deal, error:de } = await sb.from('deals').insert({
pipeline_id:retailPipe.id,
stage_id:firstStage.id,
customer_id:cid,
title:document.getElementById('alreq').value.trim()||name,

amount_collected:0,
source_id:document.getElementById('alsource').value?Number(document.getElementById('alsource').value):null,
assigned_to:S.me.id
}).select('id').single();
if(de) throw de;

const rows=[...document.querySelectorAll('#alitems .three')].map((r,i)=>({
deal_id:deal.id,
product_id:r.querySelector('.p').value?Number(r.querySelector('.p').value):null,
qty:Number(r.querySelector('.q').value||1),
rate:Number(r.querySelector('.r').value||0),

})).filter(r=>r.product_id);

async function saveEstimate(d){
const btn=document.getElementById('estSave'); if(btn){ btn.disabled=true; btn.textContent='Saving…'; }

const rows=[...document.querySelectorAll('#estItems .cd-est-row')].map((r,i)=>({
deal_id:d.id,
product_id:r.querySelector('.p').value?Number(r.querySelector('.p').value):null,
qty:Number(r.querySelector('.q').value||1),
rate:Number(r.querySelector('.r').value||0),
sort_order:i+1
})).filter(r=>r.product_id);
const discount=Math.max(0,Number(document.getElementById('estDiscount').value||0));

openDeal(d.id);

if(errBox) errBox.innerHTML=`<div class="cd-est-err">${esc(err.message||String(err))}</div>`;
if(btn){ btn.disabled=false; btn.textContent='Save Estimate'; }

/* ── dashboard (owner only) ── */
function trendChart(data){
if(!data.length) return '<div class="empty">No activity yet.</div>';
const w=320, h=104, pad=2, top=6;
const max = Math.max(1, ...data.map(d=>Math.max(d.value,d.money)));
const bw = (w-pad*2)/data.length;
const barW = Math.max(1.5,(bw-3)/2);
const bars = data.map((d,i)=>{
const x = pad + i*bw;
const vh = Math.round((d.value/max)*(h-top));
const mh = Math.round((d.money/max)*(h-top));
return `<rect x="${x.toFixed(1)}" y="${h-vh}" width="${barW.toFixed(1)}" height="${vh}" fill="var(--amber)"/>`+
`<rect x="${(x+barW+1.5).toFixed(1)}" y="${h-mh}" width="${barW.toFixed(1)}" height="${mh}" fill="var(--cyan)"/>`;
}).join('');
return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:104px;display:block" preserveAspectRatio="none">${bars}</svg>`;
}

function donutChart(data){
const total = data.reduce((a,b)=>a+b.count,0);
if(!total) return '<div class="empty">No leads in this period.</div>';
const colors=['var(--amber)','var(--rose)','var(--cyan)','var(--green)','var(--violet)','var(--muted)'];
const r=40, c=2*Math.PI*r, cx=52, cy=52;
let offset=0;
const circles = data.map((d,i)=>{
const len = (d.count/total)*c;
const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="15" stroke-dasharray="${len.toFixed(1)} ${(c-len).toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>`;
offset += len; return seg;
}).join('');
const legend = data.map((d,i)=>`<div class="row" style="gap:7px;margin-top:6px">
<span class="dot" style="background:${colors[i%colors.length]}"></span>
<span class="sub grow">${esc(d.name)}</span><span class="sub">${d.count}</span>
</div>`).join('');
return `<div class="row" style="align-items:center;gap:16px">
<svg width="104" height="104" viewBox="0 0 104 104" style="flex:none">${circles}</svg>
<div class="grow">${legend}</div>
</div>`;
}

function pipelineBreakdown(rows){
const by={};
rows.forEach(d=>{

const k=d.pipeline_id+'-'+d.stage_id;

by[k].count++;
});
return Object.values(by).sort((a,b)=>a.sort-b.sort);
}

function timeAgo(ts){
const s = Math.max(1, Math.round((Date.now()-new Date(ts).getTime())/1000));
if(s<60) return s+'s ago';
const m=Math.round(s/60); if(m<60) return m+'m ago';
const h=Math.round(m/60); if(h<24) return h+'h ago';
const d=Math.round(h/24); return d+'d ago';
}

<div class="stat"><div class="v" style="color:#E8899E">${rs(S.dashDuesTotal)}</div><div class="l">Outstanding dues</div></div>
</div>

<h2>Sales &amp; collections · last 14 days</h2>
<div class="chips">${chips}</div>
<div class="card">${trendChart(S.dashTrend)}
<div class="row" style="margin-top:10px;gap:16px">
<div class="legend"><span class="dot" style="background:var(--amber)"></span><span class="sub">Value delivered</span></div>
<div class="legend"><span class="dot" style="background:var(--cyan)"></span><span class="sub">Collected</span></div>
</div>
</div>

<h2>Leads by source · ${esc(rangeLabel)}</h2>
<div class="card">${donutChart(S.dashSources)}</div>

<h2>Top products · all time</h2>
${products}

<h2>Team performance · ${esc(rangeLabel)}</h2>
${teamCards}`;
}

/* ── dues (owner only) ── */
function viewDues(){
if(!S.dues.length) return `<div class="empty">Nothing pending.<br>Every dealer and customer is settled up.</div>`;
const total = S.dues.reduce((a,b)=>a+Number(b.total_balance||0),0);
return `<h2>Dues · ${rs(total)}</h2>` + S.dues.map(c=>{
const open = S.duesOpen===c.customer_id;
const dealerTag = c.customer_type==='dealer' ? '<span class="tag">Dealer</span>' : '';
return `<div class="card">
<div class="row" data-due="${c.customer_id}" style="cursor:pointer">
<div class="grow">
<div class="name">${esc(c.customer_name)}</div>
<div class="sub">${dealerTag}${c.district?' '+esc(c.district):''} · ${c.pending_deals} deal${Number(c.pending_deals)===1?'':'s'} pending</div>
</div>
<div style="text-align:right">
<div class="amt" style="color:#E8899E">${rs(c.total_balance)}</div>
<div class="sub">${open?'Hide ↑':'View ↓'}</div>
</div>
</div>
${c.phone?`<a class="btn ghost" style="display:block;text-align:center;text-decoration:none;margin-top:9px"
href="https://wa.me/91${esc(String(c.phone).replace(/\D/g,'').slice(-10))}">Ask for payment</a>`:''}
${open ? `<div style="margin-top:4px">${
S.duesDeals.length ? S.duesDeals.map(d=>{
const bal=Number(d.value||0)-Number(d.amount_collected||0);
return `<div class="item" data-deal="${d.id}" style="cursor:pointer">
<div class="grow">${esc(d.title||'')}${d.invoice_no?' · '+esc(d.invoice_no):''}
<span class="sub" style="display:block">${day(d.delivered_at)}</span></div>
<div class="amt" style="font-size:14px;color:#E8899E">${rs(bal)}</div>
</div>`;
}).join('') : '<div class="sub" style="padding:9px 0">Loading…</div>'
}</div>` : ''}
</div>`;
}).join('');
}

/* ── dispatch & courier ── */
function viewDispatch(){
const ready = S.dispatchReady, sent = S.dispatchSent;
const readyCards = ready.length ? ready.map(d=>{
const addr=[d.customers?.address,d.customers?.district].filter(Boolean).join(', ');
return `<div class="card">
<div class="row"><div class="grow">
<div class="name">${esc(d.customers?.name||'No customer')}</div>
<div class="sub">${esc(d.title||'')}${d.invoice_no?' · '+esc(d.invoice_no):''} · ${esc(d.stages?.name||'')}</div>
</div><div class="amt">${rs(d.value)}</div></div>
${addr?`<div class="sub" style="margin-top:6px">${esc(addr)}</div>`:''}
${d.customers?.phone?`<div class="sub">${esc(d.customers.phone)}</div>`:''}
<label for="cr-${d.id}">Courier</label><input id="cr-${d.id}" placeholder="e.g. DTDC, Professional" value="${esc(d.courier_name||'')}">
<label for="awb-${d.id}">Tracking / AWB number</label><input id="awb-${d.id}" placeholder="AWB / consignment no." value="${esc(d.awb_number||'')}">
<button class="btn" data-dispatch="${d.id}">Mark dispatched</button>
</div>`;
}).join('') : `<div class="empty">Nothing waiting to ship.</div>`;

const sentCards = sent.length ? sent.map(d=>`<div class="card">
<div class="row"><div class="grow">
<div class="name">${esc(d.customers?.name||'No customer')}</div>
<div class="sub">${esc(d.courier_name||'—')}${d.awb_number?' · '+esc(d.awb_number):''}</div>
</div><div class="sub">${day(d.dispatch_date)}</div></div>
</div>`).join('') : '';

return `<h2>Ready to dispatch · ${ready.length}</h2>${readyCards}` +
(sent.length ? `<h2>Recently dispatched</h2>${sentCards}` : '');
}

async function toggleDue(cid){
if(S.duesOpen===cid){ S.duesOpen=null; S.duesDeals=[]; render(); return; }
S.duesOpen=cid; S.duesDeals=[]; render();
const { data, error } = await sb.from('deals')
.select('*, stages(is_delivered)')
.eq('customer_id', cid);
if(error){ S.err=error.message; render(); return; }
S.duesDeals = (data||[])
.filter(d=>d.stages?.is_delivered && (Number(d.value||0)-Number(d.amount_collected||0))>0)
.sort((a,b)=> new Date(a.delivered_at||0) - new Date(b.delivered_at||0));
render();
}

async function markDispatched(id,btn){
btn.disabled=true; btn.textContent='Saving…';
try{
const deal=S.dispatchReady.find(x=>x.id===id);
const courier=document.getElementById('cr-'+id).value.trim();
const awb=document.getElementById('awb-'+id).value.trim();
const target=S.stages.find(s=>s.pipeline_id===deal.pipeline_id && s.is_delivered);
const upd={ courier_name:courier||null, awb_number:awb||null, dispatch_date:new Date().toISOString().slice(0,10) };
if(target){ upd.stage_id=target.id; upd.delivered_at=new Date().toISOString(); }
await sb.from('deals').update(upd).eq('id',id);
if(target) await sb.from('stage_events').insert({deal_id:id,from_stage_id:deal.stage_id,to_stage_id:target.id,changed_by:S.me.id});
await logActivity('dispatched', id, [courier,awb].filter(Boolean).join(' · ') || (deal.customers?.name||''));
loadTab();
}catch(err){ S.err=err.message||String(err); render(); }
}

/* ── new deal ── */
function viewNew(){
const pipes=S.pipelines.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
const sources=S.sources.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
const assign = isOwner() ? `<label for="nassign">Assign to</label><select id="nassign">
${S.profiles.map(p=>`<option value="${p.id}" ${p.id===S.me.id?'selected':''}>${esc(p.full_name)}</option>`).join('')}
</select>` : '';
return `<h2>New deal</h2>
<div class="card">
<label for="cname">Customer name</label><input id="cname" placeholder="Name on the bill">
<div class="two">
<div><label for="cphone">Phone</label><input id="cphone" inputmode="numeric" placeholder="10 digits"></div>
<div><label for="cdist">District</label><input id="cdist" placeholder="Malappuram"></div>
</div>
<label for="npipe">Pipeline</label><select id="npipe">${pipes}</select>
<label for="nstage">Stage</label><select id="nstage"></select>
<label for="ntitle">What is it for</label><input id="ntitle" placeholder="Tiger 400 + laser enquiry">
<label for="nsource">Lead source</label><select id="nsource"><option value="">Not specified</option>${sources}</select>
<label>Items</label><div id="items"></div>
<button class="btn ghost" id="addrow">Add another item</button>
<label for="nval">Deal value including GST</label><input id="nval" type="number" inputmode="decimal" placeholder="0">
${assign}
<button class="btn" id="save">Save deal</button>
</div>`;
}

function itemRow(){
const opts = S.products.map(p=>`<option value="${p.id}">${esc(p.model_code?p.model_code+' — ':'')}${esc(p.name)}</option>`).join('');
const d=document.createElement('div'); d.className='three';
d.innerHTML=`<select class="p"><option value="">Select item</option>${opts}</select>
<input class="q" type="number" inputmode="decimal" value="1" placeholder="Qty">
<input class="r" type="number" inputmode="decimal" placeholder="Rate">`;
return d;
}

async function markFollowupDone(id){
const f = S.followUps.find(x=>x.id===id);
await sb.from('follow_ups').update({done:true, done_at:new Date().toISOString()}).eq('id',id);
if(f) await logActivity('followup_completed', f.deal_id, f.deals?.customers?.name || '');
loadTab();
}

async function saveTarget(id,btn){
btn.disabled=true;
const input=document.querySelector(`[data-targetinput="${id}"]`);
const v=Number(input.value||0);
await sb.from('profiles').update({monthly_sales_target:v}).eq('id',id);
const p=S.profiles.find(x=>x.id===id); if(p) p.monthly_sales_target=v;
loadTab();
}

async function runSearch(q){
q=q.trim();
if(!q){ S.search=''; S.searchResults=null; render(); return; }
S.search=q;
const like=`%${q}%`;
const [dR,cR,pR] = await Promise.all([
sb.from('deals').select('id,title,value,customers(name,phone)').ilike('title', like).limit(5),
sb.from('customers').select('id,name,phone,district').ilike('name', like).limit(5),
sb.from('products').select('id,name,model_code,category').ilike('name', like).limit(5)
]);
S.searchResults = { deals:dR.data||[], customers:cR.data||[], products:pR.data||[] };
render();
}

/* ── wiring ── */
function wire(){
const out=document.getElementById('out'); if(out) out.onclick=async()=>{ await sb.auth.signOut(); S={...S,me:null,deal:null}; renderLogin(); };
document.querySelectorAll('nav button, [data-tab]').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; S.deal=null; S.stage=null; S.sideOpen=false; loadTab(); });
const fab=document.getElementById('fab'); if(fab) fab.onclick=()=>{ S.tab='new'; loadTab(); };
const burger=document.getElementById('cdBurger'); if(burger) burger.onclick=()=>{ S.sideOpen=!S.sideOpen; render(); };
const qe=document.getElementById('qaEstimate'); if(qe) qe.onclick=()=>{ S.presetPipeline=1; S.presetStage=3; S.tab='new'; S.deal=null; loadTab(); };
const qr=document.getElementById('qaRepair'); if(qr) qr.onclick=()=>{ S.presetPipeline=3; S.presetStage=12; S.tab='new'; S.deal=null; loadTab(); };
document.querySelectorAll('[data-pipe]').forEach(b=>b.onclick=()=>{ S.pipeline=Number(b.dataset.pipe); S.stage=null; loadTab(); });
document.querySelectorAll('[data-kpipipe]').forEach(b=>b.onclick=()=>{ S.pipeline=Number(b.dataset.kpipipe); S.stage=b.dataset.kpistage?Number(b.dataset.kpistage):null; S.tab='pipeline'; S.deal=null; loadTab(); });
document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{ S.stage=b.dataset.stage?Number(b.dataset.stage):null; render(); });
document.querySelectorAll('[data-deal]').forEach(c=>c.onclick=()=>openDeal(c.dataset.deal));
document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{ S.teamRange=Number(b.dataset.range); loadTab(); });
document.querySelectorAll('[data-due]').forEach(el=>el.onclick=()=>toggleDue(el.dataset.due));
document.querySelectorAll('[data-dispatch]').forEach(b=>b.onclick=()=>markDispatched(b.dataset.dispatch,b));
document.querySelectorAll('.qa[data-tab]').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; S.deal=null; S.stage=null; loadTab(); });
document.querySelectorAll('[data-chase]').forEach(b=>b.onclick=()=>{ S.chaseTab=b.dataset.chase; render(); });
document.querySelectorAll('[data-donefu]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); markFollowupDone(b.dataset.donefu); });
document.querySelectorAll('[data-savetarget]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); saveTarget(b.dataset.savetarget,b); });
const bell=document.getElementById('bellbtn'); if(bell) bell.onclick=()=>{ const a=document.getElementById('followups-anchor'); if(a) a.scrollIntoView({behavior:'smooth'}); else if(!isOwner()){ S.tab='followups'; S.deal=null; loadTab(); } };
const gs=document.getElementById('gsearch');
if(gs){ gs.onkeydown=e=>{ if(e.key==='Enter') runSearch(gs.value); }; }

const items=document.getElementById('items');
if(items){
items.appendChild(itemRow());
document.getElementById('addrow').onclick=()=>items.appendChild(itemRow());
const pipeSel=document.getElementById('npipe'), stgSel=document.getElementById('nstage');
if(S.presetPipeline) pipeSel.value=String(S.presetPipeline);
const fill=()=>{ const pid=Number(pipeSel.value);
stgSel.innerHTML=S.stages.filter(s=>s.pipeline_id===pid)
.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
if(S.presetStage) stgSel.value=String(S.presetStage); };
pipeSel.onchange=fill; fill();
S.presetPipeline=null; S.presetStage=null;
document.getElementById('save').onclick=saveDeal;
}

/* ── Phase 2 wiring: My Leads / Add New Lead ── */
document.querySelectorAll('[data-lead]').forEach(c=>c.onclick=()=>openDeal(c.dataset.lead));
const addLeadBtn=document.getElementById('addLeadBtn');
if(addLeadBtn) addLeadBtn.onclick=()=>{ S.tab='addlead'; S.deal=null; render(); };
const cancelAddLead=document.getElementById('cancelAddLead');
if(cancelAddLead) cancelAddLead.onclick=()=>{ S.tab='pipeline'; S.deal=null; loadTab(); };
const lsearch=document.getElementById('leadsearch');
if(lsearch) lsearch.onkeydown=e=>{ if(e.key==='Enter'){ S.leadQ=lsearch.value.replace(/[,()]/g,''); applyLeadFilters(); } };
const lstage=document.getElementById('leadstagesel');
if(lstage) lstage.onchange=()=>{ S.leadStage=lstage.value?Number(lstage.value):null; applyLeadFilters(); };
const lsource=document.getElementById('leadsourcesel');
if(lsource) lsource.onchange=()=>{ S.leadSource=lsource.value?Number(lsource.value):null; applyLeadFilters(); };
document.querySelectorAll('[data-followf]').forEach(b=>b.onclick=()=>{ S.leadFollow=b.dataset.followf; applyLeadFilters(); });
const lmore=document.getElementById('leadLoadMore'); if(lmore) lmore.onclick=loadMoreLeads;

const alitems=document.getElementById('alitems');
if(alitems){
alitems.appendChild(itemRow());
document.getElementById('aladdrow').onclick=()=>alitems.appendChild(itemRow());
document.getElementById('saveLead').onclick=saveLead;
}
}

async function saveDeal(e){
const btn=e.target; btn.disabled=true; btn.textContent='Saving…';
try{
const name=document.getElementById('cname').value.trim();
if(!name) throw new Error('Customer name is needed.');
const phone=document.getElementById('cphone').value.trim();

let cid=null;
if(phone){
const { data:found } = await sb.from('customers').select('id').eq('phone',phone).limit(1);
if(found?.length) cid=found[0].id;
}
if(!cid){
const { data:c, error } = await sb.from('customers')
.insert({ name, phone:phone||null, customer_type:'retail',
district:document.getElementById('cdist').value.trim()||null, state:'Kerala' })
.select('id').single();
if(error) throw error; cid=c.id;
}

const { data:deal, error:de } = await sb.from('deals').insert({
pipeline_id:Number(document.getElementById('npipe').value),
stage_id:Number(document.getElementById('nstage').value),
customer_id:cid,
title:document.getElementById('ntitle').value.trim()||name,
value:Number(document.getElementById('nval').value||0),
amount_collected:0,
source_id:document.getElementById('nsource').value ? Number(document.getElementById('nsource').value) : null,
assigned_to:(isOwner() && document.getElementById('nassign')) ? document.getElementById('nassign').value : S.me.id
}).select('id').single();
if(de) throw de;

const rows=[...document.querySelectorAll('#items .three')].map((r,i)=>({
deal_id:deal.id,
product_id:r.querySelector('.p').value?Number(r.querySelector('.p').value):null,
qty:Number(r.querySelector('.q').value||1),
rate:Number(r.querySelector('.r').value||0),
sort_order:i+1
})).filter(r=>r.product_id);
if(rows.length) await sb.from('deal_items').insert(rows);
await logActivity('lead_created', deal.id, name);

S.tab='pipeline'; S.pipeline=Number(document.getElementById('npipe').value); loadTab();
}catch(err){
S.err=err.message||String(err); btn.disabled=false; btn.textContent='Save deal'; render();
}
}

boot();

if ('serviceWorker' in navigator) {
window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
