<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STAGEMAX CRM</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#12100E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StageMax">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
--ink:#12100E; --panel:#1B1815; --panel-2:#241F1B; --line:#332C26;
--paper:#EDE7DF; --muted:#9A8E82;
--amber:#E8A33D; --rose:#C2506B; --cyan:#4AA3B8; --green:#6E9E5C; --violet:#8A6BA8;
--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font:400 15px/1.5 Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 96px}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(18,16,14,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hbar{max-width:760px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:10px}
.mark{font:700 18px Archivo Narrow;letter-spacing:.14em;text-transform:uppercase}
.mark span{color:var(--amber)}
.who{margin-left:auto;font-size:12px;color:var(--muted)}
.who button{color:var(--muted);text-decoration:underline;font-size:12px;margin-left:8px}

/* tabs */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:11px 4px 13px;font:600 11px Archivo;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;border-top:2px solid transparent}
nav button.on{color:var(--paper);border-top-color:var(--amber)}

/* generic */
h2{font:700 13px Archivo;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:9px}
.row{display:flex;gap:10px;align-items:baseline}
.grow{flex:1;min-width:0}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.amt{font:700 16px Archivo Narrow;white-space:nowrap}
.tag{display:inline-block;font:600 10.5px Archivo;letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:var(--panel-2);color:var(--muted)}
.tag.due{background:rgba(194,80,107,.16);color:#E8899E}
.tag.paid{background:rgba(110,158,92,.16);color:#9BC489}
.empty{padding:44px 18px;text-align:center;color:var(--muted);font-size:14px}
.err{background:rgba(194,80,107,.14);border:1px solid rgba(194,80,107,.4);color:#EFA3B3;padding:11px 13px;border-radius:var(--r);margin:12px 0;font-size:13.5px}

/* stage chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;color:var(--muted)}
.chip.on{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:600}
.chip b{font-weight:700;margin-left:5px;opacity:.65}

/* forms */
label{display:block;font:600 11px Archivo;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:13px 0 5px}
input,select{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
input:focus,select:focus{outline:2px solid var(--amber);outline-offset:-1px}
.btn{width:100%;background:var(--amber);color:#1A1206;font-weight:700;padding:13px;border-radius:8px;margin-top:18px}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper);font-weight:600;margin-top:9px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 76px 1fr;gap:8px;align-items:end;margin-bottom:8px}

/* bars */
.bar{height:7px;border-radius:4px;background:var(--panel-2);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--amber)}

/* login */
.login{max-width:340px;margin:16vh auto;padding:0 18px}
.login .mark{font-size:26px;margin-bottom:6px}
.login p{color:var(--muted);font-size:13.5px;margin-bottom:20px}

.fab{position:fixed;right:16px;bottom:74px;z-index:29;background:var(--amber);color:#1A1206;width:52px;height:52px;border-radius:50%;font-size:26px;line-height:1;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.back{color:var(--muted);font-size:13px;padding:14px 0 2px}
.item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.item:last-child{border-bottom:none}
.qty{color:var(--muted);font-size:13px;white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ─────────────────────────────────────────────
PASTE YOUR TWO VALUES HERE
Supabase → Project Settings → API
───────────────────────────────────────────── */
const SUPABASE_URL = 'https://yuntnxsfwszzhcticwfr.supabase.co';
const SUPABASE_ANON = 'sb_publishable_WV9HzwnxjOjy9AzyGyvT2w_qGv825o_';
/* ───────────────────────────────────────────── */

const sb = createClient(SUPABASE_URL, SUPABASE_ANON, {
auth: { persistSession: false, autoRefreshToken: true }
});

const app = document.getElementById('app');
const rs = n => '₹' + Number(n||0).toLocaleString('en-IN');
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day = d => d ? new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : '';

let S = { me:null, tab:'pipeline', pipeline:1, stage:null, deal:null, teamRange:30,
pipelines:[], stages:[], products:[], profiles:[], deals:[], pending:[], movement:[], team:[],
dues:[], duesOpen:null, duesDeals:[], err:'' };

function isOwner(){ return S.me?.role==='owner'; }

/* ── auth ── */
async function boot(){
const { data:{ session } } = await sb.auth.getSession();
if(!session) return renderLogin();
const { data:prof } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
S.me = prof || { full_name: session.user.email, role:'cre', id: session.user.id };
await loadRefs();
await loadTab();
}

function renderLogin(msg){
app.innerHTML = `<div class="login">
<div class="mark">StageMax<span> CRM</span></div>
<p>StageMax CRM — sign in to work your leads.</p>
${msg?`<div class="err">${esc(msg)}</div>`:''}
<label for="em">Email</label><input id="em" type="email" autocomplete="username">
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
<button class="btn" id="go">Sign in</button>
</div>`;
const go = async () => {
const b=document.getElementById('go'); b.disabled=true; b.textContent='Signing in…';
const { error } = await sb.auth.signInWithPassword({
email: document.getElementById('em').value.trim(),
password: document.getElementById('pw').value
});
if(error) return renderLogin(error.message);
boot();
};
document.getElementById('go').onclick = go;
document.getElementById('pw').onkeydown = e => { if(e.key==='Enter') go(); };
}

/* ── data ── */
async function loadRefs(){
const [p,st,pr,pf] = await Promise.all([
sb.from('pipelines').select('*').eq('is_active',true).order('sort_order'),
sb.from('stages').select('*').order('sort_order'),
sb.from('products').select('*').eq('is_active',true).order('name'),
sb.from('profiles').select('*').eq('is_active',true)
]);
S.pipelines=p.data||[]; S.stages=st.data||[]; S.products=pr.data||[]; S.profiles=pf.data||[];
}

async function loadTab(){
S.err='';
try{
if(S.tab==='pipeline'){
const { data, error } = await sb.from('deals')
.select('*, customers(name,phone,district), stages(name,is_delivered,is_lost)')
.eq('pipeline_id', S.pipeline).order('created_at',{ascending:false}).limit(200);
if(error) throw error; S.deals = data||[];
}
if(S.tab==='money'){
const { data, error } = await sb.from('payments_pending').select('*');
if(error) throw error; S.pending = data||[];
}
if(S.tab==='moving'){
const { data, error } = await sb.from('product_movement').select('*');
if(error) throw error; S.movement = data||[];
}
if(S.tab==='team'){
const since = new Date(Date.now() - S.teamRange*86400000).toISOString().slice(0,10);
const { data, error } = await sb.from('cre_performance_daily').select('*').gte('day', since);
if(error) throw error; S.team = data||[];
}
if(S.tab==='dues'){
const { data, error } = await sb.from('customer_balance_summary').select('*');
if(error) throw error; S.dues = data||[]; S.duesOpen=null; S.duesDeals=[];
}
}catch(e){ S.err = e.message || String(e); }
render();
}

/* ── shell ── */
function render(){
if(S.deal) return renderDeal();
app.innerHTML = shell(
S.tab==='pipeline' ? viewPipeline() :
S.tab==='money' ? viewMoney() :
S.tab==='dues' ? viewDues() :
S.tab==='moving' ? viewMoving() :
S.tab==='team' ? viewTeam() : viewNew()
);
wire();
}

function shell(inner){
const t=(k,l)=>`<button data-tab="${k}" class="${S.tab===k?'on':''}">${l}</button>`;
return `<header><div class="hbar">
<div class="mark">StageMax<span> CRM</span></div>
<div class="who">${esc(S.me?.full_name||'')}<button id="out">Sign out</button></div>
</div></header>
<div class="wrap">${S.err?`<div class="err">${esc(S.err)}</div>`:''}${inner}</div>
${S.tab==='pipeline'?'<button class="fab" id="fab">+</button>':''}
<nav>${t('pipeline','Deals')}${t('money','Money in')}${isOwner()?t('dues','Dues'):''}${t('moving','Moving')}${isOwner()?t('team','Team'):''}${t('new','Add')}</nav>`;
}

/* ── deals ── */
function viewPipeline(){
const stages = S.stages.filter(s=>s.pipeline_id===S.pipeline);
const shown = S.stage ? S.deals.filter(d=>d.stage_id===S.stage) : S.deals;
const pipes = S.pipelines.map(p=>
`<button class="chip ${S.pipeline===p.id?'on':''}" data-pipe="${p.id}">${esc(p.name)}</button>`).join('');
const chips = [`<button class="chip ${!S.stage?'on':''}" data-stage="">All<b>${S.deals.length}</b></button>`]
.concat(stages.map(s=>{
const n=S.deals.filter(d=>d.stage_id===s.id).length;
return `<button class="chip ${S.stage===s.id?'on':''}" data-stage="${s.id}">${esc(s.name)}<b>${n}</b></button>`;
})).join('');

const cards = shown.length ? shown.map(d=>{
const bal = Number(d.value||0)-Number(d.amount_collected||0);
const paid = bal<=0 && Number(d.value)>0;
return `<div class="card" data-deal="${d.id}">
<div class="row">
<div class="grow">
<div class="name">${esc(d.customers?.name||'No customer')}</div>
<div class="sub">${esc(d.title||'')}</div>
</div>
<div style="text-align:right">
<div class="amt">${rs(d.value)}</div>
<div class="sub">${esc(d.stages?.name||'')}</div>
</div>
</div>
<div class="row" style="margin-top:9px;gap:7px">
${paid?'<span class="tag paid">Paid</span>':(Number(d.value)>0?`<span class="tag due">${rs(bal)} due</span>`:'')}
${d.customers?.district?`<span class="tag">${esc(d.customers.district)}</span>`:''}
${d.invoice_no?`<span class="tag">${esc(d.invoice_no)}</span>`:''}
<span class="sub" style="margin-left:auto">${day(d.delivered_at||d.created_at)}</span>
</div>
</div>`;
}).join('') : `<div class="empty">No deals here yet.<br>Tap + to add the first one.</div>`;

return `<div class="chips">${pipes}</div><div class="chips">${chips}</div>${cards}`;
}

/* ── deal detail ── */
async function openDeal(id){
const [{data:d},{data:items}] = await Promise.all([
sb.from('deals').select('*, customers(*), stages(*), pipelines(name)').eq('id',id).single(),
sb.from('deal_items').select('*, products(name,model_code)').eq('deal_id',id).order('sort_order')
]);
S.deal = { ...d, items: items||[] }; render();
}

function renderDeal(){
const d=S.deal, bal=Number(d.value||0)-Number(d.amount_collected||0);
const stages=S.stages.filter(s=>s.pipeline_id===d.pipeline_id);
app.innerHTML = shell(`
<button class="back" id="back">← Back to deals</button>
<div class="card">
<div class="row"><div class="grow">
<div class="name" style="font-size:18px">${esc(d.customers?.name||'No customer')}</div>
<div class="sub">${esc(d.customers?.phone||'')} ${d.customers?.district?'· '+esc(d.customers.district):''}</div>
</div><div class="amt" style="font-size:20px">${rs(d.value)}</div></div>
${d.customers?.phone?`<a class="btn ghost" style="display:block;text-align:center;text-decoration:none"
href="https://wa.me/91${esc(String(d.customers.phone).replace(/\D/g,'').slice(-10))}">Message on WhatsApp</a>`:''}
</div>

<h2>Items</h2>
<div class="card">${
d.items.length ? d.items.map(i=>`<div class="item">
<div class="grow">${esc(i.products?.name || i.product_other || 'Item')}
${i.products?.model_code?`<span class="sub"> · ${esc(i.products.model_code)}</span>`:''}</div>
<div class="qty">${Number(i.qty)} × ${rs(i.rate)}</div>
<div class="amt" style="font-size:14px">${rs(i.amount)}</div>
</div>`).join('') : '<div class="sub">No items recorded.</div>'}</div>

<h2>Money</h2>
<div class="card">
<div class="row"><div class="grow sub">Invoice total</div><div class="amt" style="font-size:14px">${rs(d.value)}</div></div>
<div class="row" style="margin-top:6px"><div class="grow sub">Received</div><div class="amt" style="font-size:14px">${rs(d.amount_collected)}</div></div>
<div class="row" style="margin-top:6px"><div class="grow sub">Balance</div>
<div class="amt" style="font-size:14px;color:${bal>0?'#E8899E':'#9BC489'}">${rs(bal)}</div></div>
<label for="col">Update amount received</label>
<input id="col" type="number" inputmode="decimal" value="${Number(d.amount_collected||0)}">
<button class="btn" id="savecol">Save payment</button>
</div>

<h2>Stage</h2>
<div class="card">
<select id="stg">${stages.map(s=>`<option value="${s.id}" ${s.id===d.stage_id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
<button class="btn ghost" id="savestg">Move stage</button>
</div>
${isOwner() ? `<h2>Assigned to</h2>
<div class="card">
<select id="assignsel">${S.profiles.map(p=>`<option value="${p.id}" ${p.id===d.assigned_to?'selected':''}>${esc(p.full_name)}</option>`).join('')}</select>
<button class="btn ghost" id="saveassign">Reassign</button>
</div>` : ''}`);
wire();

document.getElementById('back').onclick = ()=>{ S.deal=null; loadTab(); };
document.getElementById('savecol').onclick = async e=>{
e.target.disabled=true;
const v=Number(document.getElementById('col').value||0);
await sb.from('deals').update({amount_collected:v}).eq('id',d.id);
openDeal(d.id);
};
document.getElementById('savestg').onclick = async e=>{
e.target.disabled=true;
const to=Number(document.getElementById('stg').value);
await sb.from('deals').update({stage_id:to}).eq('id',d.id);
await sb.from('stage_events').insert({deal_id:d.id,from_stage_id:d.stage_id,to_stage_id:to,changed_by:S.me.id});
openDeal(d.id);
};
const sa=document.getElementById('saveassign');
if(sa) sa.onclick = async e=>{
e.target.disabled=true;
await sb.from('deals').update({assigned_to:document.getElementById('assignsel').value}).eq('id',d.id);
openDeal(d.id);
};
}

/* ── money in ── */
function viewMoney(){
if(!S.pending.length) return `<div class="empty">Nothing outstanding.<br>Every delivered deal is paid.</div>`;
const total=S.pending.reduce((a,b)=>a+Number(b.balance||0),0);
return `<h2>Outstanding · ${rs(total)}</h2>` + S.pending.map(p=>`
<div class="card">
<div class="row"><div class="grow">
<div class="name">${esc(p.customer_name)}</div>
<div class="sub">${esc(p.title||'')} ${p.invoice_no?'· '+esc(p.invoice_no):''}</div>
</div><div style="text-align:right">
<div class="amt" style="color:#E8899E">${rs(p.balance)}</div>
<div class="sub">${p.days_since_delivery} days</div>
</div></div>
${p.phone?`<a class="btn ghost" style="display:block;text-align:center;text-decoration:none"
href="https://wa.me/91${esc(String(p.phone).replace(/\D/g,'').slice(-10))}">Ask for payment</a>`:''}
</div>`).join('');
}

/* ── moving ── */
function viewMoving(){
if(!S.movement.length) return `<div class="empty">No sales recorded yet.</div>`;
const max=Math.max(...S.movement.map(m=>Number(m.units_sold||0)));
return `<h2>What is moving</h2>` + S.movement.map(m=>`
<div class="card">
<div class="row"><div class="grow">
<div class="name">${esc(m.product)}</div>
<div class="sub">${esc(m.brand||'Unassigned')}${m.category?' · '+esc(m.category):''}</div>
</div><div style="text-align:right">
<div class="amt">${Number(m.units_sold)}</div>
<div class="sub">${rs(m.revenue)}</div>
</div></div>
<div class="bar"><i style="width:${Math.round(Number(m.units_sold)/max*100)}%"></i></div>
</div>`).join('');
}

/* ── team performance (owner only) ── */
function viewTeam(){
const ranges=[{d:1,l:'Today'},{d:7,l:'7 days'},{d:30,l:'30 days'}];
const chips = ranges.map(r=>`<button class="chip ${S.teamRange===r.d?'on':''}" data-range="${r.d}">${r.l}<b></b></button>`).join('');
const byCre = {};
S.team.forEach(row=>{
const k=row.cre_id; if(!k) return;
if(!byCre[k]) byCre[k]={name:row.full_name, leads:0, value:0, money:0, replySum:0, replyN:0};
byCre[k].leads += Number(row.leads_handled||0);
byCre[k].value += Number(row.value_delivered||0);
byCre[k].money += Number(row.money_collected||0);
const reply = row.avg_reply_minutes ?? row.avg_reply_min;
if(reply!=null){ byCre[k].replySum += Number(reply); byCre[k].replyN++; }
});
const rows = Object.values(byCre).sort((a,b)=>b.money-a.money);
const totalMoney = rows.reduce((s,r)=>s+r.money,0);
const totalValue = rows.reduce((s,r)=>s+r.value,0);
const cards = rows.length ? rows.map(r=>`<div class="card">
<div class="row"><div class="grow name">${esc(r.name)}</div><div class="amt">${rs(r.money)}</div></div>
<div class="row" style="margin-top:9px;gap:7px">
<span class="tag">${r.leads} leads</span>
<span class="tag">${rs(r.value)} value</span>
${r.replyN?`<span class="tag">${Math.round(r.replySum/r.replyN)}m reply</span>`:''}
</div>
</div>`).join('') : `<div class="empty">No activity in this period.</div>`;
return `<h2>Team performance</h2><div class="chips">${chips}</div>
<div class="card">
<div class="row"><div class="grow sub">Team collected</div><div class="amt">${rs(totalMoney)}</div></div>
<div class="row" style="margin-top:6px"><div class="grow sub">Team value delivered</div><div class="amt" style="font-size:14px">${rs(totalValue)}</div></div>
</div>
${cards}`;
}

/* ── dues (owner only) ── */
function viewDues(){
if(!S.dues.length) return `<div class="empty">Nothing pending.<br>Every dealer and customer is settled up.</div>`;
const total = S.dues.reduce((a,b)=>a+Number(b.total_balance||0),0);
return `<h2>Dues · ${rs(total)}</h2>` + S.dues.map(c=>{
const open = S.duesOpen===c.customer_id;
const dealerTag = c.customer_type==='dealer' ? '<span class="tag">Dealer</span>' : '';
return `<div class="card">
<div class="row" data-due="${c.customer_id}" style="cursor:pointer">
<div class="grow">
<div class="name">${esc(c.customer_name)}</div>
<div class="sub">${dealerTag}${c.district?' '+esc(c.district):''} · ${c.pending_deals} deal${Number(c.pending_deals)===1?'':'s'} pending</div>
</div>
<div style="text-align:right">
<div class="amt" style="color:#E8899E">${rs(c.total_balance)}</div>
<div class="sub">${open?'Hide ↑':'View ↓'}</div>
</div>
</div>
${c.phone?`<a class="btn ghost" style="display:block;text-align:center;text-decoration:none;margin-top:9px"
href="https://wa.me/91${esc(String(c.phone).replace(/\D/g,'').slice(-10))}">Ask for payment</a>`:''}
${open ? `<div style="margin-top:4px">${
S.duesDeals.length ? S.duesDeals.map(d=>{
const bal=Number(d.value||0)-Number(d.amount_collected||0);
return `<div class="item" data-deal="${d.id}" style="cursor:pointer">
<div class="grow">${esc(d.title||'')}${d.invoice_no?' · '+esc(d.invoice_no):''}
<span class="sub" style="display:block">${day(d.delivered_at)}</span></div>
<div class="amt" style="font-size:14px;color:#E8899E">${rs(bal)}</div>
</div>`;
}).join('') : '<div class="sub" style="padding:9px 0">Loading…</div>'
}</div>` : ''}
</div>`;
}).join('');
}

async function toggleDue(cid){
if(S.duesOpen===cid){ S.duesOpen=null; S.duesDeals=[]; render(); return; }
S.duesOpen=cid; S.duesDeals=[]; render();
const { data, error } = await sb.from('deals')
.select('*, stages(is_delivered)')
.eq('customer_id', cid);
if(error){ S.err=error.message; render(); return; }
S.duesDeals = (data||[])
.filter(d=>d.stages?.is_delivered && (Number(d.value||0)-Number(d.amount_collected||0))>0)
.sort((a,b)=> new Date(a.delivered_at||0) - new Date(b.delivered_at||0));
render();
}

/* ── new deal ── */
function viewNew(){
const pipes=S.pipelines.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
const assign = isOwner() ? `<label for="nassign">Assign to</label><select id="nassign">
${S.profiles.map(p=>`<option value="${p.id}" ${p.id===S.me.id?'selected':''}>${esc(p.full_name)}</option>`).join('')}
</select>` : '';
return `<h2>New deal</h2>
<div class="card">
<label for="cname">Customer name</label><input id="cname" placeholder="Name on the bill">
<div class="two">
<div><label for="cphone">Phone</label><input id="cphone" inputmode="numeric" placeholder="10 digits"></div>
<div><label for="cdist">District</label><input id="cdist" placeholder="Malappuram"></div>
</div>
<label for="npipe">Pipeline</label><select id="npipe">${pipes}</select>
<label for="nstage">Stage</label><select id="nstage"></select>
<label for="ntitle">What is it for</label><input id="ntitle" placeholder="Tiger 400 + laser enquiry">
<label>Items</label><div id="items"></div>
<button class="btn ghost" id="addrow">Add another item</button>
<label for="nval">Deal value including GST</label><input id="nval" type="number" inputmode="decimal" placeholder="0">
${assign}
<button class="btn" id="save">Save deal</button>
</div>`;
}

function itemRow(){
const opts = S.products.map(p=>`<option value="${p.id}">${esc(p.model_code?p.model_code+' — ':'')}${esc(p.name)}</option>`).join('');
const d=document.createElement('div'); d.className='three';
d.innerHTML=`<select class="p"><option value="">Select item</option>${opts}</select>
<input class="q" type="number" inputmode="decimal" value="1" placeholder="Qty">
<input class="r" type="number" inputmode="decimal" placeholder="Rate">`;
return d;
}

/* ── wiring ── */
function wire(){
const out=document.getElementById('out'); if(out) out.onclick=async()=>{ await sb.auth.signOut(); S={...S,me:null,deal:null}; renderLogin(); };
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; S.deal=null; S.stage=null; loadTab(); });
const fab=document.getElementById('fab'); if(fab) fab.onclick=()=>{ S.tab='new'; loadTab(); };
document.querySelectorAll('[data-pipe]').forEach(b=>b.onclick=()=>{ S.pipeline=Number(b.dataset.pipe); S.stage=null; loadTab(); });
document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{ S.stage=b.dataset.stage?Number(b.dataset.stage):null; render(); });
document.querySelectorAll('[data-deal]').forEach(c=>c.onclick=()=>openDeal(c.dataset.deal));
document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{ S.teamRange=Number(b.dataset.range); loadTab(); });
document.querySelectorAll('[data-due]').forEach(el=>el.onclick=()=>toggleDue(el.dataset.due));

const items=document.getElementById('items');
if(items){
items.appendChild(itemRow());
document.getElementById('addrow').onclick=()=>items.appendChild(itemRow());
const pipeSel=document.getElementById('npipe'), stgSel=document.getElementById('nstage');
const fill=()=>{ const pid=Number(pipeSel.value);
stgSel.innerHTML=S.stages.filter(s=>s.pipeline_id===pid)
.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join(''); };
pipeSel.onchange=fill; fill();
document.getElementById('save').onclick=saveDeal;
}
}

async function saveDeal(e){
const btn=e.target; btn.disabled=true; btn.textContent='Saving…';
try{
const name=document.getElementById('cname').value.trim();
if(!name) throw new Error('Customer name is needed.');
const phone=document.getElementById('cphone').value.trim();

let cid=null;
if(phone){
const { data:found } = await sb.from('customers').select('id').eq('phone',phone).limit(1);
if(found?.length) cid=found[0].id;
}
if(!cid){
const { data:c, error } = await sb.from('customers')
.insert({ name, phone:phone||null, customer_type:'retail',
district:document.getElementById('cdist').value.trim()||null, state:'Kerala' })
.select('id').single();
if(error) throw error; cid=c.id;
}

const { data:deal, error:de } = await sb.from('deals').insert({
pipeline_id:Number(document.getElementById('npipe').value),
stage_id:Number(document.getElementById('nstage').value),
customer_id:cid,
title:document.getElementById('ntitle').value.trim()||name,
value:Number(document.getElementById('nval').value||0),
amount_collected:0,
assigned_to:(isOwner() && document.getElementById('nassign')) ? document.getElementById('nassign').value : S.me.id
}).select('id').single();
if(de) throw de;

const rows=[...document.querySelectorAll('#items .three')].map((r,i)=>({
deal_id:deal.id,
product_id:r.querySelector('.p').value?Number(r.querySelector('.p').value):null,
qty:Number(r.querySelector('.q').value||1),
rate:Number(r.querySelector('.r').value||0),
sort_order:i+1
})).filter(r=>r.product_id);
if(rows.length) await sb.from('deal_items').insert(rows);

S.tab='pipeline'; S.pipeline=Number(document.getElementById('npipe').value); loadTab();
}catch(err){
S.err=err.message||String(err); btn.disabled=false; btn.textContent='Save deal'; render();
}
}

boot();

if ('serviceWorker' in navigator) {
window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
