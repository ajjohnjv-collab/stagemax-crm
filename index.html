<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STAGEMAX CRM</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#12100E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StageMax">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
--ink:#12100E; --panel:#1B1815; --panel-2:#241F1B; --line:#332C26;
--paper:#EDE7DF; --muted:#9A8E82;
--amber:#E8A33D; --rose:#C2506B; --cyan:#4AA3B8; --green:#6E9E5C; --violet:#8A6BA8;
--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font:400 15px/1.5 Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 96px}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(18,16,14,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hbar{max-width:760px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:10px}
.mark{font:700 18px Archivo Narrow;letter-spacing:.14em;text-transform:uppercase}
.mark span{color:var(--amber)}
.who{margin-left:auto;font-size:12px;color:var(--muted)}
.who button{color:var(--muted);text-decoration:underline;font-size:12px;margin-left:8px}

/* tabs */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:11px 4px 13px;font:600 11px Archivo;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;border-top:2px solid transparent}
nav button.on{color:var(--paper);border-top-color:var(--amber)}

/* side nav on wider screens (desktop / computer use) */
@media (min-width:860px){
.hbar{max-width:none;padding-left:224px}
nav{top:53px;left:0;right:auto;bottom:0;width:200px;flex-direction:column;border-top:none;border-right:1px solid var(--line);padding-bottom:16px}
nav button{flex:none;text-align:left;padding:13px 20px;border-top:none;border-left:3px solid transparent}
nav button.on{border-top-color:transparent;border-left-color:var(--amber)}
.wrap{max-width:900px;margin:0 auto 0 224px;padding:20px 24px 40px}
.fab{left:216px;right:auto}
}

/* ── Owner redesign · Phase 1: shell + tokens + sidebar (owner-only; body.owner-ui is set by shell() and cleared for CRE/login) ── */
body.owner-ui{--ink:#0B0D10;--panel:#171A21;--panel-2:#1E222B;--line:#262B36;--paper:#F2F1EE;--muted:#8A93A6;--accent:#FF7A29;--accent-2:#FFB35C}
body.owner-ui .mark span,body.owner-ui .oa-link{color:var(--accent)}
body.owner-ui input:focus,body.owner-ui select:focus{outline-color:var(--accent)}
body.owner-ui .btn:not(.ghost),body.owner-ui .avatar,body.owner-ui .fab{background:var(--accent)}
body.owner-ui header{background:rgba(11,13,16,.92)}
body.owner-ui nav{background:var(--panel)}
body.owner-ui nav button.on{border-top-color:var(--accent)}
body.owner-ui .ow-brand,body.owner-ui .ow-grp,body.owner-ui .ow-title,body.owner-ui .ow-date,body.owner-ui .ow-av,body.owner-ui nav button svg{display:none}
@media (min-width:860px){
body.owner-ui{--ow-side:216px}
body.owner-ui header{position:fixed;top:0;left:var(--ow-side);right:0;height:56px;border-bottom:1px solid var(--line)}
body.owner-ui .hbar{max-width:none;height:56px;padding:0 28px;gap:14px}
body.owner-ui .hbar .mark{display:none}
body.owner-ui .ow-title{display:block;font:700 18px Archivo;letter-spacing:.01em;color:var(--paper);white-space:nowrap}
body.owner-ui .ow-date{display:inline-flex;align-items:center;margin-left:6px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font:600 11.5px Archivo;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
body.owner-ui .who{display:flex;align-items:center;gap:10px;margin-left:auto;padding:5px 6px 5px 6px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font:600 12.5px Archivo;color:var(--paper)}
body.owner-ui .ow-av{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#1A1206;font:700 12px Archivo Narrow;flex:none}
body.owner-ui .who button{margin-left:0;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-decoration:none;font:600 11.5px Archivo;background:var(--panel-2)}
body.owner-ui .who button:hover{color:var(--paper);border-color:var(--muted)}
body.owner-ui nav{top:0;bottom:0;left:0;right:auto;width:var(--ow-side);padding:0 10px 16px;overflow-y:auto;background:#12141A;border-right:1px solid var(--line);flex-direction:column;gap:2px}
body.owner-ui .ow-brand{display:flex;align-items:center;gap:10px;height:56px;margin:0 -10px 10px;padding:0 20px;border-bottom:1px solid var(--line);font:700 17px Archivo Narrow;letter-spacing:.14em;text-transform:uppercase;color:var(--paper);order:0;flex:none}
body.owner-ui .ow-brand span{color:var(--accent)}
body.owner-ui .ow-grp{display:block;margin:14px 10px 4px;font:700 10px Archivo;letter-spacing:.16em;text-transform:uppercase;color:#5E667A;flex:none}
body.owner-ui nav button{display:flex;align-items:center;gap:11px;flex:none;width:100%;padding:9px 12px;border:0;border-radius:9px;text-align:left;font:600 13.5px Archivo;letter-spacing:0;text-transform:none;color:#B7BFCF;transition:background .15s,color .15s}
body.owner-ui nav button svg{display:block;flex:none;width:18px;height:18px}
body.owner-ui nav button:hover{background:var(--panel-2);color:var(--paper)}
body.owner-ui nav button.on{background:rgba(255,122,41,.13);color:var(--accent-2);box-shadow:inset 3px 0 0 var(--accent)}
body.owner-ui nav button[data-tab="new"]{order:1;margin:0 0 4px;justify-content:center;background:var(--accent);color:#1A1206;font-weight:700;box-shadow:0 4px 14px -4px rgba(255,122,41,.55)}
body.owner-ui nav button[data-tab="new"]:hover{background:var(--accent-2);color:#1A1206}
body.owner-ui nav button[data-tab="new"].on{background:var(--accent);color:#1A1206;box-shadow:0 4px 14px -4px rgba(255,122,41,.55),inset 0 0 0 2px var(--accent-2)}
body.owner-ui .ow-grp.g1{order:10}body.owner-ui nav button[data-tab="dashboard"]{order:11}
body.owner-ui .ow-grp.g2{order:20}body.owner-ui nav button[data-tab="pipeline"]{order:21}body.owner-ui nav button[data-tab="customers"]{order:22}body.owner-ui nav button[data-tab="products"]{order:23}
body.owner-ui .ow-grp.g3{order:30}body.owner-ui nav button[data-tab="money"]{order:31}body.owner-ui nav button[data-tab="dues"]{order:32}
body.owner-ui .ow-grp.g4{order:40}body.owner-ui nav button[data-tab="dispatch"]{order:41}body.owner-ui nav button[data-tab="moving"]{order:42}body.owner-ui nav button[data-tab="repairs"]{order:43}
body.owner-ui .wrap{max-width:1480px;margin-left:max(var(--ow-side),calc(50vw - 632px));margin-right:auto;padding:80px 32px 48px}
body.owner-ui .wrap.ow-narrow{max-width:940px;margin-right:auto;margin-left:max(var(--ow-side),calc(50vw - 632px))}
body.owner-ui .fab{left:calc(var(--ow-side) + 16px)}
}

/* ── Owner redesign · Phase 2: Needs Attention command layer (replaces the .oa-grid card layout; owner dashboard only) ── */
.od-head{display:flex;align-items:center;gap:14px;margin:0 0 12px}
.od-head h2{margin:0}
.od-legend{margin-left:auto;display:flex;gap:14px;font:600 11px Archivo;color:var(--muted);white-space:nowrap}
.od-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.od-deck{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px;align-items:start}
.od-g{display:contents}
.od-tile{order:1;grid-column:span 1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 11px;display:flex;flex-direction:column;gap:3px;min-width:0;align-self:stretch}
.od-tile.t5{grid-column:span 2}
.od-tile[data-tab]{cursor:pointer;transition:background .15s,border-color .15s}
.od-tile[data-tab]:hover{background:var(--panel-2);border-color:#394055}
.od-tl{display:flex;align-items:center;gap:7px}
.od-lab{flex:1;min-width:0;font:700 10.5px Archivo;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.od-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--muted)}
.od-num{margin-top:4px;font:700 34px/1 'Archivo Narrow',Archivo,sans-serif;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.od-num.sm{font-size:28px;padding-top:3px}
.od-ctx{font-size:12px;color:var(--muted);line-height:1.35}
.od-ctx b{color:var(--paper);font-weight:600}
.tone-rose .od-num{color:#E8899E}.tone-rose .od-dot{background:#E8899E}
.tone-amber .od-num{color:var(--amber)}.tone-amber .od-dot{background:var(--amber)}
.tone-green .od-num{color:#9BC489}.tone-green .od-dot{background:#9BC489}
.od-colh{order:2;grid-column:span 2;display:flex;align-items:center;gap:8px;margin-top:6px;font:700 11px Archivo;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.od-colh.w{order:3}
.od-colh .pip{width:6px;height:6px;border-radius:2px;background:var(--accent,#FF7A29)}
.od-colh .n{font:600 11.5px Archivo;letter-spacing:0;text-transform:none;color:var(--muted)}
.od-colh .go{margin-left:auto;font:600 12px Archivo;letter-spacing:0;text-transform:none;color:var(--accent,#FF7A29);cursor:pointer}
.od-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.od-do{order:2;grid-column:span 2;display:flex;flex-direction:column;align-self:start;padding:6px}
.od-chips{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 8px 4px;font-size:12px;color:var(--muted)}
.od-chips b{color:var(--paper);font-weight:600;margin-left:3px}
.od-chips .nt{font-size:11.5px}
.od-chips .z{opacity:.55}
.od-rows{display:flex;flex-direction:column;gap:0}
.od-do .od-rows .trow{margin:0;background:none;border:0;border-radius:8px;padding:8px 8px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"st nm ra" "st sb ra";column-gap:11px;row-gap:1px;align-items:center}
.od-do .od-rows .trow+.trow{border-top:1px solid var(--line);border-radius:0}
.od-do .od-rows .trow:hover{background:var(--panel-2)}
.od-st{font:700 10px Archivo;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:6px;white-space:nowrap;min-width:74px;text-align:center}
.od-st.miss{background:rgba(194,80,107,.16);color:#E8899E}
.od-st.due{background:rgba(232,163,61,.16);color:var(--amber)}
.od-st{grid-area:st;align-self:center}
.od-rn{grid-area:nm}
.od-rs{grid-area:sb}
.od-ra{grid-area:ra}
.od-rn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.od-rn span{font-weight:400;color:var(--muted);margin-left:3px;font-size:13px}
.od-rs{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.od-ra{display:flex;gap:5px}
.od-ra .iact{width:28px;height:28px}
.od-ra .iact svg{width:15px;height:15px}
.od-empty{display:flex;align-items:center;gap:9px;padding:14px 10px;font-size:13.5px;color:var(--muted)}
.od-empty .ok{color:#9BC489;display:flex}
.od-more{margin-top:auto;padding:9px 10px 5px;font:600 12px Archivo;color:var(--accent,#FF7A29);cursor:pointer}
.od-w{order:3;grid-column:span 2;padding:11px 13px 10px;display:flex;flex-direction:column;gap:6px}
.od-wh{display:flex;align-items:center;gap:9px;min-width:0}
.od-wh[data-tab]{cursor:pointer}
.od-wt{font:700 12px Archivo;letter-spacing:.1em;text-transform:uppercase;color:var(--paper);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.od-wn{font:700 11.5px Archivo;padding:3px 9px;border-radius:999px;white-space:nowrap}
.od-wn.rose{background:rgba(194,80,107,.16);color:#E8899E}
.od-wn.amber{background:rgba(232,163,61,.16);color:var(--amber)}
.od-wn.green{background:rgba(110,158,92,.16);color:#9BC489}
.od-wh .sub{margin:0;display:flex;color:var(--muted)}
.od-w .od-chips{padding:0}
.od-w .oa-rows{gap:4px;margin-top:2px}
.od-w .oa-row{padding:6px 9px;background:var(--panel-2);border-radius:8px}
.od-w .oa-row:hover{background:#252A35}
.od-w .oa-row .grow{display:flex;align-items:baseline;gap:9px;min-width:0;overflow:hidden}
.od-w .oa-row .name{font-size:13.5px;flex:none;max-width:50%}
.od-w .oa-row .grow .sub{font-size:11.5px;margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.od-w .oa-row>.sub{flex:none;white-space:nowrap;margin:0;font-size:11.5px}
.od-w .oa-link{font-size:12px;font-weight:600}
.od-w.quiet{padding:9px 13px 8px;gap:4px}
.od-w .oa-note{font-size:11.5px;color:var(--muted)}
.od-age{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--panel-2);gap:2px}
.od-age i{display:block;height:100%}
@media (min-width:760px){
.od-deck{grid-template-columns:repeat(10,minmax(0,1fr))}
.od-tile,.od-tile.t5{grid-column:span 2}
.od-colh,.od-do{grid-column:span 10}
.od-w{grid-column:span 5}
}
@media (min-width:1180px){
.od-deck{grid-template-rows:auto auto auto auto auto auto 1fr}
.od-colh.d{grid-column:1/span 6;grid-row:2}
.od-do{grid-column:1/span 6;grid-row:3/span 5}
.od-colh.w{grid-column:7/span 4;grid-row:2}
.od-w{grid-column:7/span 4}
.od-w.w-leads{grid-row:3}.od-w.w-est{grid-row:4}.od-w.w-ord{grid-row:5}.od-w.w-bal{grid-row:6}
}

/* ── Owner Dashboard · Phase B: Money & Sales + Pipeline (owner-only; Phase 1/2 tokens, no new palette) ── */
.pb-head{flex-wrap:wrap;row-gap:8px}
.pb-per{margin-left:auto;display:flex;gap:4px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.pb-chip{font:600 12px Archivo;color:var(--muted);padding:6px 11px;border-radius:7px;white-space:nowrap;background:none;border:0;cursor:pointer}
.pb-chip:hover{color:var(--paper)}
.pb-chip.on{background:var(--paper);color:var(--ink)}
.pb-scope{font-size:12px;color:var(--muted);margin:-2px 0 11px;line-height:1.45}
.pb-scope b{color:var(--paper);font-weight:600}
.pb-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.pb-tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 11px;display:flex;flex-direction:column;gap:3px;min-width:0}
.pb-tile .od-num{font-size:30px}
.pb-tile .od-tl{min-height:21px;flex-wrap:wrap;row-gap:3px}
.pb-tile .od-lab{flex:1 1 auto;overflow:visible}
.pb-tile .pb-badge{order:3}
.pb-tile{position:relative}
.pb-tile .od-dot{position:absolute;top:14px;right:14px}
.pb-tile .od-tl{padding-right:16px}
@media (max-width:759px){.pb-tile[data-pb=delivered] .od-tl,.pb-tile[data-pb=avg] .od-tl{min-height:38px;align-items:flex-start}}
@media (min-width:760px) and (max-width:1279px){.pb-tile .od-tl{min-height:38px;align-items:flex-start}}
.pb-tile .od-ctx{min-height:32px}
.pb-tile .od-ctx [data-pbk=rev]{white-space:nowrap}
.pb-badge{font:700 9.5px Archivo;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.pb-sec{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 13px;margin-bottom:10px;font-size:12.5px;color:var(--muted)}
.pb-sec[data-tab]{cursor:pointer}
.pb-sec[data-tab]:hover{background:var(--panel-2)}
.pb-sec b{color:var(--paper);font-weight:600}
.pb-sec .pb-sl{font:700 10.5px Archivo;letter-spacing:.12em;text-transform:uppercase}
.pb-legacy{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);margin:0 0 14px;padding:0 2px}
.pb-legacy b{color:var(--paper);font-weight:600}
.pb-legacy i{font-style:normal;color:var(--amber)}
.pb-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:6px;align-items:start}
.pb-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.pb-ph{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.pb-pt{font:700 11.5px Archivo;letter-spacing:.12em;text-transform:uppercase;color:var(--paper);flex:1;min-width:0}
.pb-pn{font-size:11.5px;color:var(--muted);white-space:nowrap}
.pb-foot{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.45}
.pb-foot b{color:var(--paper);font-weight:600}
.pb-prow{padding:7px 0}
.pb-prow+.pb-prow{border-top:1px solid var(--line)}
.pb-prow .top{display:flex;align-items:baseline;gap:10px}
.pb-prow .nm{font-weight:600;font-size:13.5px;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-prow .nm span{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.pb-prow .qt{font-size:11.5px;color:var(--muted);white-space:nowrap}
.pb-prow .vl{font:700 14px 'Archivo Narrow',Archivo,sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.pb-prow .bar{height:4px;margin-top:5px}
.pb-prow.mut .nm{color:var(--muted);font-weight:500}
.pb-prow.mut .bar i{background:var(--line)}
.pb-fun+.pb-fun{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.pb-fh{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.pb-fh b{font-size:13.5px}
.pb-fh span{font-size:11.5px;color:var(--muted)}
.pb-fr{display:grid;grid-template-columns:minmax(84px,.9fr) minmax(40px,1.4fr) 34px minmax(0,auto);gap:9px;align-items:center;padding:5px 6px;margin:0 -6px;border-radius:7px;font-size:13px}
.pb-fr[data-kpipipe]{cursor:pointer}
.pb-fr[data-kpipipe]:hover{background:var(--panel-2)}
.pb-fr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-fr .bar{margin:0;height:6px}
.pb-fr .bar i{background:var(--accent,#FF7A29)}
.pb-fr .ct{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.pb-fr .vl{text-align:right;color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pb-fr.z{opacity:.55}
.pb-ft{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:5px;font-size:12px;color:var(--muted)}
.pb-ft b{color:var(--paper);font-weight:600;margin-left:3px}
.pb-od .trow{margin:0;background:none;border:0;border-radius:8px;padding:8px 6px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:3px;align-items:center;cursor:pointer}
.pb-od .trow+.trow{border-top:1px solid var(--line);border-radius:0}
.pb-od .trow:hover{background:var(--panel-2)}
.pb-od .on{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-od .os{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.pb-od .ov{grid-row:1/span 2;grid-column:2;text-align:right}
.pb-od .ov .amt{font-size:14px;display:block}
.pb-od .ov small{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.pb-od .tag{padding:2px 6px;font-size:9.5px}
.pb-err{font-size:13px;color:var(--muted)}

.cd-nav button svg{flex:none;width:21px;height:21px;stroke-width:1.85;opacity:.95}.cd-nav button>span:not(.cd-soon-tag){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-nav button.on{background:linear-gradient(135deg,var(--cd-accent),#FF6A17);color:var(--cd-accent-ink);box-shadow:0 4px 14px -4px rgba(255,122,41,.55)}

.cd-side-foot{margin:auto 12px 14px;padding-top:10px;border-top:1px solid var(--cd-line)}.cd-side-foot button{width:100%;display:flex;align-items:center;gap:13px;padding:7px 13px;border-radius:10px;font:600 13.5px Archivo;color:#B7BFCF;text-align:left;transition:background .15s,color .15s}.cd-side-foot button svg{flex:none;width:21px;height:21px;stroke-width:1.85;opacity:.95}.cd-side-foot button:hover{background:var(--cd-surface2);color:var(--cd-text)}

.cd-search{flex:1;max-width:520px;display:flex;align-items:center;gap:9px;background:var(--cd-surface);border:1px solid var(--cd-line);border-radius:10px;padding:9px 14px;color:var(--cd-muted);transition:border-color .15s}

.cd-bell{position:relative;width:38px;height:38px;border-radius:50%;background:var(--cd-surface);border:1px solid var(--cd-line);display:flex;align-items:center;justify-content:center;color:var(--cd-muted);flex:none;cursor:pointer;transition:border-color .15s}

.cd-who{display:flex;align-items:center;gap:10px}

.cd-who .meta span{display:block;font-size:10.5px;color:var(--cd-muted);text-transform:uppercase;letter-spacing:.05em}

.cd-body{padding:24px;max-width:1220px}

/* hero: greeting + sales target, one unified card with subtle brand flourish */
.cd-hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#181B22 0%,#14161C 62%,#1B140F 100%);border:1px solid var(--cd-line);border-radius:16px;padding:20px 26px;display:flex;align-items:center;gap:26px;flex-wrap:wrap;margin-bottom:20px}

.cd-target-divider{position:relative;z-index:1;width:1px;align-self:stretch;background:var(--cd-line);flex:none}.cd-target{position:relative;z-index:1;flex:1;min-width:300px;display:flex;flex-direction:column;justify-content:center;gap:12px}

.cd-target .tgt-top .isq svg{width:14px;height:14px;stroke-width:2}.cd-target .tgt-top .ttl{font:700 10.5px Archivo;letter-spacing:.06em;text-transform:uppercase;color:var(--cd-muted);white-space:nowrap}

.cd-target .bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--cd-accent),var(--cd-accent2));border-radius:5px}.cd-target .tgt-bot .pct{font:800 17px Archivo Narrow;color:var(--cd-accent);flex:none}.cd-target .tgt-div{width:1px;align-self:stretch;background:var(--cd-line);flex:none}.cd-target .tgt-stat{flex:none;text-align:left;line-height:1.3;background:none;border:none;padding:0}.cd-target .tgt-stat b{display:block;font:800 15px Archivo Narrow;color:var(--cd-text)}.cd-target .tgt-stat span{display:block;font-size:9.5px;color:var(--cd-muted);text-transform:uppercase;letter-spacing:.04em;margin-top:1px}

.cd-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:13px;margin-bottom:20px}
.cd-kpi{position:relative;background:var(--cd-surface);border:1px solid var(--cd-line);border-radius:13px;padding:15px;transition:border-color .15s,transform .15s}

.cd-kpi .chev svg{width:14px;height:14px;stroke-width:2}

.cd-panel{background:var(--cd-surface);border:1px solid var(--cd-line);border-radius:13px;padding:18px;margin-bottom:18px}

.cd-frow .grow{min-width:0;flex:1}
.cd-frow .name{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd-frow .sub{font-size:11.5px;color:var(--cd-muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd-pill{display:inline-block;font:700 10px Archivo;letter-spacing:.02em;padding:3px 8px;border-radius:6px;white-space:nowrap;flex:none}

.cd-frow .acts svg{width:14px;height:14px;stroke-width:1.9}

.cd-empty{padding:38px 20px 26px;text-align:center;color:var(--cd-muted)}
.cd-empty .isq{width:58px;height:58px;border-radius:16px;background:var(--cd-surface2);color:var(--cd-muted);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}

.cd-empty b{display:block;color:var(--cd-text);font:700 14.5px Archivo;margin-bottom:4px}

.cd-empty button{background:var(--cd-surface2);border:1px solid var(--cd-line);color:var(--cd-text);font:600 12px Archivo;padding:9px 16px;border-radius:9px}

.cd-qa{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

.cd-arow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--cd-line)}
.cd-arow:last-child{border-bottom:none}
.cd-arow .av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 11.5px Archivo Narrow;flex:none}
.cd-arow .grow{min-width:0;flex:1;font-size:12.5px;color:var(--cd-text)}

.cd-arow .grow span{display:block;color:var(--cd-muted);font-size:11px;margin-top:2px}
.cd-arow .time{font-size:10.5px;color:var(--cd-muted);flex:none;white-space:nowrap}

.cd-admsg{background:var(--cd-surface);border:1px solid var(--cd-line);border-radius:13px;padding:14px 16px;margin-bottom:18px;display:flex;gap:12px;align-items:flex-start;transition:box-shadow .3s,border-color .3s}
.cd-admsg.unread{border-color:rgba(255,122,41,.55);box-shadow:0 0 0 1px rgba(255,122,41,.18),0 0 22px -6px rgba(255,122,41,.45);animation:cdPulse 3.2s ease-in-out infinite}
@keyframes cdPulse{0%,100%{box-shadow:0 0 0 1px rgba(255,122,41,.18),0 0 22px -6px rgba(255,122,41,.45)}50%{box-shadow:0 0 0 1px rgba(255,122,41,.3),0 0 30px -4px rgba(255,122,41,.6)}}
.cd-admsg .isq{width:34px;height:34px;border-radius:10px;background:rgba(255,122,41,.15);color:var(--cd-accent);display:flex;align-items:center;justify-content:center;flex:none}

.cd-soon{padding:60px 20px;text-align:center;color:var(--cd-muted)}

/* ── Phase 2: My Leads / Add New Lead / Lead Detail (CRE) ── */
.cd-leadbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}

.cd-lead .acts a{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--cd-surface2);border:1px solid var(--cd-line);transition:border-color .15s,transform .15s}

.cd-tabs{display:flex;gap:4px;border-bottom:1px solid var(--cd-line);margin-bottom:18px;overflow-x:auto}

.cd-lead-header{background:linear-gradient(120deg,#181B22 0%,#14161C 62%,#1B140F 100%);border:1px solid var(--cd-line);border-radius:16px;padding:22px 26px;margin-bottom:20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}

.cd-est-trow{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;color:var(--cd-muted)}

.cd-est-locked{background:rgba(110,158,92,.1);border:1px solid rgba(110,158,92,.3);border-radius:11px;padding:12px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px;color:var(--green);font:700 12.5px Archivo}
.cd-est-locked svg{width:16px;height:16px;flex:none}
.cd-est-locked.stale{background:rgba(226,110,60,.12);border-color:rgba(226,110,60,.35);color:#E26E3C}
.cd-est-err{background:rgba(226,110,60,.12);border:1px solid rgba(226,110,60,.35);color:#E26E3C;border-radius:10px;padding:10px 13px;margin-top:12px;font:600 12.5px Archivo}
.cd-gst-toggle{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font:600 12.5px Archivo;color:var(--cd-text);cursor:pointer;user-select:none}
.cd-toggle{position:relative;width:38px;height:21px;flex:none}
.cd-toggle input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.cd-toggle-track{position:absolute;inset:0;background:var(--cd-surface2);border:1px solid var(--cd-line);border-radius:999px;transition:background .15s,border-color .15s}
.cd-toggle-thumb{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--cd-muted);transition:transform .15s,background .15s}
.cd-toggle input:checked ~ .cd-toggle-track{background:rgba(255,122,41,.22);border-color:var(--cd-accent)}
.cd-toggle input:checked ~ .cd-toggle-track .cd-toggle-thumb{transform:translateX(17px);background:var(--cd-accent)}
.cd-gst-state{color:var(--cd-muted);font-weight:700;font-size:11px;letter-spacing:.04em;min-width:26px}

@media (max-width:700px){
.cd-form .two,.cd-form .three{grid-template-columns:1fr}
.cd-lead-header{padding:18px}
}

@media (max-width:1000px){ .cd-kpis{grid-template-columns:repeat(3,1fr)} .cd-grid2{grid-template-columns:1fr} }
@media (max-width:860px){
.cd-side{transform:translateX(-100%)}
.cd-side.open{transform:translateX(0)}
.cd-main{margin-left:0}
.cd-burger{display:flex}
.cd-kpis{grid-template-columns:repeat(2,1fr)}
.cd-qa{grid-template-columns:repeat(2,1fr)}

}

/* ── auth ── */
async function boot(){
const { data:{ session } } = await sb.auth.getSession();
if(!session) return renderLogin();
const { data:prof } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
S.me = prof || { full_name: session.user.email, role:'cre', id: session.user.id };
S.tab = isOwner() ? 'dashboard' : 'mydash';
await loadRefs();
await loadTab();
}

function renderLogin(msg){
document.body.classList.remove('owner-ui');
app.innerHTML = `<div class="login">
<div class="mark">StageMax<span> CRM</span></div>
<p>StageMax CRM — sign in to work your leads.</p>
${msg?`<div class="err">${esc(msg)}</div>`:''}
<label for="em">Email</label><input id="em" type="email" autocomplete="username">
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
<button class="btn" id="go">Sign in</button>
</div>`;
const go = async () => {
const b=document.getElementById('go'); b.disabled=true; b.textContent='Signing in…';
const { error } = await sb.auth.signInWithPassword({
email: document.getElementById('em').value.trim(),
password: document.getElementById('pw').value
});
if(error) return renderLogin(error.message);
boot();
};
document.getElementById('go').onclick = go;
document.getElementById('pw').onkeydown = e => { if(e.key==='Enter') go(); };
}

/* ── data ── */
async function loadRefs(){
const [p,st,pr,pf,sr,br] = await Promise.all([
sb.from('pipelines').select('*').eq('is_active',true).order('sort_order'),
sb.from('stages').select('*').order('sort_order'),
sb.from('products').select('*').eq('is_active',true).order('name'),
sb.from('profiles').select('*').eq('is_active',true),
sb.from('sources').select('*').eq('is_active',true),
sb.from('brands').select('*').eq('is_active',true).order('sort_order')
]);
S.pipelines=p.data||[]; S.stages=st.data||[]; S.products=pr.data||[]; S.profiles=pf.data||[]; S.sources=sr.data||[]; S.brands=br.data||[];
}

async function loadChaseSources(){
const today = new Date().toISOString().slice(0,10);
const [revR,promR] = await Promise.all([
sb.from('deals').select('*, customers(name,phone,district), stages(name,is_lost)')
.not('revival_date','is',null).lte('revival_date', today).order('revival_date',{ascending:true}),
sb.from('deals').select('*, customers(name,phone,district), stages(name,is_delivered)')
.not('balance_promised_date','is',null).lte('balance_promised_date', today).order('balance_promised_date',{ascending:true})
]);
if(revR.error) throw revR.error; S.myRevivals = (revR.data||[]).filter(d=>d.stages?.is_lost);
if(promR.error) throw promR.error;
S.myPromises = (promR.data||[]).filter(d=>isNonRepairsPipeline(d.pipeline_id) && (Number(d.value||0)-Number(d.amount_collected||0))>0);
}

const today = new Date().toISOString().slice(0,10);
const mStart = monthStart();
// Sales-lead metrics (CRE and Owner/Admin dashboards) must not be distorted by repair jobs: leave the Repairs
// pipeline out of the open-deal set and out of the "Deals won" stage set (Repaired/Returned are is_won stages).
const dashRepId = repairsPipelineId();
let openQ = sb.from('deals').select('*, customers(name,phone,district), stages(name,is_won,is_lost,is_delivered,pipeline_id,sort_order), pipelines(name,sort_order)')
.order('created_at',{ascending:false}).limit(300);
if(dashRepId!=null) openQ = openQ.neq('pipeline_id', dashRepId);
const [openR,fuR,actR,mpR,weR] = await Promise.all([
openQ,
sb.from('follow_ups').select('*, deals(title, customers(name,phone), stages(name,is_won,is_lost,is_delivered))').eq('done',false).lte('due_date', today).order('due_date',{ascending:true}),
sb.from('activity_log').select('*, deals(title, customers(name))').order('created_at',{ascending:false}).limit(10),
sb.from('cre_performance_daily').select('*').gte('day', mStart),
sb.from('stage_events').select('deal_id,to_stage_id,changed_at').gte('changed_at', mStart)
]);
if(openR.error) throw openR.error; S.openDeals = (openR.data||[]).filter(d=>isNonRepairsPipeline(d.pipeline_id));
if(fuR.error) throw fuR.error; S.followUps = fuR.data||[];
if(actR.error) throw actR.error; S.activity = actR.data||[];
if(mpR.error) throw mpR.error; S.monthPerf = mpR.data||[];
if(weR.error) throw weR.error;
const wonStageIds = new Set(S.stages.filter(s=>s.is_won && isNonRepairsPipeline(s.pipeline_id)).map(s=>s.id));
S.monthWonIds = [...new Set((weR.data||[]).filter(r=>wonStageIds.has(r.to_stage_id)).map(r=>r.deal_id))];
}

// Global Estimates is an operational VIEW over the existing Retail Estimate
// workflow -- no new table, no estimate editor of its own. Fetches ALL
// Retail Sales deals (RLS already scopes a CRE to their own, and this has
// no row cap, unlike S.openDeals below) and buckets client-side with
// estimateGroup(). Shared verbatim by the Global Estimates screen and the
// CRE Today dashboard's Estimate KPI tiles so the two can never disagree,
// including for a shop with more than 300 active deals.
async function loadGlobalEstimates(){
const retailId = S.pipelines.find(p=>p.name==='Retail Sales')?.id;
const r = await sb.from('deals').select('*, customers(name,phone,district), stages(name,is_won,is_lost,is_delivered)')
.eq('pipeline_id', retailId||-1).order('created_at',{ascending:true});
if(r.error) throw r.error;
S.globalEstimates = (r.data||[]).filter(d=>estimateGroup(d));
}

/* ── Owner Dashboard V1 · Phase A: "Needs attention" ──────────────────────────────────────────────
   Owner-only: called from loadTab('dashboard') and rendered by viewDashboard() only. It has its own loader --
   loadDashboardShared() and loadChaseSources(), which the CRE dashboards also use, are untouched. Every "today",
   missed/overdue and ageing boundary is the shop's local calendar date (Asia/Kolkata). Repairs are excluded
   fail-CLOSED: if the Repairs pipeline cannot be resolved every figure is zero. Reads only: loading or
   navigating performs no writes. Nothing here uses the 300-row S.openDeals list. ── */
const IST_FMT = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'});
function istDate(d){
if(d===null || d==='') return '';
const x = d===undefined ? new Date() : new Date(d);
return isNaN(x.getTime()) ? '' : IST_FMT.format(x);
}
const istDayNum = s => Math.floor(Date.parse(s+'T00:00:00Z')/86400000);
function istDaysSince(ts, today){ const s=istDate(ts); return s ? istDayNum(today)-istDayNum(s) : null; }
function isDealerPipeline(pid){ return /dealer/i.test(S.pipelines.find(p=>p.id===pid)?.name||''); }
// PostgREST caps one response (1000 rows on Supabase): read every page so no figure is silently truncated.
async function fetchAllPages(build){
const out=[];
for(let from=0;;from+=1000){
const r = await build().range(from, from+999);
if(r.error) throw r.error;
const rows = r.data||[]; out.push(...rows);
if(rows.length<1000) break;
}
return out;
}
async function fetchByIds(table, sel, col, ids){
const out=[];
for(let i=0;i<ids.length;i+=100){
const r = await sb.from(table).select(sel).in(col, ids.slice(i,i+100));
if(r.error) throw r.error;
out.push(...(r.data||[]));
}
return out;
}
function attnEmpty(today){
return { today, failClosed:false, error:null,
fu:{missed:[],dueToday:[]}, prom:{missed:[],dueToday:[]}, rev:{missed:[],dueToday:[]}, fuItems:[], byCre:[],
leads:{headline:[],newToday:[],notContacted:[],noNext:[],hot:[],links:[]},
est:{sent:[],approved:[],draft:[],oldestDays:null,sentValue:0},
ord:{awaiting:[],transit:[],oldestDays:null},
bal:{total:0,customers:0,b30:0,b60:0,b60p:0,retail:0,dealer:0,top:[],promiseDue:0} };
}
/* Owner follow-up list = exactly the A1 set (non-Repairs, Asia/Kolkata day): used by the owner Follow-ups screen and the
   owner bell, so they can never disagree with the band. Empty when Phase A data is unavailable (fail-closed / error). */
function ownerChaseList(){
const A = S.ownerAttn;
if(!A || A.failClosed || A.error) return [];
const items = [...A.fu.missed, ...A.fu.dueToday, ...A.prom.missed, ...A.prom.dueToday, ...A.rev.missed, ...A.rev.dueToday];
items.sort((a,b)=> a.date<b.date ? -1 : a.date>b.date ? 1 : (a.key<b.key?-1:1));
return items;
}
async function loadOwnerAttention(){
const A = attnEmpty(istDate());
try{ await fillOwnerAttention(A); }catch(e){ A.error = (e&&e.message)||String(e); }
S.ownerAttn = A;
}
async function fillOwnerAttention(A){
const rid = repairsPipelineId();
if(rid==null){ A.failClosed = true; return; }
const today = A.today, dayN = istDayNum(today);
const nonRep = d => !!d && isNonRepairsPipeline(d.pipeline_id);
const none = ids => ids.length ? ids : [-1];
const open = S.stages.filter(s=>!s.is_won && !s.is_lost && !s.is_delivered && isNonRepairsPipeline(s.pipeline_id));
const wonOpenIds = S.stages.filter(s=>s.is_won && !s.is_delivered && isNonRepairsPipeline(s.pipeline_id)).map(s=>s.id);
const wonIds = new Set(S.stages.filter(s=>s.is_won && isNonRepairsPipeline(s.pipeline_id)).map(s=>s.id));
const firstStage = {};
S.pipelines.forEach(p=>{
if(!isNonRepairsPipeline(p.id)) return;
const o = open.filter(s=>s.pipeline_id===p.id).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
if(o[0]) firstStage[p.id] = o[0];
});
const stSel = 'stages(name,is_won,is_lost,is_delivered)';
const [fuRows, promRows, revRows, openFuRows, dealRows, ordRows, ppRows] = await Promise.all([
fetchAllPages(()=>sb.from('follow_ups').select('id,deal_id,assigned_to,due_date,contact_type,note,deals(title,pipeline_id,assigned_to,customers(name,phone),'+stSel+')').eq('done',false).lte('due_date',today).order('id')),
fetchAllPages(()=>sb.from('deals').select('id,title,value,amount_collected,balance_promised_date,assigned_to,pipeline_id,customers(name,phone),'+stSel).not('balance_promised_date','is',null).lte('balance_promised_date',today).neq('pipeline_id',rid).order('id')),
fetchAllPages(()=>sb.from('deals').select('id,title,lost_reason,revival_date,assigned_to,pipeline_id,customers(name,phone),'+stSel).not('revival_date','is',null).lte('revival_date',today).neq('pipeline_id',rid).order('id')),
fetchAllPages(()=>sb.from('follow_ups').select('id,deal_id').eq('done',false).order('id')),
fetchAllPages(()=>sb.from('deals').select('id,title,created_at,stage_id,pipeline_id,is_hot,assigned_to,estimate_sent_at,estimate_approved_at,customers(name,phone)').in('stage_id',none(open.map(s=>s.id))).neq('pipeline_id',rid).order('id')),
fetchAllPages(()=>sb.from('deals').select('id,title,value,amount_collected,dispatch_date,pipeline_id,stage_id,assigned_to,customers(name,phone)').in('stage_id',none(wonOpenIds)).neq('pipeline_id',rid).order('id')),
fetchAllPages(()=>sb.from('payments_pending').select('deal_id,customer_name,phone,title,balance,delivered_at').order('deal_id'))
]);

/* A1 · Follow-ups. Missed = unfinished follow-up dated before today; Due today = dated today. Open follow-ups are
   kept even when the deal is Delivered or Lost. Payment promises and lost-lead revivals stay identifiable kinds. */
const seen = new Set();
for(const r of fuRows){
if(seen.has(r.id) || !r.due_date) continue; seen.add(r.id);
const d = r.deals; if(!nonRep(d)) continue;
const it = {kind:'followup', key:'f'+r.id, fuId:r.id, dealId:r.deal_id, creId:r.assigned_to||d.assigned_to||null,
name:d.customers?.name||'No customer', phone:d.customers?.phone||'', detail:r.note||d.title||'Scheduled follow-up',
type:r.contact_type||'call', date:r.due_date,
isFu:true, stName:d.stages?.name, stWon:d.stages?.is_won, stLost:d.stages?.is_lost, stDelivered:d.stages?.is_delivered};
(r.due_date<today ? A.fu.missed : A.fu.dueToday).push(it); A.fuItems.push(it);
}
const seenP = new Set();
for(const d of promRows){
if(seenP.has(d.id) || !nonRep(d) || !d.balance_promised_date) continue; seenP.add(d.id);
const bal = Number(d.value||0)-Number(d.amount_collected||0); if(!(bal>0)) continue;
const it = {kind:'promise', key:'p'+d.id, dealId:d.id, creId:d.assigned_to||null, name:d.customers?.name||'No customer',
phone:d.customers?.phone||'', detail:'Payment promised · '+rs(bal), type:'whatsapp', date:d.balance_promised_date,
stName:'Payment due', stWon:true, stLost:false, stDelivered:false};
(d.balance_promised_date<today ? A.prom.missed : A.prom.dueToday).push(it);
}
const seenR = new Set();
for(const d of revRows){
if(seenR.has(d.id) || !nonRep(d) || !d.revival_date || !d.stages?.is_lost) continue; seenR.add(d.id);
const it = {kind:'revival', key:'r'+d.id, dealId:d.id, creId:d.assigned_to||null, name:d.customers?.name||'No customer',
phone:d.customers?.phone||'', detail:d.lost_reason||'Follow up on lost lead', type:'call', date:d.revival_date,
stName:d.stages?.name||'Lost', stWon:false, stLost:true, stDelivered:false};
(d.revival_date<today ? A.rev.missed : A.rev.dueToday).push(it);
}
const byDate = (a,b)=> a.date<b.date ? -1 : a.date>b.date ? 1 : (a.key<b.key?-1:1);
[A.fu,A.prom,A.rev].forEach(k=>{ k.missed.sort(byDate); k.dueToday.sort(byDate); });
const creCount = {};
A.fu.missed.forEach(i=>{ const k=i.creId||'—'; creCount[k]=(creCount[k]||0)+1; });
A.byCre = Object.entries(creCount).map(([id,n])=>({id, n, name: id==='—' ? 'Unassigned' : (S.profiles.find(p=>p.id===id)?.full_name||'Unassigned')}))
.sort((a,b)=>b.n-a.n || (a.name<b.name?-1:1));

/* A2 · Leads needing attention (open Retail/Dealer deals; Repairs never). Headline = distinct deals having at least
   one of: Not yet contacted / No next step / Hot. "New today" is information only and is not in the headline. */
const fuDeals = new Set(openFuRows.map(r=>r.deal_id));
const seenD = new Set(); const stageCount = {};
for(const d of dealRows){
if(seenD.has(d.id) || !nonRep(d)) continue; seenD.add(d.id);
const fs = firstStage[d.pipeline_id]; const isFirst = !!fs && fs.id===d.stage_id;
if(isFirst) stageCount[d.pipeline_id] = (stageCount[d.pipeline_id]||0)+1;
const cd = d.created_at ? istDayNum(istDate(d.created_at)) : NaN;
const tags = [];
if(!isNaN(cd) && cd===dayN) A.leads.newToday.push(d);
if(isFirst && !isNaN(cd) && cd<dayN){ tags.push('Not contacted'); A.leads.notContacted.push(d); }
if(isRetailPipeline(d.pipeline_id) && !isFirst && !isNaN(cd) && (dayN-cd)>=2 && !fuDeals.has(d.id) && !d.estimate_sent_at && !d.estimate_approved_at){ tags.push('No next step'); A.leads.noNext.push(d); }
if(d.is_hot){ tags.push('Hot'); A.leads.hot.push(d); }
if(tags.length) A.leads.headline.push({...d, tags});
}
A.leads.headline.sort((a,b)=>(a.created_at||'')<(b.created_at||'') ? -1 : 1);
Object.keys(stageCount).forEach(pid=>A.leads.links.push({pid:Number(pid), stageId:firstStage[pid].id, name:firstStage[pid].name, count:stageCount[pid]}));

/* A3 · Estimates: exactly the existing Global Estimates grouping (Retail only). */
await loadGlobalEstimates();
(S.globalEstimates||[]).forEach(d=>{ const g=estimateGroup(d); if(g) A.est[g].push(d); });
A.est.sent.sort((a,b)=>(a.estimate_sent_at||'')<(b.estimate_sent_at||'') ? -1 : 1);
A.est.sentValue = A.est.sent.reduce((a,d)=>a+Number(d.value||0),0);
if(A.est.sent.length && A.est.sent[0].estimate_sent_at) A.est.oldestDays = istDaysSince(A.est.sent[0].estimate_sent_at, today);

/* A4 · Orders: Won, not Delivered, non-Repairs. No dispatch_date = Awaiting Dispatch; dispatch_date = In Transit. */
const ordMap = new Map();
ordRows.forEach(d=>{ if(nonRep(d) && !ordMap.has(d.id)) ordMap.set(d.id,d); });
const awaiting = [...ordMap.values()].filter(d=>!d.dispatch_date);
const transit = [...ordMap.values()].filter(d=>d.dispatch_date);
if(awaiting.length){
const evs = await fetchByIds('stage_events','deal_id,to_stage_id,changed_at','deal_id',awaiting.map(d=>d.id));
const wonAt = {};
evs.forEach(e=>{ if(wonIds.has(e.to_stage_id) && (!wonAt[e.deal_id] || e.changed_at>wonAt[e.deal_id])) wonAt[e.deal_id]=e.changed_at; });
awaiting.forEach(d=>{ d.waitDays = wonAt[d.id] ? istDaysSince(wonAt[d.id], today) : null; });
awaiting.sort((a,b)=>(b.waitDays??-1)-(a.waitDays??-1));
const ages = awaiting.map(d=>d.waitDays).filter(n=>n!=null);
A.ord.oldestDays = ages.length ? Math.max(...ages) : null;
}
A.ord.awaiting = awaiting; A.ord.transit = transit;

/* A5 · Pending customer balances: delivered deals with a balance (payments_pending), kept only if the underlying deal's
   PIPELINE is a known non-Repairs pipeline. Retail/Dealer split is by pipeline, never by customer type. */
const dm = new Map((await fetchByIds('deals','id,pipeline_id,customer_id','id',ppRows.map(r=>r.deal_id))).map(d=>[d.id,d]));
const cust = {};
for(const r of ppRows){
const d = dm.get(r.deal_id); if(!nonRep(d)) continue;
const bal = Number(r.balance||0); if(!(bal>0)) continue;
A.bal.total += bal;
const age = istDaysSince(r.delivered_at, today);
if(age!=null){ if(age<=30) A.bal.b30+=bal; else if(age<=60) A.bal.b60+=bal; else A.bal.b60p+=bal; }
if(isRetailPipeline(d.pipeline_id)) A.bal.retail += bal; else if(isDealerPipeline(d.pipeline_id)) A.bal.dealer += bal;
const k = d.customer_id || ('n:'+r.customer_name);
if(!cust[k]) cust[k] = {id:d.customer_id||null, name:r.customer_name||'No customer', bal:0};
cust[k].bal += bal;
}
const custList = Object.values(cust).sort((a,b)=>b.bal-a.bal);
A.bal.customers = custList.length; A.bal.top = custList.slice(0,3);
A.bal.promiseDue = A.prom.missed.length + A.prom.dueToday.length;
}

const oaAgo = n => n==null ? '—' : n===0 ? 'today' : n+' day'+(n===1?'':'s');
const oaTone = (rose,amber)=> rose ? 'rose' : amber ? 'amber' : 'green';
const odCtx = h => `<div class="od-ctx">${h}</div>`;
function odTile(oa,label,tone,tab,numHtml,ctxHtml,extra=''){
return `<div class="od-tile tone-${tone}${extra}" ${tab?`data-tab="${tab}"`:''}><div class="od-tl"><span class="od-lab">${label}</span><span class="od-dot"></span></div>${numHtml}${odCtx(ctxHtml)}</div>`;
}
function oaFollowups(A){
const missed=A.fu.missed.length, due=A.fu.dueToday.length;
const kindLine=(label,k)=>`<span class="${k.missed.length||k.dueToday.length?'':'z'}">${label}<b>${k.missed.length}</b> overdue · <b>${k.dueToday.length}</b> due today</span>`;
const cre = A.byCre.slice(0,3).map(c=>`${esc(c.name)} <b>${c.n}</b>`).join(' · ');
const all = [...A.fu.missed,...A.prom.missed,...A.rev.missed].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.key<b.key?-1:1))
.concat([...A.fu.dueToday,...A.prom.dueToday,...A.rev.dueToday].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.key<b.key?-1:1)));
const row = i => {
const isMissed = i.date<A.today;
const kind = i.kind==='followup'?'Follow-up':i.kind==='promise'?'Payment promised':'Revival';
const pill = isMissed ? (i.kind==='followup'?'Missed':'Overdue') : 'Due today';
return `<div class="trow" data-deal="${i.dealId}" data-oakind="${i.kind}" style="cursor:pointer">
<div class="od-rn">${esc(i.name)} <span>${esc(i.detail)}</span></div>
<span class="od-st ${isMissed?'miss':'due'}">${pill}</span>
<div class="od-rs">${kind} · ${day(i.date)}</div>
<div class="od-ra">
${i.phone?`<a class="iact call" href="${telLink(i.phone)}" title="Call">${ic('call')}</a>`:''}
${i.phone?`<a class="iact wa" href="${waLink(i.phone)}" title="WhatsApp" target="_blank" rel="noopener">${ic('wa')}</a>`:''}
${i.kind==='followup'?`<button class="iact done" data-oadone="${i.fuId}" title="Mark done">${ic('check')}</button>`:''}
</div></div>`;
};
const tone = oaTone(missed>0, due>0);
const chips = [kindLine('Payment promises ',A.prom), kindLine('Revival reminders ',A.rev), cre?`<span>Missed by CRE ${cre}</span>`:''].filter(Boolean).join('');
return `<div class="od-g" data-oa="fu">
${odTile('fu','Follow-ups',tone,'followups',`<div class="od-num" data-k="missed">${missed}</div>`,`missed · <b data-k="due">${due}</b> due today`)}
<div class="od-colh d"><span class="pip"></span>Do now<span class="n">${all.length?`${all.length} open`:'all clear'}</span>${all.length?`<span class="go" data-tab="followups">Open Follow-ups ›</span>`:''}</div>
<div class="od-panel od-do">${chips?`<div class="od-chips">${chips}</div>`:''}
<div class="oa-rows od-rows">${all.length?all.slice(0,5).map(row).join(''):`<div class="od-empty"><span class="ok">${ic('check')}</span>Nothing missed or due today.</div>`}</div>
${all.length>5?`<div class="od-more" data-tab="followups">+ ${all.length-5} more in Follow-ups ›</div>`:''}</div></div>`;
}
function oaLeads(A){
const L=A.leads, h=L.headline;
const retailN = h.filter(d=>isRetailPipeline(d.pipeline_id)).length, dealerN = h.filter(d=>isDealerPipeline(d.pipeline_id)).length;
const nc = pf => L.notContacted.filter(d=>pf(d.pipeline_id)).length;
const row = d => `<div class="oa-row" data-deal="${d.id}"><div class="grow"><div class="name">${esc(d.customers?.name||'No customer')}</div><div class="sub">${esc(d.title||'')} · added ${day(d.created_at)}</div></div><div>${d.tags.map(t=>`<span class="tag ${t==='Hot'?'due':''}" style="margin-left:4px">${t}</span>`).join('')}</div></div>`;
const links = L.links.map(l=>`<button class="oa-link" data-kpipipe="${l.pid}" data-kpistage="${l.stageId}">View ${esc(l.name)} (${l.count})</button>`).join('');
const tone = oaTone(false, h.length>0);
return `<div class="od-g" data-oa="leads">
${odTile('leads','Leads',tone,'',`<div class="od-num" data-k="headline">${h.length}</div>`,`<b>${retailN}</b> Retail · <b>${dealerN}</b> Dealer`)}
<div class="od-colh w"><span class="pip"></span>Watchlists</div>
<div class="od-panel od-w w-leads${h.length?'':' quiet'}"><div class="od-wh"><span class="od-wt">Leads needing attention</span><span class="od-wn ${tone}">${h.length?h.length+' open':'Clear'}</span></div>
<div class="od-chips"><span>Retail · Dealer <b>${retailN}</b> · <b>${dealerN}</b></span><span>New today (information) <b data-k="newToday">${L.newToday.length}</b></span><span>Not yet contacted <b data-k="notContacted">${L.notContacted.length}</b> <span class="nt">(Retail ${nc(isRetailPipeline)} · Dealer ${nc(isDealerPipeline)})</span></span><span>No next step <b data-k="noNext">${L.noNext.length}</b></span><span>Hot <b data-k="hot">${L.hot.length}</b></span></div>
${h.length?`<div class="oa-rows">${h.slice(0,3).map(row).join('')}</div>`:''}
${links?`<div class="oa-rows">${links}</div>`:''}</div></div>`;
}
function oaEstimates(A){
const E=A.est;
const row = d => `<div class="oa-row" data-globalest="${d.id}"><div class="grow"><div class="name">${esc(d.customers?.name||'No customer')}</div><div class="sub">${esc(d.title||'')} · sent ${day(d.estimate_sent_at)}</div></div><span class="sub">${oaAgo(istDaysSince(d.estimate_sent_at,A.today))}</span></div>`;
const tone = oaTone(false, E.sent.length>0);
return `<div class="od-g" data-oa="est">
${odTile('est','Estimates',tone,'estimates',`<div class="od-num" data-k="awaiting">${E.sent.length}</div>`,`awaiting · oldest <b data-k="oldest">${E.sent.length?oaAgo(E.oldestDays):'—'}</b>`)}
<div class="od-panel od-w w-est${E.sent.length?'':' quiet'}"><div class="od-wh" data-tab="estimates"><span class="od-wt">Estimates</span><span class="od-wn ${tone}">${E.sent.length?E.sent.length+' awaiting':'Clear'}</span><span class="sub">${ic('chev')}</span></div>
<div class="od-chips"><span>Approved / Payment Pending <b data-k="approved">${E.approved.length}</b></span><span>Draft / Not Sent <b data-k="draft">${E.draft.length}</b></span></div>
${E.sent.length?`<div class="oa-note">Estimate value awaiting decision ${rs(E.sentValue)} (quoted, not sales)</div><div class="oa-rows">${E.sent.slice(0,3).map(row).join('')}</div>`:''}</div></div>`;
}
function oaOrders(A){
const O=A.ord;
const cnt=(list,pf)=>list.filter(d=>pf(d.pipeline_id)).length;
const row = d => `<div class="oa-row" data-tab="dispatch"><div class="grow"><div class="name">${esc(d.customers?.name||'No customer')}</div><div class="sub">${esc(d.title||'')} · ${isDealerPipeline(d.pipeline_id)?'Dealer':'Retail'}</div></div><span class="sub">${d.waitDays==null?'—':oaAgo(d.waitDays)}</span></div>`;

else if(key==='last'){ a=pbAddMonths(m1,-1); b=m1; }

/* ── Owner Dashboard · Phase C: "Service centre" band (owner-only, READ-ONLY, operational — NEVER sales) ─────────
   Repairs only; no ₹ value of any kind is read into or shown by this block. Fail-CLOSED: if the Repairs pipeline cannot
   be resolved nothing is computed. Shop calendar = Asia/Kolkata (IST day numbers, so day counts are whole IST days).
     Active jobs     = Repairs deals not Returned and not Unrepairable (Received / Diagnosed / Awaiting Parts / Repaired=Ready)
     Ready to return = Repaired (repaired and physically ready -- not payment, not returned)
     Returned 7d     = deals in Returned whose repairs.returned_at is inside the rolling 7 IST days (today + previous 6);
                       a missing returned_at never enters the count. Independent of the Phase B period chips.
     Unrepairable    = small separate count; never part of Active or Ready.
     Stage age       = IST days since the LATEST stage_event INTO the job's current stage; legacy jobs with no usable event fall
                       back to repairs.received_at (then deals.created_at) and are marked approximate (≈).
     Stuck           = stage age >= Received 3 / Diagnosed 7 / Awaiting Parts 14 / Ready 7 days, OR received 30+ days ago.
     Estimate awaiting decision = active job with estimate_sent_at and no estimate_approved_at (count + oldest wait only);
                       attention at 5+ days. ── */
const SC_STAGE_DAYS = { 'Received':3, 'Diagnosed':7, 'Awaiting Parts':14 };
const SC_READY_DAYS = 7, SC_CAP_DAYS = 30, SC_EST_DAYS = 5, SC_RETURNED_DAYS = 7;
function scKind(s){
const ret = !!s.is_delivered || s.name==='Returned';
const unrep = !ret && (!!s.is_lost || s.name==='Unrepairable');
const ready = !ret && !unrep && (!!s.is_won || s.name==='Repaired');
return { ret, unrep, ready, active: !ret && !unrep };
}
async function loadServiceCentre(){
const C = { today:istDate(), failClosed:false, error:null };
try{ await fillServiceCentre(C); }catch(e){ C.error = (e&&e.message)||String(e); }
S.sc = C;
}
async function fillServiceCentre(C){
const rid = repairsPipelineId();
if(rid==null){ C.failClosed = true; return; }
C.rid = rid;
// Operational columns only -- no value / amount column is selected.
C.deals = await fetchAllPages(()=>sb.from('deals').select('id,title,stage_id,pipeline_id,created_at,estimate_sent_at,estimate_approved_at,customers(name),repairs(received_at,returned_at)').eq('pipeline_id',rid).order('id'));
const kinds = new Map(S.stages.filter(s=>s.pipeline_id===rid).map(s=>[s.id,scKind(s)]));
const activeIds = C.deals.filter(d=>kinds.get(d.stage_id)?.active).map(d=>d.id);
const latest = new Map();
for(let i=0;i<activeIds.length;i+=40){
const chunk = activeIds.slice(i,i+40);
const ev = await fetchAllPages(()=>sb.from('stage_events').select('id,deal_id,to_stage_id,changed_at').in('deal_id',chunk).order('id'));
const cur = new Map(C.deals.map(d=>[d.id,d.stage_id]));
ev.forEach(e=>{
if(cur.get(e.deal_id)!==e.to_stage_id) return;
const t = Date.parse(e.changed_at); if(isNaN(t)) return;
if(!latest.has(e.deal_id) || t>latest.get(e.deal_id)) latest.set(e.deal_id,t);
});
}
C.latest = latest;
}
function scCompute(C){
const today = C.today, rid = C.rid;
const sts = S.stages.filter(s=>s.pipeline_id===rid).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
const kinds = new Map(sts.map(s=>[s.id,scKind(s)])), byId = new Map(sts.map(s=>[s.id,s]));
const label = s => scKind(s).ready ? 'Ready' : s.name;
const o = { today, active:0, stages: sts.filter(s=>scKind(s).active).map(s=>({id:s.id,name:label(s),ready:scKind(s).ready,n:0})),
stuck:[], estimate:{count:0,oldest:null,attn:0}, ready:{count:0,oldest:null,stuck:0}, returned:{count:0,undated:0,from:pbAddDays(today,-(SC_RETURNED_DAYS-1))},
unrepairable:0 };
const a = pbInstant(o.returned.from), b = pbInstant(pbAddDays(today,1));
const stageRow = new Map(o.stages.map(s=>[s.id,s]));
C.deals.forEach(d=>{
const st = byId.get(d.stage_id), k = kinds.get(d.stage_id); if(!st) return;
const rp = repairRow(d.repairs);
if(k.ret){
const t = rp&&rp.returned_at ? Date.parse(rp.returned_at) : NaN;
if(isNaN(t)) o.returned.undated++; else if(t>=a && t<b) o.returned.count++;
return;
}
if(k.unrep){ o.unrepairable++; return; }
o.active++; stageRow.get(d.stage_id).n++;
const ev = C.latest.get(d.id);
const recvTs = (rp&&rp.received_at) || d.created_at;
const approx = ev==null;
const stageAge = istDaysSince(ev!=null ? new Date(ev).toISOString() : recvTs, today);
const jobAge = istDaysSince(recvTs, today);
const thr = k.ready ? SC_READY_DAYS : SC_STAGE_DAYS[st.name];
const byStage = thr!=null && stageAge!=null && stageAge>=thr, byCap = jobAge!=null && jobAge>=SC_CAP_DAYS;
if(k.ready){ o.ready.count++; if(stageAge!=null && (o.ready.oldest==null || stageAge>o.ready.oldest.days)) o.ready.oldest = {days:stageAge,approx}; if(byStage) o.ready.stuck++; }
if(d.estimate_sent_at && !d.estimate_approved_at){
const w = istDaysSince(d.estimate_sent_at, today);
o.estimate.count++; if(w!=null){ if(o.estimate.oldest==null || w>o.estimate.oldest) o.estimate.oldest = w; if(w>=SC_EST_DAYS) o.estimate.attn++; }
}
if(byStage || byCap){
const shown = byStage ? stageAge : jobAge;   // the day count that actually made the job "stuck"
o.stuck.push({ id:d.id, title:d.title||'Untitled', customer:d.customers?.name||'', stage:label(st), stageAge, jobAge, approx, shown,
hi: byStage ? (thr>0 && stageAge>=2*thr) : (jobAge>=2*SC_CAP_DAYS), cap: byCap && !byStage });
}
});
o.stuck.sort((x,y)=>y.shown-x.shown || (y.jobAge||0)-(x.jobAge||0) || (x.id<y.id?-1:1));
return o;
}
function scCell(k,lab,num,sub,tone){
return `<div class="sc-cell ${tone||''}" data-sc="${k}" data-tab="repairs"><span class="sc-lab">${lab}</span><span class="sc-dot"></span><span class="sc-num" data-v="${num}">${num}</span><span class="sc-sub">${sub}</span></div>`;
}
function serviceCentreBand(){
const C = S.sc; if(!C) return '';
const top = extra => `<div class="sc-top"><span class="sc-t">Service centre</span><span class="sc-n">Repairs · operational, not sales</span>${extra||''}</div>`;
if(C.error) return `<div class="sc-band" data-sc="band">${top()}<div class="sc-err">Could not load the Service centre.<br><span class="sub">${esc(C.error)}</span></div></div>`;
if(C.failClosed) return `<div class="sc-band" data-sc="band">${top()}<div class="sc-err">The Repairs pipeline could not be resolved — the Service centre is hidden rather than risk showing the wrong jobs.</div></div>`;
const c = scCompute(C);
const f = y => new Date(y+'T00:00:00Z').toLocaleDateString('en-IN',{day:'numeric',month:'short',timeZone:'UTC'});
const ap = x => x==null ? '—' : (x.approx?'≈':'')+x.days+'d';
const total = c.stages.reduce((s,x)=>s+x.n,0);
const bar = total ? c.stages.filter(s=>s.n).map(s=>`<i class="${s.ready?'rdy':''}" style="flex:${s.n}"></i>`).join('') : '';
const leg = c.stages.map(s=>`<span data-st="${esc(s.name)}">${esc(s.name)} <b>${s.n}</b></span>`).join('');
const activeCell = `<div class="sc-cell" data-sc="active" data-tab="repairs"><span class="sc-lab">Active jobs</span><span class="sc-num" data-v="${c.active}">${c.active}</span><div class="sc-bar">${bar}</div><div class="sc-leg">${leg}</div></div>`;
const worst = c.stuck[0];
const stuckCell = scCell('stuck','Stuck',c.stuck.length, c.stuck.length ? `oldest <b>${worst.shown}d</b>` : 'None past threshold', c.stuck.length ? (c.stuck.some(x=>x.hi)?'rose':'amber') : 'green');
const estCell = scCell('estimate','Estimate awaiting decision',c.estimate.count, c.estimate.count ? `oldest <b>${c.estimate.oldest==null?'—':c.estimate.oldest+'d'}</b>${c.estimate.attn?` · ${c.estimate.attn} past ${SC_EST_DAYS}d`:''}` : 'None waiting', c.estimate.attn?'amber':(c.estimate.count?'':'green'));
const rdyCell = scCell('ready','Ready to return',c.ready.count, c.ready.count ? `waiting <b>${ap(c.ready.oldest)}</b> oldest` : 'None waiting', c.ready.stuck?'amber':(c.ready.count?'':'green'));
const retCell = scCell('returned','Returned · last 7 days',c.returned.count, `${esc(f(c.returned.from))} – ${esc(f(c.today))}`, '').replace('class="sc-cell ','title="Physical returns by repairs.returned_at; returned jobs with no return date are not counted" class="sc-cell ');
const rows = c.stuck.slice(0,2).map(x=>`<div class="sc-sr" data-deal="${x.id}" data-sc="stuckrow"><span class="nm">${esc(x.title)}${x.customer?` · ${esc(x.customer)}`:''}</span><span class="st">${esc(x.stage)} · ${x.stageAge==null?'stage age unknown':(x.approx?'≈':'')+x.stageAge+'d in stage'}${x.jobAge!=null&&x.jobAge>=SC_CAP_DAYS?` · received ${x.jobAge}d ago`:''}</span><span class="ag ${x.hi?'hi':''}">${x.approx?'≈':''}${x.shown}d</span></div>`).join('');
const more = c.stuck.length>2 ? `<span class="sc-more" data-sc="more" data-tab="repairs">+${c.stuck.length-2} more in Repairs →</span>` : '';
const stuckBlock = c.stuck.length ? `<div class="sc-stuck" data-sc="stucklist"><div class="sc-stl"><span>Oldest stuck jobs</span>${more}</div>${rows}</div>` : '';
const unrep = `<span class="sc-n" data-sc="unrep">Unrepairable <b style="color:var(--paper);font-weight:600">${c.unrepairable}</b> · not active</span>`;
return `<div class="sc-band" data-sc="band">${top(unrep+`<button class="sc-go" data-sc="open" data-tab="repairs">Open Repairs →</button>`)}<div class="sc-row">${activeCell}<div class="sc-metrics">${stuckCell}${estCell}${rdyCell}${retCell}</div></div>${stuckBlock}</div>`;
}

/* ── Owner Dashboard · Phase D: "Team" + "Lead sources" (owner-only, READ-ONLY apart from the existing target Save buttons) ──
   Replaces the old Team targets / Team performance / Leads-by-source donut / Recent updates / Product availability blocks.
   Uses the Phase B period chips (S.pbPeriod) -- there is no second period control. Retail Sales only: Repairs are excluded
   fail-CLOSED and Dealer deals never enter a sales, money or source figure (a small operational Dealer note is the only mention).
     Leads          = Retail deals created in the period (IST).
     Estimates sent = Retail deals whose estimate_sent_at falls in the period.
     Won / Won ₹    = EXACTLY the Phase B Sales Won set (pbCompute's rule: latest valid non-Won -> Won stage_event inside the period),
                      credited to the deal's CURRENT assignee.
     Money received = EXACTLY the Phase B dated, net-of-reversals Retail receipts, credited to the CURRENT assignee of the receipt's deal.
     Missed follow-ups = the Phase A set (S.ownerAttn.fu.missed); "scheduled" = every open follow-up (same attribution rule as Phase A).
   Attribution = the deal's current assigned_to. No assignment history exists, so re-assigning a deal moves its past wins, money
   and leads to the new assignee. Deals held by an owner/admin form an "Owner-held" row; deals with no (or an inactive) assignee form
   "Unassigned", so team totals always equal the Phase B tiles. Reply time is deliberately absent: deals.first_response_at is never written. ── */
const PD_UN = 'unassigned', PD_OWN = 'owner';
const PD_MOB_ROWS = 4; // mobile shows the first 4 rows until "Show all"
function pdWho(id){
if(id==null) return PD_UN;
const p = S.profiles.find(x=>x.id===id);
if(!p) return PD_UN;
return p.role==='cre' ? id : PD_OWN;
}
async function loadTeamSources(){
const D = { failClosed:false, error:null };
try{ await fillTeamSources(D); }catch(e){ D.error = (e&&e.message)||String(e); }
S.pd = D;
}
async function fillTeamSources(D){
const rid = repairsPipelineId();
if(rid==null || !S.pipelines.some(p=>p.name==='Retail Sales')){ D.failClosed = true; return; }
const [deals, fus] = await Promise.all([
fetchAllPages(()=>sb.from('deals').select('id,pipeline_id,stage_id,assigned_to,source_id,created_at,estimate_sent_at').neq('pipeline_id',rid).order('id')),
fetchAllPages(()=>sb.from('follow_ups').select('id,assigned_to,due_date,deals(pipeline_id,assigned_to)').eq('done',false).order('id'))
]);
D.deals = deals.filter(d=>isNonRepairsPipeline(d.pipeline_id));
D.sched = new Map(); const seen = new Set();
for(const r of fus){
if(seen.has(r.id) || !r.due_date) continue; seen.add(r.id);
const d = r.deals; if(!d || !isNonRepairsPipeline(d.pipeline_id)) continue;
const k = pdWho(r.assigned_to||d.assigned_to||null);
D.sched.set(k,(D.sched.get(k)||0)+1);
}
}
function pdCompute(D,P,c){
const R = c.R, inP = ms => ms!=null && !isNaN(ms) && ms>=R.start && ms<R.end;
const byId = new Map(D.deals.map(d=>[d.id,d]));
const rows = new Map();
const row = k => { if(!rows.has(k)) rows.set(k,{k,leads:0,est:0,won:0,wonV:0,money:0,sched:0,missed:0}); return rows.get(k); };
const dealWho = id => pdWho(byId.get(id)?.assigned_to ?? null);
S.profiles.filter(p=>p.role==='cre' && p.is_active).forEach(p=>row(p.id));
D.deals.forEach(d=>{
if(!isRetailPipeline(d.pipeline_id)) return;
if(inP(Date.parse(d.created_at))) row(pdWho(d.assigned_to)).leads++;
if(d.estimate_sent_at && inP(Date.parse(d.estimate_sent_at))) row(pdWho(d.assigned_to)).est++;
});
P.wonDeals.forEach(d=>{
const t = P.latest.get(d.id); if(t==null || !inP(t)) return;
const r = row(dealWho(d.id)); r.won++; r.wonV += Number(d.value||0);
});
P.receipts.forEach(r=>{
if(r.source==='legacy_migration' || r.occurred_at==null) return;
if(!inP(Date.parse(r.occurred_at))) return;
row(dealWho(r.deal_id)).money += Number(r.amount||0);
});
D.sched.forEach((n,k)=>{ row(k).sched += n; });
const A = S.ownerAttn, missedOk = !!A && !A.failClosed && !A.error;
if(missedOk) A.fu.missed.forEach(i=>{ row(pdWho(i.creId)).missed++; });
const nameOf = k => k===PD_OWN ? 'Owner-held' : k===PD_UN ? 'Unassigned / inactive' : (S.profiles.find(p=>p.id===k)?.full_name||'Unassigned / inactive');
const list = [...rows.values()].map(r=>({...r,name:nameOf(r.k),cre:r.k!==PD_OWN && r.k!==PD_UN,prof:S.profiles.find(p=>p.id===r.k)||null}));
const cres = list.filter(r=>r.cre).sort((a,b)=>b.missed-a.missed || b.wonV-a.wonV || (a.name<b.name?-1:1));
const rest = [PD_OWN,PD_UN].map(k=>list.find(r=>r.k===k)).filter(r=>r && (r.leads||r.est||r.won||r.wonV||r.money||r.sched||r.missed));
const out = [...cres,...rest];
const tot = out.reduce((a,r)=>({leads:a.leads+r.leads,est:a.est+r.est,won:a.won+r.won,wonV:a.wonV+r.wonV,money:a.money+r.money,missed:a.missed+r.missed,sched:a.sched+r.sched}),{leads:0,est:0,won:0,wonV:0,money:0,missed:0,sched:0});
const reconciled = tot.won===c.sales.count && Math.abs(tot.wonV-c.sales.value)<0.5 && Math.abs(tot.money-c.money.net)<0.5;
return { rows:out, tot, reconciled, missedOk };
}
function pdSourceCompute(D,P,c){
const R = c.R, inP = ms => ms!=null && !isNaN(ms) && ms>=R.start && ms<R.end;
const byId = new Map(D.deals.map(d=>[d.id,d]));
const active = new Map(S.sources.map(s=>[s.id,s.name]));
const rows = new Map();
const key = sid => sid==null ? 'unknown' : active.has(sid) ? 's'+sid : 'inactive';
const name = k => k==='unknown' ? 'Unknown' : k==='inactive' ? 'Other (inactive source)' : active.get(Number(k.slice(1)));
const row = k => { if(!rows.has(k)) rows.set(k,{k,name:name(k),leads:0,won:0,wonV:0}); return rows.get(k); };
D.deals.forEach(d=>{ if(isRetailPipeline(d.pipeline_id) && inP(Date.parse(d.created_at))) row(key(d.source_id)).leads++; });
P.wonDeals.forEach(d=>{
const t = P.latest.get(d.id); if(t==null || !inP(t)) return;
const r = row(key(byId.get(d.id)?.source_id ?? null)); r.won++; r.wonV += Number(d.value||0);
});
const all = [...rows.values()];
const un = rows.get('unknown') || {leads:0,won:0,wonV:0};
const known = all.filter(r=>r.k!=='unknown').sort((a,b)=>b.wonV-a.wonV || b.leads-a.leads || (a.name<b.name?-1:1));
const tot = all.reduce((a,r)=>({leads:a.leads+r.leads,won:a.won+r.won,wonV:a.wonV+r.wonV}),{leads:0,won:0,wonV:0});
const reconciled = tot.won===c.sales.count && Math.abs(tot.wonV-c.sales.value)<0.5;
const stg = new Map(S.stages.map(s=>[s.id,s]));
const dl = { has:S.pipelines.some(p=>isDealerPipeline(p.id)), n:0, open:0 };
D.deals.forEach(d=>{
if(!isDealerPipeline(d.pipeline_id)) return;
if(inP(Date.parse(d.created_at))) dl.n++;
const s = stg.get(d.stage_id); if(s && !s.is_lost && !s.is_delivered) dl.open++;
});
return { rows:[...(rows.has('unknown')?[rows.get('unknown')]:[]),...known], un, tot, reconciled, dealer:dl };
}
function pdPct(v,t){ return t>0 ? Math.round(v/t*100) : null; }

function pdSourcesPanel(SR,c){

if(SR.tot.leads>0 && un.leads>0) parts.push(`<b>${un.leads}</b> of <b>${SR.tot.leads}</b> leads`);
if(SR.tot.won>0 && un.won>0) parts.push(`<b>${un.won}</b> of <b>${SR.tot.won}</b> Won deals`);
const warn = parts.length ? `<div class="pd-warn" data-pdk="unknown" role="note"><b>Source not recorded</b> on ${parts.join(' and ')} — channels can't be compared until it is set.</div>` : '';
const row = r => {
return `<div class="pd-sr${r.k==='unknown'?' unk':''}" data-pd="srcrow" data-src="${esc(r.k)}"><div class="top"><span class="nm">${esc(r.name)}</span><span class="wl" data-pdk="wl" title="Won in the period (by won date) / leads created in the period — not a conversion rate"><b>${r.won}</b> / ${r.leads}</span><span class="vl" data-v="${Math.round(r.wonV)}">${rs(Math.round(r.wonV))}</span></div><div class="bar"><i style="width:${Math.round(r.wonV/max*100)}%"></i></div></div>`;
};
const quiet = !SR.rows.length ? `<div class="empty" style="padding:18px 10px">No Retail leads or Won deals in this period.</div>` : '';
const hdr = SR.rows.length ? `<div class="pd-sh"><span>Source</span><span>Won / Leads</span><span>Won ₹</span></div>` : '';
const rec = !SR.rows.length ? '' : SR.reconciled
? `<div class="pb-tot" data-pdk="srecon">Won ₹ <b>${rs(Math.round(SR.tot.wonV))}</b> = Sales Won <span class="ok" aria-label="reconciled">✓</span> · ${SR.tot.leads} Retail lead${SR.tot.leads===1?'':'s'}</div>`
: `<div class="pb-tot warn" data-pdk="srecon" role="alert">Reconciliation warning — source rows total <b>${rs(Math.round(SR.tot.wonV))}</b> but Sales Won is <b>${rs(Math.round(c.sales.value))}</b> (does not reconcile)</div>`;

${warn}${hdr}${SR.rows.map(row).join('')}${quiet}${rec}${dl}
<div class="pb-foot" data-pdk="note">Retail only · Repairs excluded</div></div>`;

function phaseDSection(){
const P = S.pb, D = S.pd;
if(!P || !D) return '';
const key = PB_PERIODS.some(p=>p[0]===S.pbPeriod) ? S.pbPeriod : 'month';
const head = `<div class="od-head pd-head"><h2 id="pd-anchor" style="margin-top:0">Team &amp; lead sources</h2><span class="pd-per">uses the period chosen in Money &amp; sales</span></div>`;

await loadPhaseB();

if(perfErr) throw perfErr; S.myPerf = perfData||[];
await loadChaseSources();
await loadDashboardShared();
// The CRE Today dashboard's three Estimate KPI tiles (cdKpis) must never
// disagree with Global Estimates just because a shop has passed the

// (used by unrelated tiles/modules too), load the SAME uncapped Retail

if(S.tab==='followups' && isOwner()) await loadOwnerAttention();

if(S.tab==='dues'){
const { data, error } = await sb.from('customer_balance_summary').select('*');
if(error) throw error; S.dues = data||[]; S.duesOpen=null; S.duesDeals=[];
}
if(S.tab==='customers'){
// Customers directory: one lightweight query, no deal-count/recent-activity
// aggregation in V1 (would require a second broad query) and no N+1.
let q = sb.from('customers').select('id,name,phone,alt_phone,district').order('name');
if(S.custSearch) q = q.or(`name.ilike.%${S.custSearch}%,phone.ilike.%${S.custSearch}%,alt_phone.ilike.%${S.custSearch}%`);
const { data, error } = await q;
if(error) throw error; S.customers = data||[];
}
if(S.tab==='products'){
// Products directory: a separate, unfiltered query (both active and
// inactive) so Owner can find and reactivate a retired product -- kept
// deliberately apart from S.products (the is_active-only cache loadRefs()
// keeps for the Estimate picker) so nothing about that existing, working
// path changes.
const { data, error } = await sb.from('products').select('*, brands(name)').order('name');
if(error) throw error; S.productsList = data||[];
}
if(S.tab==='dispatch'){
// Repairs are returned physically via the Repairs stage workflow only -- never through Dispatch.
const dispRepId = repairsPipelineId();
const readyIds = S.stages.filter(s=>s.is_won && !s.is_delivered && !isRepairsPipeline(s.pipeline_id)).map(s=>s.id);
let sentQ = sb.from('deals').select('*, customers(name,phone,district)')
.not('courier_name','is',null).order('dispatch_date',{ascending:false}).limit(25);
if(dispRepId!=null) sentQ = sentQ.neq('pipeline_id', dispRepId);
const [r1,r2] = await Promise.all([
sb.from('deals').select('*, customers(name,phone,district,address), stages(name)')
.in('stage_id', readyIds.length?readyIds:[-1]).order('created_at',{ascending:true}),
sentQ
]);
if(r1.error) throw r1.error; if(r2.error) throw r2.error;
S.dispatchReady = r1.data||[]; S.dispatchSent = r2.data||[];
}
if(S.tab==='orders'){

// Retail deal IS the order record -- no separate orders table, no new
// pipeline stages. dispatch_date (not courier_name) is the authoritative
// signal for Awaiting Dispatch vs In Transit; that split happens client-side
// in viewOrders() from the single "open" query below.
const retailId = S.pipelines.find(p=>p.name==='Retail Sales')?.id;
const openIds = S.stages.filter(s=>s.pipeline_id===retailId && s.is_won && !s.is_delivered).map(s=>s.id);
const deliveredIds = S.stages.filter(s=>s.pipeline_id===retailId && s.is_delivered).map(s=>s.id);
const [r3,r4] = await Promise.all([
sb.from('deals').select('*, customers(name,phone,district,address), stages(name,is_won,is_lost,is_delivered)')
.in('stage_id', openIds.length?openIds:[-1]).order('created_at',{ascending:true}),
sb.from('deals').select('*, customers(name,phone,district,address), stages(name,is_won,is_lost,is_delivered)')
.in('stage_id', deliveredIds.length?deliveredIds:[-1]).order('delivered_at',{ascending:false}).limit(50)
]);
if(r3.error) throw r3.error; if(r4.error) throw r4.error;
S.ordersOpen = r3.data||[]; S.ordersDelivered = r4.data||[];
}
if(S.tab==='estimates'){
await loadGlobalEstimates();
}
if(S.tab==='repairs'){
// Shared queue: every authenticated user sees every Repairs deal. No assigned_to filter.
const rid = repairsPipelineId();
if(rid==null){ S.repairQueue = []; }
else {
const { data, error } = await sb.from('deals')
.select('id,title,created_at,stage_id,pipeline_id, customers(name,phone,district), stages(name,is_won,is_lost,is_delivered), repairs(brand_id,brand_other,model,fault_reported,received_at,returned_at, brands(name))')
.eq('pipeline_id', rid).order('created_at',{ascending:false}).limit(500);
if(error) throw error; S.repairQueue = data||[];
}
}
}catch(e){ S.err = e.message || String(e); }
render();
}

/* ── deal detail ── */
// Which deal-detail tabs exist per pipeline kind. Repairs: Overview + Estimate only. Retail keeps its five tabs.
// Any other pipeline (Dealer) keeps today's tab list and still has NO working Estimate screen (its Estimate tab is the
// existing "coming soon" panel, reachable only by an explicit click).
function dealKind(pid){ return isRepairsPipeline(pid) ? 'repairs' : (isRetailPipeline(pid) ? 'retail' : 'other'); }
function normalizeDealTab(pid, tab){
const valid = dealKind(pid)==='repairs' ? ['overview','estimates'] : ['overview','followups','estimates','orders','notes'];
return valid.includes(tab) ? tab : 'overview';
}
async function openDeal(id, tab){
const [{data:d},{data:items},{data:fups},{data:notes},{data:receipts}] = await Promise.all([
sb.from('deals').select('*, customers(*), stages(*), pipelines(name), sources(name)').eq('id',id).single(),
sb.from('deal_items').select('*, products(name,model_code)').eq('deal_id',id).order('sort_order'),
sb.from('follow_ups').select('*').eq('deal_id',id).order('due_date'),
sb.from('notes').select('*').eq('deal_id',id).order('created_at',{ascending:false}),
sb.from('receipts').select('*').eq('deal_id',id).order('created_at',{ascending:false})
]);
S.deal = { ...d, items: items||[] }; S.dealFollowUps = fups||[]; S.dealNotes = notes||[]; S.dealReceipts = receipts||[];
S.dealRepair = null; S.repairEditing = false;
if(isRepairsPipeline(d.pipeline_id)){
// Intake row may be missing for legacy Repairs deals -- maybeSingle() yields null, never throws.
const { data:rp } = await sb.from('repairs').select('*, brands(name)').eq('deal_id',id).maybeSingle();
S.dealRepair = rp || null;
}
// A tab chosen explicitly (Create Estimate, a Global Estimates row) is honoured when this pipeline has it. Otherwise the
// previous deal's tab only carries over to another deal of the SAME kind; moving between Retail / Repair / Dealer
// always starts on Overview, so a stale Estimate (or Orders / Notes) tab can never leak into the wrong screen.
const dkind = dealKind(d.pipeline_id);
S.dealTab = normalizeDealTab(d.pipeline_id, tab || (S.dealTabKind===dkind ? S.dealTab : 'overview'));
S.dealTabKind = dkind;
try{ await resolveReceiptRecorders(S.dealReceipts); }catch(e){ /* name resolution is best-effort -- never blocks the deal page */ }
render();
}
